<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>End of Watch — SCSO</title>
<meta name="description" content="Honoring the members of the Shelby County Sheriff's Office who have reached their End of Watch.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://johnharveyusa.github.io/deceased_scso/">
<meta property="og:title" content="SCSO End of Watch Memorial">
<meta property="og:description" content="Honoring the members of the Shelby County Sheriff's Office who have reached their End of Watch. Gone but never forgotten.">
<meta property="og:image" content="https://johnharveyusa.github.io/deceased_scso/facebook-banner.png">
<meta property="og:image:secure_url" content="https://johnharveyusa.github.io/deceased_scso/facebook-banner.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Gold Shelby County Sheriff badge with the words End of Watch">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://johnharveyusa.github.io/deceased_scso/facebook-banner.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* COLORS */
  --bg:#0e110a;
  --surface:#141a0f;
  --surface2:#1c2415;
  --border:#2e3d22;
  --khaki:#d4c484;
  --khaki-light:#ede6b8;
  --khaki-dim:#8a7e52;
  --green-row:#1a2c10;      /* alternating row A — dark forest green */
  --green-row2:#243818;     /* slightly lighter for hover */
  --khaki-row:#2c2a15;      /* alternating row B — dark khaki/olive */
  --khaki-row2:#373519;
  --green-accent:#6db33f;
  --green-mid:#4a7a28;
  --text-bright:#ede8d2;
  --text:#cec99a;
  --muted:#7a7552;
  --lod:#9b2020;
  --lod-text:#ffb0b0;
  --lod-row:#2c1010;
  --lod-row2:#3a1414;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Crimson Pro',Georgia,serif;font-size:16px;display:flex;flex-direction:column}

/* ── HEADER ── */
header{
  background:linear-gradient(180deg,#101608 0%,#0e110a 100%);
  border-bottom:2px solid var(--green-mid);
  padding:12px 16px 10px;
  text-align:center;
  position:sticky;top:0;z-index:100;flex-shrink:0;
}
.star-row{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:4px}
.sl{height:1px;flex:1;max-width:60px;background:linear-gradient(90deg,transparent,var(--green-mid))}
.sr{height:1px;flex:1;max-width:60px;background:linear-gradient(90deg,var(--green-mid),transparent)}
.star-icon{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(212,196,132,.55))}
.supertitle{font-family:'Cinzel',serif;font-size:11px;letter-spacing:4px;color:var(--text-bright);margin-bottom:2px}
h1{font-family:'Cinzel',serif;font-size:26px;font-weight:700;color:var(--khaki);letter-spacing:6px;text-shadow:0 0 24px rgba(212,196,132,.4);line-height:1}
.subtitle{font-family:'Cinzel',serif;font-size:11px;color:var(--green-accent);letter-spacing:3px;margin-top:3px;opacity:.9}
.stats-row{display:flex;justify-content:center;gap:20px;margin-top:8px}
.stat-chip{font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;color:var(--text-bright);display:flex;align-items:center;gap:4px}
.stat-chip b{color:var(--khaki);font-size:13px;font-weight:600}

/* ── SHEET STATUS BAR ── */
#sheetBar{padding:5px 12px;background:#0a1208;border-bottom:1px solid var(--border);font-family:'Cinzel',serif;font-size:11px;letter-spacing:1.5px;color:var(--text-bright);display:flex;align-items:center;gap:6px;flex-shrink:0}
#sheetDot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
#sheetDot.live{background:var(--green-accent)}

/* ── CONTROLS ── */
.controls{padding:9px 12px 7px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.search-wrap{position:relative;margin-bottom:7px}
.search-wrap input{width:100%;background:#f4efd9;border:2px solid var(--khaki);border-radius:6px;padding:11px 12px 11px 38px;color:#1a1a12;font-family:'Crimson Pro',serif;font-size:18px;font-weight:600;outline:none;transition:border .2s}
.search-wrap input:focus{border-color:var(--green-accent);background:#ffffff}
.search-wrap input::placeholder{color:#5a5438;font-style:italic;font-weight:400;opacity:1}
.s-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text);font-size:15px;pointer-events:none}
.pills{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:7px 14px;border-radius:20px;border:1px solid var(--khaki-dim);background:rgba(212,196,132,.06);color:var(--khaki-light);font-family:'Cinzel',serif;font-size:12px;font-weight:600;letter-spacing:1.5px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;cursor:pointer;transition:all .18s;flex-shrink:0}
.pill.active,.pill:hover{background:rgba(74,122,40,.35);border-color:var(--green-accent);color:#ffffff}
.pill:focus-visible{outline:2px solid var(--khaki);outline-offset:2px}
.pill .n{display:inline-block;background:rgba(109,179,63,.25);color:var(--text-bright);border-radius:8px;padding:1px 6px;margin-left:4px;font-size:11px;text-decoration:none}

/* ── LIST ── */
.list-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rank-group{margin-bottom:2px}
.rank-hdr{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg);border-top:1px solid var(--border);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.rank-lbl{font-family:'Cinzel',serif;font-size:12px;font-weight:600;letter-spacing:3px;color:var(--green-accent);flex:1}
.rank-cnt{font-family:'Cinzel',serif;font-size:10.5px;color:var(--text);letter-spacing:1px}

/* ── TABLE ROWS — alternating green / khaki ── */
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;transition:background .12s;border-bottom:1px solid rgba(46,61,34,.5)}
.row:nth-child(odd){background:var(--green-row)}
.row:nth-child(even){background:var(--khaki-row)}
.row.lod{background:var(--lod-row) !important}
.row:nth-child(odd):hover{background:var(--green-row2)}
.row:nth-child(even):hover{background:var(--khaki-row2)}
.row.lod:hover{background:var(--lod-row2) !important}
.row-star{width:22px;flex-shrink:0;text-align:center;font-size:11px;color:var(--green-accent);opacity:.7}
.row.lod .row-star{color:var(--lod-text)}
.row-info{flex:1;min-width:0}
.row-name{font-family:'Crimson Pro',serif;font-size:15px;font-weight:600;color:var(--text-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-family:'Cinzel',serif;font-size:10px;letter-spacing:1.5px;color:var(--khaki);margin-top:1px}
.row-yr{font-family:'Cinzel',serif;font-size:13px;color:var(--khaki);flex-shrink:0;min-width:32px;text-align:right}
.lod-tag{display:inline-block;background:rgba(155,32,32,.22);border:1px solid rgba(155,32,32,.5);border-radius:3px;font-family:'Cinzel',serif;font-size:9px;letter-spacing:1px;color:var(--lod-text);padding:1px 4px;margin-left:5px;vertical-align:middle}
.empty{text-align:center;padding:60px 20px;color:var(--text)}
.empty p{font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;margin-top:10px}

/* ── DETAIL OVERLAY ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;display:none;align-items:flex-end}
.overlay.open{display:flex}
.panel{
  background:linear-gradient(180deg,#1e2a12 0%,#191f0d 100%);
  border-top:2px solid var(--green-mid);
  border-radius:16px 16px 0 0;
  width:100%;max-height:82vh;
  overflow-y:auto;
  padding:16px 20px 36px;
  animation:up .25s ease;
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.handle{width:38px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}

/* badge */
.badge-wrap{text-align:center;margin-bottom:14px}
.badge-img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 4px 14px rgba(0,0,0,.75))}

.d-name{font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:var(--khaki-light);letter-spacing:2px;line-height:1.3;margin-bottom:3px;text-align:center}
.d-rank-line{font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;color:var(--green-accent);margin-bottom:14px;text-align:center}
.d-divider{height:1px;background:var(--border);margin:0 0 14px}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.d-field label{font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:2px;color:var(--text);display:block;margin-bottom:3px}
.d-field p{font-family:'Crimson Pro',serif;font-size:16px;color:var(--text-bright)}
.d-notes{background:rgba(14,17,10,.6);border-left:3px solid var(--green-mid);padding:8px 12px;border-radius:0 4px 4px 0;font-style:italic;font-size:13px;color:var(--khaki-dim);margin-top:4px;line-height:1.5}
.btn-close{
  width:100%;margin-top:18px;padding:13px;
  background:rgba(74,122,40,.18);
  border:1px solid var(--green-mid);
  border-radius:6px;
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:4px;
  color:var(--green-accent);cursor:pointer;
  transition:all .15s;
}
.btn-close:hover{background:rgba(74,122,40,.32);border-color:var(--green-accent)}

.row-emp{color:var(--khaki)}
.d-emp{font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;color:var(--khaki);text-align:center;margin:-8px 0 14px}
.d-emp.blank{color:var(--text);font-size:10.5px}
.d-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.d-btn{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:6px;border:1px solid var(--khaki-dim);background:rgba(14,17,10,.55);color:var(--text-bright);font-family:'Cinzel',serif;font-size:12px;letter-spacing:2px;text-decoration:none;cursor:pointer;text-align:left;transition:all .15s}
.d-btn:hover{border-color:var(--khaki);background:rgba(212,196,132,.08)}
.d-btn .ic{font-size:16px;width:20px;text-align:center}
.d-btn small{display:block;font-family:'Crimson Pro',serif;font-size:14px;letter-spacing:0;color:var(--text);font-style:italic;margin-top:2px;text-transform:none}
.d-btn.primary{border-color:var(--green-mid);background:rgba(74,122,40,.18)}
.d-help{font-size:14px;color:var(--text);font-style:italic;text-align:center;margin-top:10px;line-height:1.4}
.d-edit{margin-top:14px;padding:14px;border:1px solid var(--khaki-dim);border-radius:8px;background:rgba(14,17,10,.7)}
.d-edit h3{font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;color:var(--khaki);margin-bottom:10px;font-weight:600}
.d-edit label{display:block;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:2px;color:var(--text);margin:10px 0 4px}
.d-edit input{width:100%;background:#0e110a;border:1px solid var(--border);border-radius:5px;padding:9px 10px;color:var(--text-bright);font-family:'Crimson Pro',serif;font-size:16px;outline:none}
.d-edit input:focus{border-color:var(--khaki)}
.d-edit .hint{font-size:14px;color:var(--text);font-style:italic;margin-top:3px}
.d-edit .err{font-size:13px;color:var(--lod-text);margin-top:8px;min-height:1em}
.d-edit-row{display:flex;gap:8px;margin-top:12px}
.d-edit-row button{flex:1;padding:11px;border-radius:6px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;cursor:pointer;border:1px solid var(--khaki-dim);background:transparent;color:var(--text)}
.d-edit-row button.save{border-color:var(--green-mid);background:rgba(74,122,40,.25);color:var(--green-accent)}
#saveBar{display:none;align-items:center;gap:10px;padding:8px 12px;background:#2c2a15;border-bottom:1px solid var(--khaki-dim);flex-shrink:0}
#saveBar.show{display:flex}
#saveBar span{flex:1;font-size:15px;color:var(--khaki-light)}
#saveBar button{padding:8px 12px;border-radius:5px;border:1px solid var(--khaki);background:rgba(212,196,132,.15);color:var(--khaki-light);font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:1.5px;cursor:pointer;white-space:nowrap}
#saveBar button.ghost{border-color:var(--khaki-dim);background:transparent;color:var(--text)}
#adminLink{display:inline-block;margin:0 4px;padding:4px 10px;border:1px solid var(--khaki-dim);border-radius:4px;color:var(--khaki-light);font-size:11px;letter-spacing:2px;text-decoration:none;vertical-align:middle}
#adminLink:hover{background:rgba(212,196,132,.12)}
.d-obit{margin-top:14px;background:rgba(14,17,10,.6);border:1px solid var(--khaki-dim);border-radius:8px;padding:14px 16px}
.d-obit h4{font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;color:var(--khaki);margin-bottom:8px;font-weight:600}
.d-obit .txt{font-family:'Crimson Pro',serif;font-size:17px;line-height:1.55;color:var(--text-bright);white-space:pre-wrap;overflow-wrap:anywhere}
.d-obit .txt.clip{max-height:260px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.d-obit .more{margin-top:8px;background:none;border:1px solid var(--khaki-dim);border-radius:5px;color:var(--khaki-light);font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;padding:7px 12px;cursor:pointer}
.d-obit .src{margin-top:8px;font-size:14px;color:var(--text);font-style:italic}
.d-obit .src a{color:var(--khaki-light)}
.d-edit textarea{width:100%;min-height:160px;background:#0e110a;border:1px solid var(--border);border-radius:5px;padding:9px 10px;color:var(--text-bright);font-family:'Crimson Pro',serif;font-size:16px;line-height:1.45;outline:none;resize:vertical}
.d-edit textarea:focus{border-color:var(--khaki)}
.officer-photo{width:150px;height:180px;object-fit:cover;border-radius:8px;border:2px solid var(--khaki);box-shadow:0 4px 18px rgba(0,0,0,.6)}
.photo-badge{width:44px;height:44px;object-fit:contain;vertical-align:middle;margin-left:-18px;margin-bottom:-8px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.8))}
.ph-edit{display:flex;gap:12px;align-items:center;margin-top:4px}
.ph-edit img{width:70px;height:84px;object-fit:cover;border-radius:5px;border:1px solid var(--khaki-dim)}
.ph-edit .ph-none{width:70px;height:84px;border:1px dashed var(--khaki-dim);border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:12px;text-align:center}
.ph-btns{display:flex;flex-direction:column;gap:6px;flex:1}
.ph-btns label.pick,.ph-btns button{display:block;margin:0;text-align:center;padding:10px;border-radius:6px;border:1px solid var(--khaki);background:rgba(212,196,132,.12);color:var(--khaki-light);font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;cursor:pointer}
.ph-btns button{border-color:var(--khaki-dim);background:transparent;color:var(--text)}
#adminTools{display:none;gap:8px;margin-top:8px}
#shareBtn{margin-top:16px;padding:12px 22px;border-radius:24px;border:1px solid #d4c484;background:#d4c484;color:#1a1a12;font-family:'Cinzel',serif;font-size:14px;font-weight:700;letter-spacing:2px;cursor:pointer}
.share-sel{width:100%;padding:12px;font-size:17px;border-radius:6px;border:1px solid var(--khaki-dim);background:#fff;color:#111;margin:6px 0 14px}
.share-kind input{width:22px!important;height:22px;margin:0 12px 0 0!important;flex:0 0 auto}
.share-kind label{display:flex!important;align-items:center;font-size:17px;margin:6px 0;color:var(--text-bright);letter-spacing:0;font-family:inherit;text-transform:none}
#howtoBtn{flex:0 0 auto;padding:11px 16px;border-radius:6px;border:1px solid var(--khaki-dim);background:transparent;color:var(--text-bright);font-family:'Cinzel',serif;font-size:12px;letter-spacing:2px;cursor:pointer}
.howto-video{width:100%;border-radius:8px;border:1px solid var(--khaki-dim);background:#000;margin-top:6px}
#addOfficerBtn{display:block;flex:1;width:auto;margin-top:0;padding:11px;border-radius:6px;border:2px solid var(--khaki);background:rgba(212,196,132,.16);color:var(--khaki-light);font-family:'Cinzel',serif;font-size:13px;font-weight:600;letter-spacing:3px;cursor:pointer}
#addOfficerBtn:hover{background:rgba(212,196,132,.28)}
.d-edit select{width:100%;background:#0e110a;border:1px solid var(--border);border-radius:5px;padding:9px 10px;color:var(--text-bright);font-family:'Crimson Pro',serif;font-size:16px;outline:none}
.d-remove{margin-top:14px;width:100%;padding:10px;border-radius:6px;border:1px solid rgba(155,32,32,.6);background:transparent;color:var(--lod-text);font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;cursor:pointer}
.d-setup ol{margin:8px 0 8px 20px;font-size:16px;line-height:1.55;color:var(--text-bright)}
.d-setup a{color:var(--khaki-light)}
.d-setup b{color:var(--khaki)}
.d-gal{margin-top:14px;background:rgba(14,17,10,.6);border:1px solid var(--khaki-dim);border-radius:8px;padding:14px 16px}
.d-gal h4{font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;color:var(--khaki);margin-bottom:10px;font-weight:600}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gal-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--khaki-dim);cursor:zoom-in;background:#0e110a}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:400;display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#lightbox.open{display:flex}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.gal-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:4px}
.gal-edit .t{position:relative}
.gal-edit .t img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;border:1px solid var(--khaki-dim)}
.gal-edit .t button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(0,0,0,.75);color:#fff;font-size:14px;line-height:24px;cursor:pointer;padding:0}
.gal-add{display:block;margin-top:8px;text-align:center;padding:10px;border-radius:6px;border:1px solid var(--khaki);background:rgba(212,196,132,.12);color:var(--khaki-light);font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#2c2a15;border:1px solid var(--khaki);color:var(--khaki-light);padding:12px 18px;border-radius:8px;font-size:16px;z-index:500;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.need-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;border:1px dashed var(--khaki);background:rgba(212,196,132,.08);color:var(--khaki-light);font-family:'Cinzel',serif;font-size:12px;font-weight:600;letter-spacing:1.5px;cursor:pointer}
.need-btn.on{background:#d4c484;color:#1a1a12;border-style:solid}
.rank-need{margin-left:auto;padding:3px 9px;border-radius:12px;border:1px dashed var(--khaki-dim);background:transparent;color:var(--khaki-light);font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px;cursor:pointer}
.rank-need.on{background:#d4c484;color:#1a1a12;border-style:solid}
.noobit-tag{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:3px;border:1px dashed var(--khaki-dim);color:var(--text);font-size:8.5px;letter-spacing:1px}
.d-noobit{margin-top:14px;padding:12px 14px;border:1px dashed var(--khaki-dim);border-radius:8px;font-size:15px;line-height:1.5;color:var(--text-bright);background:rgba(14,17,10,.5)}
.d-noobit b{color:var(--khaki)}
footer{text-align:center;padding:8px;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:2px;color:var(--text);border-top:1px solid var(--border);flex-shrink:0}
</style>
</head>
<body>
<header>
  <div class="star-row"><div class="sl"></div><img class="star-icon" id="hdrBadge" alt="SCSO Badge"><div class="sr"></div></div>
  <div class="supertitle">Shelby County Sheriff's Office</div>
  <h1>END OF WATCH</h1>
  <div class="subtitle">IN HONOR OF THOSE WHO SERVED</div>

{n:"Hubert Harris \"Buddy\" Leatherwood",r:"Chief Deputy",u:2,y:2000,lod:false,notes:"Chief Deputy under Sheriff Gene Barksdale; former MPD deputy chief; three-time candidate for sheriff",e:"",ob:"",fb:"",dod:"08/14/2000",obt:"Summary of the news article “Ex-deputy chief Leatherwood saw work as calling” by Bill Dries, The Commercial Appeal, Memphis, Wednesday, August 16, 2000, page B4.\n\nHubert Harris “Buddy” Leatherwood died of cancer Monday, August 14, 2000, at his home. He was 71. He believed law enforcement was a calling.\n\nHe began his career as a Memphis police officer in 1950 and served 26 years with the department, rising to deputy chief. He helped organize the dog squad, provided police security for Elvis Presley, headed the internal affairs division during the 1970s, and worked in every division except vice. His wife said he talked often of his seven years as a patrolman and his fond memories of driving the patrol car and helping people. He retired from the Police Department in 1976 to become police chief of Gatlinburg, Tenn., but returned to Memphis months later when newly elected Sheriff Gene Barksdale appointed him chief deputy. He left the Sheriff’s Department about a year later.\n\nHe ran for Shelby County sheriff three times, in 1978, 1982 and 1986. He and Barksdale later put aside their differences, and he served as Barksdale’s campaign manager in a 1990 comeback bid. “If he had a disagreement, he worked it out,” his wife said.\n\nServices were held at Memorial Park Funeral Home, with burial in Memorial Park. He was a past deacon of First Cumberland Presbyterian Church. He was survived by his wife, Loyce Leatherwood; two daughters, Lydia Leatherwood and Lisa Leatherwood, both of Memphis; two sons, Harris Lee Leatherwood of Memphis and Cooper B. Leatherwood of Wappinger Falls, N.Y.; and three grandsons.",ph:"photos/buddy-leatherwood.jpg",clip:["clippings/buddy-leatherwood-ca-2000-08-16.jpg"]},

{n:"Ronald L. \"Ron\" McKinney",r:"CAO",u:2.5,y:2004,lod:false,notes:"Chief Administrative Officer; former Memphis police officer",e:"",ob:"",fb:"",dod:"04/25/2004",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Tuesday, April 27, 2004, page 11.\n\nRonald L. McKinney, 62, of Memphis, died Sunday, April 25, 2004, at his home. He served as chief administrative officer for the Shelby County Sheriff’s Office and was a former Memphis police officer. He also owned Webster’s Sporting Goods and CVRM Enterprises Inc., was chief executive officer of B&M Printing, had been advertising manager for Memphis Furniture, and was a former executive producer for the Orpheum Theatre.\n\nServices were held at Bellevue Baptist Church, with burial in Memorial Park; Memphis Funeral Home Poplar Chapel had charge. He was survived by his wife, Vivian McKinney; two daughters, Hope Presley and Christine McKinney, both of Memphis; three sons, Greg McKinney of Rogersville, Mo., Mike McKinney of Lakeland, Tenn., and Mark McKinney of Memphis; a sister, Bonnie Hale of Georgia; a brother, Paul McKinney of Fredericksburg, Va.; and five grandchildren.",clip:["clippings/ron-mckinney-ca-2004-04-27.jpg"]},

{n:"Richard Marvin Almond II",r:"Asst Chief",u:4,y:2012,lod:false,notes:"27 years of service; retired as Assistant Chief; Ole Miss 1964 College World Series team",e:"",ob:"https://www.legacy.com/us/obituaries/commercialappeal/name/richard-almond-obituary?id=7568007",fb:"",dod:"11/01/2012",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Saturday, November 3, 2012, page 6DSA.\n\nRichard Marvin Almond II, 69, of Lakeland, Tenn., died November 1, 2012. He served with the Shelby County Sheriff’s Office for 27 years and retired as Assistant Chief. After retirement he was financial director for the cities of Millington and Oakland.\n\nA graduate of the University of Mississippi, he played on the 1964 College World Series varsity baseball team. He was a member of the Memphis Amateur Sports Hall of Fame and the M Club at Ole Miss, a bull rider in the Professional Rodeo Cowboy Association, and an associate member of the Professional Golf Association.\n\nServices were held at Memphis Funeral Home and Memorial Gardens, Poplar Avenue. He was preceded in death by his parents, Raymond and Irene Almond, and was survived by Barbara J. Almond, his wife of 48 years; his children, Richard Marvin “Marty” Almond III (Vicki) of Arlington and Carol Almond Cothran (Duffy) of Cordova; his brother, Raymond G. Almond Jr.; and grandchildren Megan and Justin Almond and Abby and Chad Cothran.",clip:["clippings/richard-almond-ca-2012-11-03.jpg"]},
{n:"Clard Edward Baker Sr.",r:"Asst Chief",u:4,y:2011,lod:false,notes:"29 years of service; retired as Assistant Chief",e:"",ob:"https://www.legacy.com/us/obituaries/commercialappeal/name/clard-baker-obituary?id=13758721",fb:"",dod:"11/15/2011",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Friday, November 18, 2011, page DSA4.\n\nClard Edward Baker Sr., 78, died November 15, 2011. He was a very loyal and trusted member of the Shelby County Sheriff’s Department and retired after 29 years of service.\n\nThe funeral was held at Grays Creek Baptist Church in Arlington, with Jefferson Mortuary in charge. He was preceded in death by his wife, Loraine Baker, and was survived by his children, Janet Bledsoe, Judy Baker and Sharon Baker, all of Memphis, Clard Baker Jr. (Portia) of Bartlett, and Stanley Baker and Lois Baker of California; eight grandchildren; four great-grandchildren; a special nephew; a brother, Wilbert Baker; four sisters, Catherine Anderson, Lou Ruth Branch, Eva Anderson and Mary Edwards; and his loyal neighbors, the Acang family.",clip:["clippings/clard-baker-ca-2011-11-18.jpg"]},

{n:"Vernon V. Dollahite Sr.",r:"Asst Chief",u:4,y:2013,lod:false,notes:"Retired as Assistant Chief; Marine Corps pilot",e:"",ob:"https://www.legacy.com/us/obituaries/commercialappeal/name/vernon-dollahite-obituary?id=7326331",fb:"",dod:"10/08/2013",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Thursday, October 10, 2013, page 7B.\n\nVernon V. Dollahite Sr., 69, of Moscow, Tenn., retired Assistant Chief of the Shelby County Sheriff’s Department, died October 8, 2013, at Baptist Memorial Hospital-Memphis. He was a member of the Bartlett Masonic Lodge, a Shriner, and a pilot for the Marine Corps. After retiring from the Sheriff’s Office, he moved to Fayette County.\n\nServices were held at Munford Funeral Home, Munford Chapel, with burial in Poplar Grove Cemetery. He was preceded in death by his parents, James V. Dollahite and Ruby Byford Johnson, and was survived by Dinah Dollahite, his wife of 26 years; a son, V. Dollahite Jr.; three sisters, Barbara Ann Halliburton, Phyllis Gamel and Paulette Dollahite; a brother, Jimmy Dollahite; and a grandchild, Cali D. Dollahite. The family asked that memorial contributions be made to the Wounded Warrior Project.",clip:["clippings/vernon-dollahite-ca-2013-10-10.jpg"]},

{n:"Robert L. \"Bob\" Harper Sr.",r:"Asst Chief",u:4,y:2014,lod:false,notes:"Retired as Assistant Chief",e:"",ob:"https://www.tributearchive.com/obituaries/47864504/robert-l.-harper-bob",fb:"",dod:"03/21/2014",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Saturday, March 22, 2014, page 6DSA.\n\nRobert L. “Bob” Harper Sr., 73, of Como, Miss., died Friday, March 21, 2014, at his home. He retired as Assistant Chief of the Shelby County Sheriff’s Department and was a member of Living Church of God.\n\nA memorial service was held at Roller-Citizens Funeral Home in West Memphis, Ark. He was survived by his wife, Lola Harper of Como; three daughters, Michelle Beshires (Mike) of Como, Lisa Martin (Andy) of Collierville and Kim Wilson (Stick) of Como; two sons, Robert Harper Jr. (Ginger) and Scott Harper (Sheri) of Bartlett; 13 grandchildren; 11 great-grandchildren; and a great-great-grandchild.",clip:["clippings/robert-harper-ca-2014-03-22.jpg"]},

{n:"Harry L. \"Chief\" Parker",r:"Asst Chief",u:4,y:2003,lod:false,notes:"Korean War Navy veteran",e:"",ob:"",fb:"",dod:"03/03/2003",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Tuesday, March 4, 2003, page 15.\n\nHarry L. “Chief” Parker, 73, of Memphis, retired from the Shelby County Sheriff’s Department and from M&M Bail Bond, died Monday, March 3, 2003, at Methodist Healthcare-North. He was a Korean War Navy veteran.\n\nServices were held at Munford Funeral Home Millington Chapel, with burial in Big Creek Cemetery in Millington. He was survived by his wife, Barbara Parker; four daughters, Teresa Hagan of Ashland, Miss., Janice Sue Marcum of Atoka, and Janie Lucas and Bobbie Jane Maness, both of Millington; two sons, Harry L. Parker Jr. of Navarre, Fla., and William David Parker of Germantown; a sister; two brothers; 10 grandchildren; and seven great-grandchildren.",clip:["clippings/harry-parker-ca-2003-03-04.jpg"]},

{n:"Cliff Ballard",r:"Inspector",u:5,y:1985,lod:true,notes:"Bronze Star, D-Day 1944",e:"",ob:"",fb:"",dod:"12/16/1985",obt:"Summary of the news article in The Commercial Appeal, Memphis, Tuesday, December 17, 1985, page D5.\n\nInspector Clifford A. Ballard, 63, died December 16, 1985, of an apparent heart attack after falling ill at work. He served 23 years with the Sheriff’s Department. Sheriff Gene Barksdale named him executive officer of the jail in January 1982, and he was promoted to inspector on March 10, 1983.\n\nWhile serving with the military police in World War II, he earned the Bronze Star for his actions in the D-Day invasion of Normandy in 1944. He moved to Memphis in 1956 after leaving the service.\n\nServices were held at Memorial Park Funeral Home, with burial in Memorial Park. He was survived by his wife, Kimie; a daughter, Betty Eldredge of Memphis; three sisters; a brother; and a granddaughter.",clip:["clippings/cliff-ballard-ca-1985-12-17.jpg"]},

{n:"Carlton E. \"Gene\" Mendenhall",r:"Inspector",u:5,y:1998,lod:false,notes:"38 years of service; retired 1997 as Inspector, Civil Division; husband of Sgt. Nola Jean Mendenhall",e:"",ob:"https://www.findagrave.com/memorial/75530985/carlton_eugene-mendenhall",fb:"",dod:"04/02/1998",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Saturday, April 4, 1998, page 11.\n\nCarlton E. “Gene” Mendenhall, 59, of Lakeland, a 38-year veteran of the Shelby County Sheriff’s Department, died of heart failure Thursday, April 2, 1998, at Methodist Hospital North. He retired in 1997 as an inspector for the department’s Civil Division. He was a Shriner and a Mason.\n\nGraveside services were held in Memory Hill Gardens, with Memphis Funeral Home Germantown Parkway Chapel in charge. He was survived by his wife, Nola Mendenhall; two daughters, Carla Johnston of Memphis and Teresa Agner of Horn Lake; a son, Ronnie Mendenhall of Brandon, Miss.; a sister, Betty Ruth Benson of Murphy, N.C.; a brother, Roy Mendenhall of Asheville, N.C.; and three grandchildren.",clip:["clippings/gene-mendenhall-ca-1998-04-04.jpg"]},

{n:"Fred Thomas Wall",r:"Inspector",u:5,y:1997,lod:false,notes:"26 years with SCSO; patrol partner of A.C. Gilless; later chief investigator, District Attorney General's office; Korean War Army veteran",e:"",ob:"",fb:"",dod:"10/24/1997",obt:"Summary of the news article “Investigator Wall had a knack for finding truth” by Bill Dries, The Commercial Appeal, Memphis, Sunday, October 26, 1997.\n\nFred Thomas Wall, 67, a retired investigator with the Shelby County Sheriff’s Department and the Shelby County District Attorney General’s office, died of cancer Friday, October 24, 1997, at Allenbrooke Health Care Center. A Korean War Army veteran, he moved to Memphis after the war and joined the Sheriff’s Department, where he served 26 years. His partner as a patrol officer was A.C. Gilless, later sheriff.\n\nIn 1985 he went to work for the district attorney general and became chief investigator under Dist. Atty. Gen. Hugh Stanton Jr., retiring in 1996. His daughter, Susan, said he was methodical and had a knack for listening to stories over and over “until the bad guys tripped themselves up.” Mark Glankler, who worked with him for 10 years and considered him a mentor, called him “the finest investigator I ever met,” respected by federal, state and police criminal investigators alike.\n\nHe was a member of Ascension Lutheran Church, Summer Avenue Masonic Lodge 729, Scottish Rite, Al Chymia Shrine Temple, the Fraternal Order of Police, the Tennessee Law Enforcement Association, and the Tennessee and Mississippi Sheriffs & Peace Officers Association. Funeral services were held at Forest Hill Funeral Home South, with burial in Forest Hill Cemetery South. He was preceded in death by his wife, Nancy J. Wall, and was survived by his daughter, Susan Wall; a son, Blane T. Wall of Memphis; a brother, Douglas M. Smith of Olive Branch, Miss.; and a grandchild.",ph:"photos/fred-wall.jpg",clip:["clippings/fred-wall-ca-1997-10-26.jpg"]},

{n:"William \"Bill\" DuFour",r:"Captain",u:6,y:2003,lod:false,notes:"Assigned to Dr. Martin Luther King Jr.'s protection detail, April 1968; former Chicago White Sox and Memphis Chicks pitcher",e:"",ob:"",fb:"",dod:"09/07/2003",obt:"Summary of the news article “Bill DuFour, former pitcher and deputy, dies of cancer” by Chris Conley, The Commercial Appeal, Memphis, Monday, September 8, 2003, page 14.\n\nWilliam “Bill” DuFour died of cancer Sunday, September 7, 2003, at Baptist Memorial Hospital. He served 25 years as a Shelby County Sheriff’s deputy and retired as a captain about a dozen years before his death. He was often assigned to dignitary protection: he guarded golfer Lee Trevino during the Danny Thomas Golf Tournament, and he was one of the deputies assigned to Dr. Martin Luther King Jr. during his visit to Memphis, and was at the Lorraine Motel when Dr. King was assassinated on April 4, 1968. His wife said he spoke very little about it.\n\nA native of the Detroit area and a Korean War veteran, he served on a Navy carrier and played for its championship baseball and basketball teams. He pitched for the Chicago White Sox in the early 1950s and joined the Memphis Chicks in 1955, winning 21 games one season as a left-hander. He was inducted into the Wyandotte, Mich., hall of fame in 1995. Former professional player Pete Aviotti called him an outstanding pitcher and one of the nicest people he had known. Friends and family remembered him as a kind-hearted friend, devoted father and gifted athlete, and in retirement he golfed every day he could.\n\nMemorial Park Funeral Home had charge. He was survived by Barbara DuFour, his wife of 29 years; stepdaughter Leanne Brooks; two daughters, Gill Winders of Atoka and Dottie Dulin of Memphis; a son, Steven DuFour of Kansas City, Mo.; a stepson, Glenn McNease of Memphis; a sister, Mary Florence Martin of Fenton, Mich.; a brother, Patrick Grayson DuFour of Port Richey, Fla.; and 12 grandchildren.",clip:["clippings/bill-dufour-ca-2003-09-08.jpg"]},

{n:"Johnnie Lee \"Johnny\" Roberts",r:"Captain",u:6,y:2013,lod:false,notes:"Career deputy; retired as Captain in 1996. He saved the life of John Harvey’s father, who suffered a heart attack while testifying in Criminal Court.",e:"",ob:"https://www.memorialparkfuneralandcemetery.com/obituaries/johnnie-roberts-32960/obituary",fb:"",dod:"05/09/2013",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Saturday, May 11, 2013, page 4B.\n\nJohnnie Lee Roberts, 64, a loving father, brother and grandfather, died peacefully surrounded by his family on May 9, 2013. A graduate of Memphis Tech High School, he made his lifelong career with the Shelby County Sheriff’s Department, retiring in 1996 as a captain. He was an avid fan of baseball, basketball and golf, and his true love was the Memphis Tigers. He was a loving PaPaw to his grandchildren and their friends alike, and family was his greatest treasure.\n\nFuneral services were held at Memorial Park Funeral Home, with burial in Crittenden Memorial Park Cemetery. He was preceded in death by his parents, Johnnie Sr. and Dorothy Roberts, and was survived by his daughters, Cindy Roberts Diana and Amy Willis Roberts; his brother, Paul David Roberts; his sisters, Sheila Roberts Wilson and Lisa Roberts Austin; his grandchildren, Cody Climer, Zachary Diana, Mackenzie Diana and Madison Roberts; and his dogs, Buttons and Lexi.",clip:["clippings/johnnie-roberts-ca-2013-05-11.jpg"]},

{n:"Paul C. Smith",r:"Captain",u:6,y:2003,lod:false,notes:"Notice says retired lieutenant (list has Captain — to confirm); former Memphis police officer",e:"",ob:"",fb:"",dod:"10/23/2003",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Friday, October 24, 2003, page 19. (The copy we have shows the first part of the notice.)\n\nPaul C. Smith, 79, of Arlington, a retired lieutenant for the Shelby County Sheriff’s Department, died Thursday, October 23, 2003, at Methodist Healthcare-Germantown. He owned Woodsmith’s Furniture in Memphis and Port Richey, Fla., and had worked for the Missouri-Pacific Railroad and the Memphis Police Department.",clip:["clippings/paul-smith-ca-2003-10-24.jpg"]},

{n:"B. J. Steadman",r:"Captain",u:6,y:2012,lod:false,notes:"28 years of service; retired as Captain; later served with the Memphis Police Department",e:"",ob:"",fb:"",dod:"09/21/2012",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Sunday, September 23, 2012, page 4DSA.\n\nB. J. Steadman, 66, of Germantown, died September 21, 2012. Raised in Clarksdale, Miss., he proudly served 28 years with the Shelby County Sheriff’s Department and retired as a captain, then continued to serve with the Memphis Police Department.\n\nHe enjoyed time with his brothers-in-law, NFL football and music. He was often found grilling or doing carpentry, competed in multiple barbecue contests including Memphis in May, and played the mandolin and harmonica, but more than anything he loved being a proud father to his son, Michael.\n\nThe funeral service was held at Memphis Funeral Home and Memorial Gardens, Poplar Avenue, with burial there. He was preceded in death by his parents, Anne and Jack Steadman, and his mother-in-law, Claire Bence, and was survived by his wife, Judy Steadman; his son, Michael Jason Steadman; his father-in-law, Fred Bence; and his dog, Tillie. The family asked that memorials be sent to the Law Enforcement Foundation in care of the Sheriff’s Department.",clip:["clippings/bj-steadman-ca-2012-09-23.jpg"]},

{n:"Elwyn Quinn \"E.Q.\" Hartline",r:"Lieutenant",u:7,y:2013,lod:false,notes:"27 years of service; retired as Lieutenant",e:"",ob:"https://www.legacy.com/us/obituaries/commercialappeal/name/elwyn-hartline-obituary?id=13169253",fb:"",dod:"03/22/2013",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Sunday, March 24, 2013, page 4B.\n\nElwyn Quinn Hartline, 70, died peacefully at home on Friday morning, March 22, 2013, with Peggy, his high school sweetheart and wife of 50 years, by his side. He retired as a lieutenant from the Shelby County Sheriff’s Department after 27 years of service. He was an avid hunter, a devoted “paw paw,” and a friend to everyone he met.\n\nA memorial service was held at Holy Rosary Catholic Church, with High Point Funeral Home in charge. He was survived by his wife, Peggy Hartline; three children, Mishelle Mitchell (Mike), Kelly Gonzales (Kenny) and Timmy Hartline (Su); seven grandchildren, Michael, David, Adrienne, Quinn, Maddie, Garret and Dorothy, who “will always love you to the moon and back”; his mother, Vina Mowell; four siblings, Michael Hartline, Kathleen Scott, Gerald Mowell and Leslie Mowell; and a very special uncle, Hugh Hartline. The family asked that donations be made to Le Bonheur Children’s Hospital.",clip:["clippings/elwyn-hartline-ca-2013-03-24.jpg"]},

{n:"Ronald \"Ron\" Huffman",r:"Lieutenant",u:7,y:2006,lod:false,notes:"30 years of service; retired as Lieutenant",e:"",ob:"https://www.legacy.com/us/obituaries/commercialappeal/name/ronald-huffman-obituary?id=16184772",fb:"",dod:"01/06/2006",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Sunday, January 8, 2006, page 22.\n\nRonald Huffman, 60, of Bartlett, died Friday, January 6, 2006. He was a 30-year veteran of the Shelby County Sheriff’s Office and ended his service with the department at the rank of lieutenant.\n\nServices were held at Memorial Park Funeral Home, with burial in Memorial Park Cemetery. He was survived by Joy Huffman, his wife of 35 years; two sons, Kevin Huffman of Bartlett and Brian Huffman of Spring Hill, Tenn.; his mother, Verna Huffman of Memphis; and a brother, Luther Huffman of Olive Branch. The family asked that memorials be sent to the American Cancer Society or Methodist Healthcare Hospice.",clip:["clippings/ronald-huffman-ca-2006-01-08.jpg"]},
{n:"Steve S. Jackson Jr.",r:"Lieutenant",u:7,y:2005,lod:false,notes:"",e:"",ob:"",fb:"",dod:"02/19/2005",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Tuesday, February 22, 2005, page 14.\n\nSteve S. Jackson Jr., 64, of Memphis, a retired Shelby County deputy sheriff, died Saturday, February 19, 2005, at Methodist North Hospital. Graveside services were held in Forest Hill Cemetery East, with Forest Hill Funeral Home East in charge. He was survived by a sister, Mammie Young of Memphis, and a brother, James Jackson of Bartlett. The family asked that memorials be sent to St. Jude Children’s Research Hospital.",clip:["clippings/steve-jackson-ca-2005-02-22.jpg"]},

{n:"Samuel E. \"Sam\" Kerley",r:"Lieutenant",u:7,y:2010,lod:false,notes:"31 years of service; retired as Lieutenant; owner of Kerley & Rhea Security",e:"",ob:"https://www.legacy.com/us/obituaries/commercialappeal/name/samuel-kerley-obituary?id=14353809",fb:"",dod:"08/04/2010",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Thursday, August 5, 2010, page B4.\n\nSamuel E. Kerley, 63, of Bartlett, died August 4, 2010, at St. Francis Hospital-Bartlett. He retired from the Shelby County Sheriff’s Office as a lieutenant after 31 years of service, and was owner and operator of Kerley & Rhea Security. He was a Mason and a Shriner with the Al Chymia Shrine Temple.\n\nServices were held at Forest Hill East Funeral Home. He was preceded in death by his wife, Linda K. Kerley, and was survived by his sons, Samuel E. Kerley Jr. (Wendy) and Danny Kerley (Carlynn); his sister, Jeannie Perrault; a grandson, Ryan Parker Kerley; a granddaughter, Megan White; two nieces; and three nephews. The family asked that memorials be sent to the American Heart Association or the American Diabetes Association.",clip:["clippings/samuel-kerley-ca-2010-08-05.jpg"]},

{n:"Robert Candy Man Lively",r:"Lieutenant",u:7,y:2011,lod:false,notes:"26 years of service; President, Shelby County Deputy Sheriff's Association; Vietnam War Marine Corps veteran",e:"",ob:"https://www.dignitymemorial.com/obituaries/memphis-tn/robert-lively-4825907",fb:"",dod:"09/23/2011",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Sunday, September 25, 2011, page B4.\n\nRobert F. “Bob” Lively, 68, of Memphis, died Friday, September 23, 2011. He was a U.S. Marine Corps veteran of the Vietnam War and received numerous commendations for his service. He retired from the Shelby County Sheriff’s Department after 26 years, including several years as president of the Shelby County Deputy Sheriff’s Association. He was president of Courtesy Consultants Corporation for 20 years and a communicant of St. Ann’s Catholic Church in Bartlett.\n\nA Celebration of Life service was held at Memphis Funeral Home and Memorial Gardens-Poplar Avenue Chapel. He was survived by two daughters, Rachelle Grice (Mike) and Candy Lively; a son, Duke Lively (Kristie); six grandchildren, Roby, Shelby, Marissa, Cameron, Natalie and Julia; a great-grandson, Easton Grice; his mother, Eileen Sha; his sister, Gayle Beck; and his fiancée, Loretta Luttrell. The family asked that memorials go to the Shelby County Deputy Sheriff’s Association or COPS (Concerns of Police Survivors).",clip:["clippings/bob-lively-ca-2011-09-25.jpg"]},

{n:"Virgil Ray Bell",r:"Lieutenant",u:7,y:2004,lod:false,notes:"30 years of service; Naval Reserve retiree (20 years)",e:"",ob:"",fb:"",dod:"05/01/2004",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Monday, May 3, 2004, page 14.\n\nVirgil Ray Bell, 70, of Southaven, retired as a lieutenant with the Shelby County Sheriff’s Department after 30 years and retired from the Naval Reserve after 20 years. He died Saturday, May 1, 2004, at Baptist Memorial Hospital-DeSoto. He was a Baptist and a Mason.\n\nTwin Oaks Funeral Home had charge. He was survived by a daughter, Patricia Fenter of Cedar Creek, Texas; a son, Jeffery D. Bell of Southaven; three sisters, Luddie Hatley and Tiny Smith, both of Marked Tree, Ark., and Louise Massey of San Antonio, Texas; a brother, Jack Bell of Southaven; and two grandchildren.",clip:["clippings/virgil-bell-ca-2004-05-03.jpg"]},

{n:"Gordon Biggs",r:"Sergeant",u:8,y:2003,lod:false,notes:"Army veteran; later investigator for the Attorney General’s office",e:"",ob:"",fb:"",dod:"07/18/2003",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Saturday, July 19, 2003, page 15.\n\nGordon Biggs, 58, of Bartlett, a retired deputy sergeant with the Shelby County Sheriff’s Department and later an investigator for the Attorney General’s office, died Friday, July 18, 2003, at Methodist Healthcare-Germantown. He was an Army veteran and a member of the American Legion.\n\nServices were held at Forest Hill Funeral Home East, with burial in Forest Hill Cemetery East. He was survived by his wife, Janie Biggs of Bartlett; a daughter, Michelle Tatum of Memphis; a brother, William Murray of Dalton, Ga.; and a grandchild.",clip:["clippings/gordon-biggs-ca-2003-07-19.jpg"]},
{n:"James W. \"J.W.\" Bolden",r:"Lieutenant",u:7,y:1999,lod:false,notes:"Retired lieutenant",e:"",ob:"https://ancestors.familysearch.org/en/LX9Y-8C9/lt.-james-william-bolden-1930-1999",fb:"",dod:"10/03/1999",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Wednesday, October 6, 1999, page 18.\n\nLt. James W. Bolden, 69, of Memphis, a retired deputy sheriff, died of heart failure Sunday, October 3, 1999, at Methodist Hospital.\n\nServices were held at Boulevard Church of Christ, with burial in West Tennessee Veterans Cemetery; M.J. Edwards & Sons Funeral Home Whitehaven Chapel had charge. He was survived by his wife, Lillian “Doll” Bolden; seven daughters, Gloria Akpan, Thelma Hedrick, Billie Jo Bolden, Delisa McCray, Doretha Daniels, Rita Luckett and Nina Thornton; five sons, Lawrence Johnson, Eric Bolden, Joseph McCray, Dana Bailey and Simeon McCray; a sister, Elizabeth Keyes; two brothers, Kenny Haynes and Sammy Bolden; his grandmother, Elizabeth Bolden; 21 grandchildren; and 16 great-grandchildren.",clip:["clippings/james-bolden-ca-1999-10-06.jpg"]},

{n:"Ted M. Bruehl",r:"Sergeant",u:8,y:1997,lod:false,notes:"Retired Sergeant",e:"",ob:"",fb:"",dod:"01/30/1997",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Saturday, February 1, 1997.\n\nTed M. Bruehl, 82, of Hernando, formerly of Memphis, a retired sergeant with the Shelby County Sheriff’s Department, died of heart failure Thursday, January 30, 1997, at Methodist Hospital South. He was a Mason.\n\nServices were held at Memphis Funeral Home Poplar Chapel, with burial in Memory Hill Gardens. He was survived by his wife, Virginia Bruehl; a daughter, Bette J. Sherer, and a son, Ted L. Bruehl, both of Memphis; a brother, Earl Bruehl of Appleton, Wis.; four grandchildren; and 11 great-grandchildren.",clip:["clippings/ted-bruehl-ca-1997-02-01.jpg"]},

{n:"John Henry Epps",r:"Lieutenant",u:7,y:1994,lod:false,notes:"Serving lieutenant, Internal Affairs",e:"",ob:"",fb:"",dod:"02/09/1994",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Friday, February 11, 1994, page 15.\n\nLt. John Henry Epps, 43, of Memphis, a deputy sheriff with the Internal Affairs division of the Shelby County Sheriff’s Department, died of pneumonia Wednesday, February 9, 1994, at Methodist Hospital. He was a member of Mt. Moriah East Baptist Church.\n\nServices were held at Mt. Moriah East Baptist Church, with burial in New Hope Baptist Church Cemetery in Gloster, Miss.; N.J. Ford & Sons Funeral Home had charge. He was survived by a daughter, Lekietha Shontell Theresa Epps, and a son, L’John Sylvel Timothy Epps, both of Washington; his mother, Edna E. Thompson of Centreville, Miss.; his father, John A. Epps of Syracuse, N.Y.; a sister, Ann Marie Williams of Houston; and two brothers, Rev. G. A. Epps of Houston and Rev. C. L. Ross of New Orleans.",clip:["clippings/john-epps-ca-1994-02-11.jpg"]},
{n:"James David \"Jim\" Wilkinson Jr.",r:"Lieutenant",u:7,y:2012,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Began as a Reserve Deputy in 1970; retired as Lieutenant in 1990; named Officer of the Decade by the Memphis and Shelby County Bar Association; Korean War Air Force veteran",e:"",ob:"",fb:"",dod:"10/24/2012",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Friday, October 26, 2012, page 5B.\n\nJames David “Jim” Wilkinson Jr. was born January 28, 1934, in Memphis to Cora Teague and James D. Wilkinson Sr. He attended Bartlett High School before entering the U.S. Air Force during the Korean War. He died Wednesday, October 24, 2012, at Methodist Hospice Residence after a courageous bout with pancreatic cancer.\n\nHe began his career as a Reserve Deputy Sheriff in 1970 and retired from the Shelby County Sheriff’s Department as a lieutenant in 1990. He met his wife, Paula Holt Moseley, while working with Parents Against Illegal Narcotics, started by Sheriff Bill Morris; they married January 19, 1972. After retirement he worked security at Memphis University School and First Tennessee Bank in Olive Branch.\n\nHe was named Officer of the Decade by the Memphis and Shelby County Bar Association and was honored as one of President George H.W. Bush’s Thousand Points of Light. A charter member of the Poplar East Optimist Club for 30 years, he served as Optimist Governor of the Tennessee District in 1982–83 and was named Most Outstanding Civic Club President by the Gavel Club; he later helped build the Curve Optimist Club. He served as a Neighborhood Watch chief in Olive Branch and was a member of Piperton United Methodist Church and Unity Lodge.\n\nFuneral services were held at Memphis Funeral Home and Memorial Gardens, Poplar Avenue, with burial with honors in Memorial Park Cemetery. He was preceded in death by his parents, two sisters and a son, Randy Wilkinson, and was survived by his wife, Paula; his son, H. Kenneth Moseley (Jane); grandchildren, step-grandchildren and five great-grandchildren.",clip:["clippings/jim-wilkinson-ca-2012-10-26.jpg"]},

{n:"Cecil A. Hurst",r:"Sergeant",u:8,y:1992,lod:false,notes:"26 years of service; retired Army chief warrant officer (41 years, Army and Army Reserve)",e:"",ob:"",fb:"",dod:"01/11/1992",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Sunday, January 12, 1992, page 20.\n\nCecil A. Hurst, 59, of Memphis, retired as a Shelby County deputy sheriff after 26 years. He also retired as a chief warrant officer after 41 years in the Army and Army Reserve. He died Saturday, January 11, 1992, at his home.\n\nServices were held at Memphis Funeral Home Poplar Chapel, with burial in Memorial Park. He was survived by a daughter, Carol Hurst, and his mother, Mary D. Hurst, both of Memphis. The family asked that memorials be sent to the Fraternal Order of Police.",clip:["clippings/cecil-hurst-ca-1992-01-12.jpg"]},

{n:"Joseph John \"Jo Jo\" Martin",r:"Sergeant",u:8,y:1996,lod:false,notes:"Navy retiree; volunteer fund-raiser for St. Jude Children's Research Hospital",e:"",ob:"",fb:"",dod:"03/22/1996",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Sunday, March 24, 1996, page 24.\n\nJoseph John Martin, 71, of Memphis, retired from the Navy and as a Shelby County Sheriff’s deputy, died of heart failure Friday, March 22, 1996, at his home. He was a communicant of St. Louis Catholic Church and a volunteer fund-raiser for St. Jude Children’s Research Hospital.\n\nA funeral Mass was said at St. Louis Catholic Church, with burial in West Tennessee Veterans Cemetery; Memphis Funeral Home had charge. The family asked that memorials be sent to St. Jude Children’s Research Hospital.",clip:["clippings/joseph-martin-ca-1996-03-24.jpg"]},

{n:"Charles Edward \"Charlie\" May",r:"Sergeant",u:8,y:2010,lod:false,notes:"25 years of service; Korean War veteran; six years in the Marine Corps Reserve",e:"",ob:"https://www.legacy.com/us/obituaries/commercialappeal/name/charles-may-obituary?id=14381645",fb:"",dod:"07/17/2010",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Monday, July 19, 2010, page DSA3.\n\nCharles Edward May, 76, of Harrisburg, Ark., died July 17, 2010, at St. Bernard’s Hospital in Jonesboro, Ark. He was born in Meridian, Miss., to William and Suzie May and graduated from Humes High School. He retired as a deputy from the Shelby County Sheriff’s Office after 25 years of faithful and dedicated service. He was a Korean War veteran and served six years in the Marine Corps Reserve. He attended Shiloh Baptist Church in Harrisburg and enjoyed working on and restoring antique cars.\n\nFuneral services were held at Memorial Park Funeral Home. He was preceded in death by his parents and by a wife, Patricia Black Dumas May, and was survived by Alene Davis May, his wife of seven years; two daughters, Terry May Landrum and Jill Clark; a son, Randy May; two brothers, William H. May of Weir, Miss., and George May of Brandon, Miss.; and a sister, Frances Harris of Denison, Texas.",clip:["clippings/charles-may-ca-2010-07-19.jpg"]},

{n:"Ronald A. \"Ronnie\" Ragghianti",r:"Sergeant",u:8,y:2008,lod:false,notes:"Retired detective, 22 years; Army veteran",e:"",ob:"https://www.peeblesfuneralhome.com/obituaries/ronald-ragghianti",fb:"",dod:"05/27/2008",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Thursday, May 29, 2008, page 17.\n\nRonald A. Ragghianti, 65, of Bartlett, retired as a detective with the Shelby County Sheriff’s Department after 22 years. A U.S. Army veteran, he died May 27, 2008, at his home. He was a Christian who enjoyed watersports.\n\nGraveside services with military honors were held at Somerville City Cemetery, with Peebles Fayette County Funeral Home-West Chapel in charge. He was survived by his wife, Shirley Glover Thomas Ragghianti; two stepdaughters, Cindy Thomas of Rock Springs, Wyo., and Leanne Thomas of Denver; two sisters, Joyce Armstrong of Fort Lauderdale, Fla., and Debra Lamar of Millington; a granddaughter; and two great-grandsons.",clip:["clippings/ronald-ragghianti-ca-2008-05-29.jpg"]},

{n:"Mark M. Rochevot",r:"Sergeant",u:8,y:2004,lod:false,notes:"Vietnam War veteran",e:"",ob:"",fb:"",dod:"11/06/2004",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Monday, November 8, 2004, page 16.\n\nMark M. Rochevot, 61, of Bartlett, retired from the Shelby County Sheriff’s Department, died Saturday, November 6, 2004, at Saint Francis Hospital. He was a Vietnam War veteran.\n\nServices were held at Memphis Funeral Home Germantown Parkway Chapel, with burial in Memory Hill Gardens. He was survived by his wife, Billie J. Rochevot; three daughters, Jennifer Rochevot of San Diego, and Cristy Rochevot Henry and Ashley Rochevot, both of Bartlett; a son, David Rochevot of Bartlett; his mother, Juanita Hendren of Southaven; a brother, Gary Rochevot of Tampa; five grandchildren; and a great-grandchild.",clip:["clippings/mark-rochevot-ca-2004-11-08.jpg"]},

{n:"Donald Ray \"Don\" Scott",r:"Sergeant",u:8,y:2022,lod:false,notes:"Retired Sergeant; later security at The Peabody Memphis",e:"",ob:"https://www.commercialappeal.com/obituaries/mca065941",fb:"",dod:"11/24/2022",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Tuesday, December 6, 2022, page 9A.\n\nDonald Ray Scott, 75, of Memphis, died peacefully on November 24, 2022, surrounded by family. A lifelong Memphian, he was a retired sergeant with the Shelby County Sheriff’s Department and later a security guard at The Peabody Memphis hotel, where he got to meet and talk with celebrities and people from all over the world. He loved to travel, fish, camp, play cards and visit with friends and family, and he loved to have fun and make people laugh.\n\nHe was married to Robin Scott for 40 years. He was “Daddy” to his daughters, Kim Ewerling of Memphis, Crystal Theobald of Fort Collins, Colo., and Rebecca Scott of Memphis, and “Rough Grandpa” to his grandchildren, Dr. Michael Hankins, Destiny Hankins, Emily Bridges, Madison Wood and Elliot Theobald; he also had four great-grandchildren. He was preceded in death by his parents, Robert and Doris Scott; his sister, Bobbie Jean Soto; his brother, Steve Scott; and his granddaughter, Sarah Theobald. His family held a Celebration of Life at his beloved Peabody Memphis Hotel.",ph:"photos/donald-scott.jpg",clip:["clippings/donald-scott-ca-2022-12-06.jpg"]},

{n:"Robert G. \"Bob\" Austin",r:"Patrolman",u:9,y:1997,lod:false,notes:"Serving deputy, 23 years",e:"",ob:"https://www.findagrave.com/memorial/102540873/robert_g-austin",fb:"",dod:"05/23/1997",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Sunday, May 25, 1997, page 19. (The copy we have shows the first part of the notice.)\n\nRobert G. Austin, 48, of Nesbit, Miss., a deputy with the Shelby County Sheriff’s Department for 23 years, died of heart failure Friday, May 23, 1997, at Methodist Hospital. Services were held at Twin Oaks Funeral Home in Southaven, with burial in Twin Oaks Memorial Gardens.",clip:["clippings/robert-austin-ca-1997-05-25.jpg"]},

{n:"Stephen Burt \"Steve\" Bramlett",r:"Patrolman",u:9,y:2011,lod:false,notes:"Serving deputy, 24 years; youth baseball and basketball coach for 21 years",e:"",ob:"https://www.legacy.com/us/obituaries/commercialappeal/name/stephen-bramlett-obituary?id=21788932",fb:"",dod:"12/03/2011",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Wednesday, December 7, 2011, page DSA6.\n\nStephen Burt “Steve” Bramlett, 52, of Bartlett, died suddenly Saturday, December 3, 2011, in Paris, Tenn. He was born August 22, 1959, to Betty (Bradley) Bramlett and the late Burt Bramlett, and graduated from Frayser High School, where he played baseball and basketball. He served the Shelby County community for 24 years as a deputy sheriff with the Shelby County Sheriff’s Department.\n\nHis love of sports and of young people led him to coach baseball and basketball for 21 years, including both of his sons, and to run youth organizations such as the Memphis Travelers and Bartlett Panthers SYS, where he helped build young men out of boys by instilling morals and words of inspiration. He loved golf, hunting and fishing with his boys and his friends, and was a member of the Church of Christ. His family wrote that his smile could light up any room and that he was quite simply the very best.\n\nHe was survived by Penne, his wife of 28 years; two sons, Kurtis and Konner of Bartlett; his mother, Betty Bramlett; and his sister, Pam Godsey of Cordova.",clip:["clippings/steve-bramlett-ca-2011-12-07.jpg"]},

{n:"Tommy M. Davis",r:"Patrolman",u:9,y:2008,lod:false,notes:"",e:"",ob:"https://obits.postandcourier.com/us/obituaries/commercialappeal/name/tommy-davis-obituary?id=7581396",fb:"",dod:"11/09/2008",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Tuesday, November 11, 2008, page 14.\n\nTommy M. Davis, 60, of Memphis, a retired deputy sheriff, died November 9, 2008, at St. Francis Hospital-Bartlett. His family wrote that his belief system truly was to protect and serve his family, friends and community.\n\nA gathering of family and friends was held at Memphis Funeral Home Poplar Chapel. He was survived by his wife, Cynthia M. Davis of Memphis; two daughters, Valerie Byrd and Anna DeFelice; a son, Blake Davis; and four grandchildren, Julia Byrd, Andrew Byrd, Alissa DeFelice and Phillip DeFelice.",clip:["clippings/tommy-davis-ca-2008-11-11.jpg"]},

{n:"James Earwood",r:"Patrolman",u:9,y:1998,lod:false,notes:"Air Force senior master sergeant (retired)",e:"",ob:"https://www.findagrave.com/memorial/147077465/james_harold_earwood",fb:"",dod:"09/11/1998",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Sunday, September 13, 1998, page 20.\n\nJames Harold Earwood, 69, of Memphis, retired from the Shelby County Sheriff’s Department, died of heart failure Friday, September 11, 1998, at his home. He was a retired senior master sergeant in the Air Force and a Baptist.\n\nServices were held at Roller Family Funeral Home in Memphis, with burial in Memorial Park. He was survived by his wife, Melba Earwood; three sons, James H. Earwood Jr. and James A. Earwood, both of Memphis, and John G. Earwood of Moscow, Tenn.; a sister, Ruth Hargett of Southaven; and three grandchildren.",clip:["clippings/james-earwood-ca-1998-09-13.jpg"]},

{n:"James Howard \"Jim\" Orman",r:"Patrolman",u:9,y:2019,lod:false,notes:"25 years of service; member of the F.O.P.",e:"",ob:"https://www.munfordfuneralhome.com/obituaries/James-Howard-Orman?obId=40996995",fb:"",dod:"12/05/2019",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Saturday, December 7, 2019, page 9A.\n\nJames Howard Orman, 83, of Atoka, died December 5, 2019, at Baptist Tipton in Covington. He retired after 25 years of service as a sheriff’s deputy with the Shelby County Sheriff’s Department. He was a member of Gateway Baptist Church and the Fraternal Order of Police.\n\nServices were held at Munford Funeral Home, Munford Chapel, with burial at Salem ARP Cemetery in Atoka. He was survived by Shirley Jean Orman, his wife of 66 years; daughters Cheryl (Frank) Huggins, Sherry Lewis and Diane (Chip) Grimes; sisters Janice Orman, Janell (Carl) Gault and Lanita Bernhardt; eight grandchildren; and eighteen great-grandchildren.",clip:["clippings/james-orman-ca-2019-12-07.jpg"]},

{n:"Gerald R. Rogers",r:"Patrolman",u:9,y:2004,lod:false,notes:"25 years of service; Vietnam Marine veteran, Purple Heart",e:"",ob:"",fb:"",dod:"02/28/2004",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Monday, March 1, 2004, page 14.\n\nGerald R. Rogers, 56, of Memphis, retired as a Shelby County sheriff’s deputy after 25 years of service and died Saturday, February 28, 2004, at his home. He was a Vietnam War Marine Corps veteran and Purple Heart recipient, attended Frayser High School, and was a member of the Gold Wing Motorcycle Club.\n\nServices were held at Memphis Funeral Home Poplar Chapel, with burial in West Tennessee Veterans Cemetery. He was survived by his wife, Jane M. Rogers; three daughters, Amie L. Claburn of Indiana, Rachael A. Flowers of Memphis and Shelley Bendall of Florida; his parents, Homer D. and Marjorie B. Long; a sister, Jana C. Peay; a brother, Daniel B. Long; and two grandchildren.",clip:["clippings/gerald-rogers-ca-2004-03-01.jpg"]},

{n:"Torrance T. Suggs",r:"Patrolman",u:9,y:2013,lod:false,notes:"Serving deputy",e:"",ob:"https://www.legacy.com/us/obituaries/commercialappeal/name/torrance-suggs-obituary?id=12993776",fb:"",dod:"10/22/2013",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Saturday, October 26, 2013, page 4B.\n\nOfficer Torrance T. Suggs, 39, a deputy sheriff with the Shelby County Sheriff’s Department, died Tuesday, October 22, 2013.\n\nServices were held at Old St. Paul Missionary Baptist Church in West Memphis, Ark., with burial in Marion Memorial Cemetery; Anthony Funeral Home South, West Memphis, had charge. He was survived by his wife, Cliffery L. Suggs of Memphis; a daughter, Jasmine T. Suggs, and a son, Jaiden L. Suggs, both of Memphis; his mother, Dorothy L. Suggs of West Memphis; a brother, Travares D. Suggs of West Memphis; his father- and mother-in-law, Ralph and Victoria Penn of Hazen, Ark.; and his sisters- and brothers-in-law.",clip:["clippings/torrance-suggs-ca-2013-10-26.jpg"]},

{n:"James Louis \"J.L.\" Taylor",r:"Lieutenant",u:7,y:1996,lod:false,notes:"Retired Lieutenant, Deputy Jailer",e:"",ob:"",fb:"",dod:"09/17/1996",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Wednesday, September 18, 1996, page 16.\n\nJames Louis Taylor, 55, of Memphis, a retired lieutenant with the Shelby County Sheriff’s Department, died of cancer Tuesday, September 17, 1996, at Methodist Hospital. N.J. Ford & Sons Funeral Home had charge.\n\nHe was survived by his wife, Catherine Taylor; two daughters, Valerie Brady and Renee Taylor; two sons, Orlando Taylor and Marvelas Williams, all of Memphis; three sisters, Helen Jean Hunter of Memphis, Christine Shane of Dallas and Linda Stegstacke of Philadelphia; his great-grandparents, Stein Harris and Rev. C.H. Harris, both of Memphis; and nine grandchildren.",clip:["clippings/james-taylor-ca-1996-09-18.jpg"]},

{n:"Enrique Escobedo Pina",r:"Patrolman",u:9,y:2000,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Detective; former Memphis LULAC chapter president",e:"",ob:"",fb:"",dod:"07/17/2000",obt:"Summary of the “25 years ago — 2000” item in The Commercial Appeal, Memphis, July 19, 2025, page 2A, recalling the paper’s report from July 2000.\n\nEnrique Escobedo Pina, 64, a retired Shelby County Sheriff’s Department detective and former Memphis chapter president of the League of United Latin American Citizens, died Monday, July 17, 2000, of heart failure at Methodist Healthcare-North. Friends and family said he would give the shirt off his back to help fellow Hispanic residents in the Memphis community.",clip:["clippings/enrique-pina-ca-2025-07-19.jpg"]},
{n:"John G. Woodson",r:"Patrolman",u:9,y:2003,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. 22 years of service; Air Force retiree",e:"",ob:"",fb:"",dod:"05/13/2003",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Wednesday, May 14, 2003, page 13.\n\nJohn G. Woodson, 71, of Memphis, formerly of Bruceton, Tenn., retired from the Shelby County Sheriff’s Department after 22 years and also retired from the Air Force. He died Tuesday, May 13, 2003, at Methodist Healthcare-North. He was a member of Baptist Muldoon Church.\n\nServices were held at Dilday Funeral Home in Huntingdon, Tenn., with burial in Bethlehem Cemetery. He was survived by Helen Turner Woodson, his wife of 49 years; two sons, John Michael Woodson of Gerald, Mo., and Mark Edward Woodson of Memphis; two sisters, Nella Woodson Powell of Eddyville, Ky., and Frances Woodson Holley of Lexington, Ky.; a granddaughter; and a stepgranddaughter.",clip:["clippings/john-woodson-ca-2003-05-14.jpg"]},
{n:"Arthur J. Miller",r:"Patrolman",u:9,y:2000,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy",e:"",ob:"",fb:"",dod:"01/25/2000",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Thursday, January 27, 2000, page 18.\n\nArthur J. Miller, 69, of Eads, a retired deputy with the Shelby County Sheriff’s Department, died of heart failure Tuesday, January 25, 2000, at Methodist Hospital of Fayette in Somerville. He sang in the choir at St. James Catholic Church for 35 years.\n\nServices were held at Forest Hill Funeral Home East, with burial in Forest Hill Cemetery East. He was survived by his wife, Wilma Miller; two daughters, Janice Bragg of Atlanta and Dianne Jenkins of Lexington, Ky.; two sons, David Miller of Little Rock and Arthur Miller Jr. of Oakland, Tenn.; two sisters; three brothers; 11 grandchildren; and three great-grandchildren.",clip:["clippings/arthur-miller-ca-2000-01-27.jpg"]},
{n:"Cecil R. Tompkins",r:"Patrolman",u:9,y:1992,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired sheriff's officer",e:"",ob:"",fb:"",dod:"08/05/1992",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Friday, August 7, 1992, page 19.\n\nCecil R. Tompkins, 70, of Arlington, a retired Shelby County sheriff’s officer, died Wednesday, August 5, 1992, at his home. He was a Methodist and a member of Rosemark Masonic Lodge and Al Chymia Shrine.\n\nServices were held in Oneida, Tenn., with Memorial Park Funeral Home in charge. He was survived by his wife, Jo A. Tompkins; two daughters, Sandra Lynn Harris of Clarksville, Tenn., and Sherry Ann Cook of Coleman, Texas; a son, Cecil R. Tompkins Jr. of Memphis; five grandchildren; and three great-grandchildren.",clip:["clippings/cecil-tompkins-ca-1992-08-07.jpg"]},
{n:"Edward V. Gerstel",r:"Patrolman",u:9,y:1993,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy sheriff",e:"",ob:"",fb:"",dod:"11/02/1993",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Thursday, November 4, 1993, page 19.\n\nEdward V. Gerstel, 83, of Memphis, a retired Shelby County deputy sheriff, died Tuesday, November 2, 1993, at Baptist Memorial Hospital East. Graveside services were held at Temple Israel Cemetery, with Memphis Funeral Home Poplar Chapel in charge. He was survived by a nephew who cared for him, Harry Skipper Gerstel of Memphis.",clip:["clippings/edward-gerstel-ca-1993-11-04.jpg"]},
{n:"Thomas Lee Pate Sr.",r:"Patrolman",u:9,y:2008,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Former deputy; also a former Fayette County deputy sheriff",e:"",ob:"",fb:"",dod:"12/14/2008",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Monday, December 15, 2008, page 14.\n\nThomas Lee “Tom” Pate Sr., 65, died Sunday, December 14, 2008. He was a former Shelby County Sheriff’s deputy and a former deputy sheriff for Fayette County, retired from Burlington Northern Railroad, and was a member of New Hope Baptist Church.\n\nServices were held at Forest Hill Funeral Home Midtown. He was survived by a daughter, Pam Pate-McFarlin (Ricky); a son, Thomas L. Pate Jr. (Lynette); a brother, Ernest Pate; and seven grandchildren. He was preceded in death by a brother, Johnny Pate.",clip:["clippings/thomas-pate-ca-2008-12-15.jpg"]},
{n:"Lawrence Edward Geeslin",r:"Patrolman",u:9,y:1990,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy sheriff; Air Force veteran",e:"",ob:"",fb:"",dod:"12/06/1990",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Saturday, December 8, 1990, page 16.\n\nLawrence Edward Geeslin, 58, of Memphis, a retired Shelby County deputy sheriff, died Thursday, December 6, 1990, at Methodist Hospital. He was an Air Force veteran and a member of Al Chymia Shrine and Oakville Masonic Lodge.\n\nGraveside services were held at Forest Hill Cemetery Midtown, with Memphis Funeral Home Poplar Chapel in charge. He was survived by his wife, Jo Ann Geeslin; two daughters, Debbie Gentry and Peggy Weatherby, both of Smyrna, Tenn.; three stepdaughters, Debbie Giles, Donna Eddins and Sandra Mathy; a son, Lawrence Edward Geeslin II, all of Memphis; his mother, Cecilia Geeslin of Sardis, Miss.; and seven grandchildren.",clip:["clippings/lawrence-geeslin-ca-1990-12-08.jpg"]},
{n:"Robert Curtis Cox",r:"Patrolman",u:9,y:null,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Former deputy sheriff",e:"",ob:"",fb:"",dod:"",obt:"Summary of the death notice in The Commercial Appeal, Memphis (date not shown on the copy we have).\n\nRobert Curtis Cox, 80, of Collierville, a former Shelby County deputy sheriff, died on a Monday night at Baptist Memorial Hospital East. He operated a quail and game preserve, retired from the county Health Department, and was a member of Collierville United Methodist Church.\n\nServices were held at Collierville Funeral Home, with burial in Magnolia Cemetery in Collierville. He was survived by his wife, Carolyn Cox; three daughters, Donna Groff, Melissa Knop and Laura Bryant; a sister, Mary Lee Cox, all of Collierville; and six grandchildren.",clip:["clippings/robert-cox-ca.jpg"]},
{n:"Felix Ernest Miller",r:"Patrolman",u:9,y:2002,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy sheriff",e:"",ob:"",fb:"",dod:"04/13/2002",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Monday, April 15, 2002, page 14.\n\nFelix Ernest Miller, 90, of Memphis, a retired deputy sheriff with the Shelby County Sheriff’s Department, died Saturday, April 13, 2002, at his home. He was a member of Highland Street Christian Church, the Tennessee and Mississippi Sheriffs and Peace Officers Association, and the Fraternal Order of Police.\n\nGraveside services were held in Forest Hill Cemetery Midtown. He was preceded in death by his wife, Anne Preddy Miller, and was survived by two daughters, Rosemary Lubiani of Cordova and Margaret Misko of Memphis; a son, F. Gill Miller of Bartlett; five grandchildren; and four great-grandchildren.",clip:["clippings/felix-miller-ca-2002-04-15.jpg"]},
{n:"Floyd T. Ralls",r:"Patrolman",u:9,y:1994,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy sheriff",e:"",ob:"",fb:"",dod:"11/09/1994",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Thursday, November 10, 1994, page 16.\n\nFloyd T. Ralls, 84, of Memphis, a retired deputy sheriff with the Shelby County Sheriff’s Department, died of heart failure Wednesday, November 9, 1994, at AMI St. Francis Hospital. He was a member of Balmoral Baptist Church, the Odd Fellows, Al Chymia Shrine Temple and Scottish Rite, and was a Mason.\n\nServices were held at Balmoral Baptist Church, with burial in Memorial Park; Memphis Funeral Home Poplar Chapel had charge. He was survived by his wife, Geraldine Ralls; a son, David Harvard Ralls; and two brothers, James Ralls and Tom Ralls, all of Memphis.",clip:["clippings/floyd-ralls-ca-1994-11-10.jpg"]},
{n:"Cleveland H. \"Bill\" Neal",r:"Patrolman",u:9,y:2003,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy; World War II veteran",e:"",ob:"",fb:"",dod:"05/13/2003",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Wednesday, May 14, 2003, page 13.\n\nCleveland H. “Bill” Neal, 90, of Memphis, formerly of Newbern, Tenn., a retired deputy with the Shelby County Sheriff’s Department, died Tuesday, May 13, 2003, at Baptist Memorial Hospital-DeSoto in Southaven. He was a World War II veteran, a member of Trinity United Methodist Church, the Tennessee/Mississippi Sheriffs & Peace Officers Association and the Tennessee Law Enforcement Association, and a master mason of Oakville Lodge.\n\nMemphis Funeral Home Poplar Chapel had charge. He was preceded in death by his wife, Jean C. Neal, and was survived by a son, Billy C. Neal of Trenton, Tenn.; two grandchildren; two great-grandchildren; and two great-great-grandchildren.",clip:["clippings/cleveland-neal-ca-2003-05-14.jpg"]},
{n:"Charles Austin \"Sonny\" Jones Jr.",r:"Patrolman",u:9,y:2011,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy",e:"",ob:"",fb:"",dod:"09/01/2011",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Sunday, September 4, 2011, page B6.\n\nCharles Austin “Sonny” Jones Jr., 66, of Lakeland, Tenn., died Thursday, September 1, 2011, at his home. He retired from the Shelby County Sheriff’s Department and was a member of West Frayser Baptist Church. He was an avid horse lover and a loving husband, father and grandfather who cherished his family.\n\nA memorial service was held at Memphis Funeral Home and Memorial Gardens. He was preceded in death by his father, Charlie Jones, and was survived by Betty Ann Jones, his wife of 46 years; daughters Brook Ann (Mark) Laine of Olive Branch, Miss., and Stephanie Lynn (Jay) Westmoreland of Arlington, Tenn.; his sister, Charlotte Miller of Cordova; his mother, Evelyn Jones of Frayser; grandchildren Charley Warf, Eryn Laine and Austin Westmoreland; and a great-granddaughter, Maysen Laine.",clip:["clippings/charles-jones-ca-2011-09-04.jpg"]},
{n:"Harold Wortham",r:"Patrolman",u:9,y:1997,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy sheriff; World War II Marine veteran",e:"",ob:"",fb:"",dod:"09/15/1997",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Tuesday, September 16, 1997, page 14.\n\nHarold Wortham, 71, of Memphis, a retired Shelby County deputy sheriff, died Monday, September 15, 1997, at his home. He was a World War II Marine veteran.\n\nServices were held at Memphis Funeral Home Stage Road Chapel, with burial in Woodhaven Cemetery. He was survived by his wife, Erma Wortham; two daughters, Beverly Matthews of Bartlett and Pam Wortham of Millington; two sons, Larry Wortham of Memphis and Mark Wortham of Dallas; three sisters; two brothers; and eight grandchildren. The family asked that memorials be sent to Schoolfield United Methodist Church.",clip:["clippings/harold-wortham-ca-1997-09-16.jpg"]},
{n:"William J. Parish",r:"Patrolman",u:9,y:1995,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Former deputy",e:"",ob:"",fb:"",dod:"11/15/1995",obt:"From The Commercial Appeal, Memphis, Thursday, November 16, 1995, page 12.\n\nWilliam J. Parish, 76, a former deputy with the Shelby County Sheriff’s Department, died Wednesday, November 15, 1995, at his home in Memphis."},
{n:"William A. Guidry",r:"Patrolman",u:9,y:2000,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy; Army veteran",e:"",ob:"",fb:"",dod:"01/01/2000",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Wednesday, January 12, 2000, page 18.\n\nWilliam A. Guidry, 76, of Ocean Springs, Miss., formerly of Memphis, a retired deputy for the Shelby County Sheriff’s Department, died of heart failure January 1, 2000, in Ocean Springs. He was an Army veteran, a Mason, and a member of Lindenwood Christian Church and Al Chymia Shrine Temple. Bradford-O’Keefe Funeral Home in Biloxi, Miss., had charge. He was the husband of Marjorie Lee Guidry. The family asked that memorials be sent to St. Jude Children’s Research Hospital.",clip:["clippings/william-guidry-ca-2000-01-12.jpg"]},
