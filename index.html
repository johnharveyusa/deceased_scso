<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>End of Watch — SCSO</title>
<meta name="description" content="Honoring the members of the Shelby County Sheriff's Office who have reached their End of Watch.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://johnharveyusa.github.io/deceased_scso/">
<meta property="og:title" content="SCSO End of Watch Memorial">
<meta property="og:description" content="Honoring the members of the Shelby County Sheriff's Office who have reached their End of Watch. Gone but never forgotten.">
<meta property="og:image" content="https://johnharveyusa.github.io/deceased_scso/facebook-banner.png">
<meta property="og:image:secure_url" content="https://johnharveyusa.github.io/deceased_scso/facebook-banner.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Gold Shelby County Sheriff badge with the words End of Watch">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://johnharveyusa.github.io/deceased_scso/facebook-banner.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* COLORS */
  --bg:#0e110a;
  --surface:#141a0f;
  --surface2:#1c2415;
  --border:#2e3d22;
  --khaki:#d4c484;
  --khaki-light:#ede6b8;
  --khaki-dim:#8a7e52;
  --green-row:#1a2c10;      /* alternating row A — dark forest green */
  --green-row2:#243818;     /* slightly lighter for hover */
  --khaki-row:#2c2a15;      /* alternating row B — dark khaki/olive */
  --khaki-row2:#373519;
  --green-accent:#6db33f;
  --green-mid:#4a7a28;
  --text-bright:#ede8d2;
  --text:#cec99a;
  --muted:#7a7552;
  --lod:#9b2020;
  --lod-text:#ffb0b0;
  --lod-row:#2c1010;
  --lod-row2:#3a1414;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Crimson Pro',Georgia,serif;font-size:16px;display:flex;flex-direction:column}

/* ── HEADER ── */
header{
  background:linear-gradient(180deg,#101608 0%,#0e110a 100%);
  border-bottom:2px solid var(--green-mid);
  padding:12px 16px 10px;
  text-align:center;
  position:sticky;top:0;z-index:100;flex-shrink:0;
}
.star-row{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:4px}
.sl{height:1px;flex:1;max-width:60px;background:linear-gradient(90deg,transparent,var(--green-mid))}
.sr{height:1px;flex:1;max-width:60px;background:linear-gradient(90deg,var(--green-mid),transparent)}
.star-icon{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(212,196,132,.55))}
.supertitle{font-family:'Cinzel',serif;font-size:11px;letter-spacing:4px;color:var(--text-bright);margin-bottom:2px}
h1{font-family:'Cinzel',serif;font-size:26px;font-weight:700;color:var(--khaki);letter-spacing:6px;text-shadow:0 0 24px rgba(212,196,132,.4);line-height:1}
.subtitle{font-family:'Cinzel',serif;font-size:11px;color:var(--green-accent);letter-spacing:3px;margin-top:3px;opacity:.9}
.stats-row{display:flex;justify-content:center;gap:20px;margin-top:8px}
.stat-chip{font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;color:var(--text-bright);display:flex;align-items:center;gap:4px}
.stat-chip b{color:var(--khaki);font-size:13px;font-weight:600}

/* ── SHEET STATUS BAR ── */
#sheetBar{padding:5px 12px;background:#0a1208;border-bottom:1px solid var(--border);font-family:'Cinzel',serif;font-size:11px;letter-spacing:1.5px;color:var(--text-bright);display:flex;align-items:center;gap:6px;flex-shrink:0}
#sheetDot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
#sheetDot.live{background:var(--green-accent)}

/* ── CONTROLS ── */
.controls{padding:9px 12px 7px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.search-wrap{position:relative;margin-bottom:7px}
.search-wrap input{width:100%;background:#f4efd9;border:2px solid var(--khaki);border-radius:6px;padding:11px 12px 11px 38px;color:#1a1a12;font-family:'Crimson Pro',serif;font-size:18px;font-weight:600;outline:none;transition:border .2s}
.search-wrap input:focus{border-color:var(--green-accent);background:#ffffff}
.search-wrap input::placeholder{color:#5a5438;font-style:italic;font-weight:400;opacity:1}
.s-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text);font-size:15px;pointer-events:none}
.pills{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:7px 14px;border-radius:20px;border:1px solid var(--khaki-dim);background:rgba(212,196,132,.06);color:var(--khaki-light);font-family:'Cinzel',serif;font-size:12px;font-weight:600;letter-spacing:1.5px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;cursor:pointer;transition:all .18s;flex-shrink:0}
.pill.active,.pill:hover{background:rgba(74,122,40,.35);border-color:var(--green-accent);color:#ffffff}
.pill:focus-visible{outline:2px solid var(--khaki);outline-offset:2px}
.pill .n{display:inline-block;background:rgba(109,179,63,.25);color:var(--text-bright);border-radius:8px;padding:1px 6px;margin-left:4px;font-size:11px;text-decoration:none}

/* ── LIST ── */
.list-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rank-group{margin-bottom:2px}
.rank-hdr{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg);border-top:1px solid var(--border);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.rank-lbl{font-family:'Cinzel',serif;font-size:12px;font-weight:600;letter-spacing:3px;color:var(--green-accent);flex:1}
.rank-cnt{font-family:'Cinzel',serif;font-size:10.5px;color:var(--text);letter-spacing:1px}

/* ── TABLE ROWS — alternating green / khaki ── */
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;transition:background .12s;border-bottom:1px solid rgba(46,61,34,.5)}
.row:nth-child(odd){background:var(--green-row)}
.row:nth-child(even){background:var(--khaki-row)}
.row.lod{background:var(--lod-row) !important}
.row:nth-child(odd):hover{background:var(--green-row2)}
.row:nth-child(even):hover{background:var(--khaki-row2)}
.row.lod:hover{background:var(--lod-row2) !important}
.row-star{width:22px;flex-shrink:0;text-align:center;font-size:11px;color:var(--green-accent);opacity:.7}
.row.lod .row-star{color:var(--lod-text)}
.row-info{flex:1;min-width:0}
.row-name{font-family:'Crimson Pro',serif;font-size:15px;font-weight:600;color:var(--text-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-family:'Cinzel',serif;font-size:10px;letter-spacing:1.5px;color:var(--khaki);margin-top:1px}
.row-yr{font-family:'Cinzel',serif;font-size:13px;color:var(--khaki);flex-shrink:0;min-width:32px;text-align:right}
.lod-tag{display:inline-block;background:rgba(155,32,32,.22);border:1px solid rgba(155,32,32,.5);border-radius:3px;font-family:'Cinzel',serif;font-size:9px;letter-spacing:1px;color:var(--lod-text);padding:1px 4px;margin-left:5px;vertical-align:middle}
.empty{text-align:center;padding:60px 20px;color:var(--text)}
.empty p{font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;margin-top:10px}

/* ── DETAIL OVERLAY ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;display:none;align-items:flex-end}
.overlay.open{display:flex}
.panel{
  background:linear-gradient(180deg,#1e2a12 0%,#191f0d 100%);
  border-top:2px solid var(--green-mid);
  border-radius:16px 16px 0 0;
  width:100%;max-height:82vh;
  overflow-y:auto;
  padding:16px 20px 36px;
  animation:up .25s ease;
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.handle{width:38px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}

/* badge */
.badge-wrap{text-align:center;margin-bottom:14px}
.badge-img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 4px 14px rgba(0,0,0,.75))}

.d-name{font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:var(--khaki-light);letter-spacing:2px;line-height:1.3;margin-bottom:3px;text-align:center}
.d-rank-line{font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;color:var(--green-accent);margin-bottom:14px;text-align:center}
.d-divider{height:1px;background:var(--border);margin:0 0 14px}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.d-field label{font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:2px;color:var(--text);display:block;margin-bottom:3px}
.d-field p{font-family:'Crimson Pro',serif;font-size:16px;color:var(--text-bright)}
.d-notes{background:rgba(14,17,10,.6);border-left:3px solid var(--green-mid);padding:8px 12px;border-radius:0 4px 4px 0;font-style:italic;font-size:13px;color:var(--khaki-dim);margin-top:4px;line-height:1.5}
.btn-close{
  width:100%;margin-top:18px;padding:13px;
  background:rgba(74,122,40,.18);
  border:1px solid var(--green-mid);
  border-radius:6px;
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:4px;
  color:var(--green-accent);cursor:pointer;
  transition:all .15s;
}
.btn-close:hover{background:rgba(74,122,40,.32);border-color:var(--green-accent)}

.row-emp{color:var(--khaki)}
.d-emp{font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;color:var(--khaki);text-align:center;margin:-8px 0 14px}
.d-emp.blank{color:var(--text);font-size:10.5px}
.d-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.d-btn{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:6px;border:1px solid var(--khaki-dim);background:rgba(14,17,10,.55);color:var(--text-bright);font-family:'Cinzel',serif;font-size:12px;letter-spacing:2px;text-decoration:none;cursor:pointer;text-align:left;transition:all .15s}
.d-btn:hover{border-color:var(--khaki);background:rgba(212,196,132,.08)}
.d-btn .ic{font-size:16px;width:20px;text-align:center}
.d-btn small{display:block;font-family:'Crimson Pro',serif;font-size:14px;letter-spacing:0;color:var(--text);font-style:italic;margin-top:2px;text-transform:none}
.d-btn.primary{border-color:var(--green-mid);background:rgba(74,122,40,.18)}
.d-help{font-size:14px;color:var(--text);font-style:italic;text-align:center;margin-top:10px;line-height:1.4}
.d-edit{margin-top:14px;padding:14px;border:1px solid var(--khaki-dim);border-radius:8px;background:rgba(14,17,10,.7)}
.d-edit h3{font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;color:var(--khaki);margin-bottom:10px;font-weight:600}
.d-edit label{display:block;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:2px;color:var(--text);margin:10px 0 4px}
.d-edit input{width:100%;background:#0e110a;border:1px solid var(--border);border-radius:5px;padding:9px 10px;color:var(--text-bright);font-family:'Crimson Pro',serif;font-size:16px;outline:none}
.d-edit input:focus{border-color:var(--khaki)}
.d-edit .hint{font-size:14px;color:var(--text);font-style:italic;margin-top:3px}
.d-edit .err{font-size:13px;color:var(--lod-text);margin-top:8px;min-height:1em}
.d-edit-row{display:flex;gap:8px;margin-top:12px}
.d-edit-row button{flex:1;padding:11px;border-radius:6px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;cursor:pointer;border:1px solid var(--khaki-dim);background:transparent;color:var(--text)}
.d-edit-row button.save{border-color:var(--green-mid);background:rgba(74,122,40,.25);color:var(--green-accent)}
#saveBar{display:none;align-items:center;gap:10px;padding:8px 12px;background:#2c2a15;border-bottom:1px solid var(--khaki-dim);flex-shrink:0}
#saveBar.show{display:flex}
#saveBar span{flex:1;font-size:15px;color:var(--khaki-light)}
#saveBar button{padding:8px 12px;border-radius:5px;border:1px solid var(--khaki);background:rgba(212,196,132,.15);color:var(--khaki-light);font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:1.5px;cursor:pointer;white-space:nowrap}
#saveBar button.ghost{border-color:var(--khaki-dim);background:transparent;color:var(--text)}
#adminLink{display:inline-block;margin:0 4px;padding:4px 10px;border:1px solid var(--khaki-dim);border-radius:4px;color:var(--khaki-light);font-size:11px;letter-spacing:2px;text-decoration:none;vertical-align:middle}
#adminLink:hover{background:rgba(212,196,132,.12)}
.d-obit{margin-top:14px;background:rgba(14,17,10,.6);border:1px solid var(--khaki-dim);border-radius:8px;padding:14px 16px}
.d-obit h4{font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;color:var(--khaki);margin-bottom:8px;font-weight:600}
.d-obit .txt{font-family:'Crimson Pro',serif;font-size:17px;line-height:1.55;color:var(--text-bright);white-space:pre-wrap;overflow-wrap:anywhere}
.d-obit .txt.clip{max-height:260px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.d-obit .more{margin-top:8px;background:none;border:1px solid var(--khaki-dim);border-radius:5px;color:var(--khaki-light);font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;padding:7px 12px;cursor:pointer}
.d-obit .src{margin-top:8px;font-size:14px;color:var(--text);font-style:italic}
.d-obit .src a{color:var(--khaki-light)}
.d-edit textarea{width:100%;min-height:160px;background:#0e110a;border:1px solid var(--border);border-radius:5px;padding:9px 10px;color:var(--text-bright);font-family:'Crimson Pro',serif;font-size:16px;line-height:1.45;outline:none;resize:vertical}
.d-edit textarea:focus{border-color:var(--khaki)}
.officer-photo{width:150px;height:180px;object-fit:cover;border-radius:8px;border:2px solid var(--khaki);box-shadow:0 4px 18px rgba(0,0,0,.6)}
.photo-badge{width:44px;height:44px;object-fit:contain;vertical-align:middle;margin-left:-18px;margin-bottom:-8px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.8))}
.ph-edit{display:flex;gap:12px;align-items:center;margin-top:4px}
.ph-edit img{width:70px;height:84px;object-fit:cover;border-radius:5px;border:1px solid var(--khaki-dim)}
.ph-edit .ph-none{width:70px;height:84px;border:1px dashed var(--khaki-dim);border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:12px;text-align:center}
.ph-btns{display:flex;flex-direction:column;gap:6px;flex:1}
.ph-btns label.pick,.ph-btns button{display:block;margin:0;text-align:center;padding:10px;border-radius:6px;border:1px solid var(--khaki);background:rgba(212,196,132,.12);color:var(--khaki-light);font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;cursor:pointer}
.ph-btns button{border-color:var(--khaki-dim);background:transparent;color:var(--text)}
#addOfficerBtn{display:none;width:100%;margin-top:8px;padding:11px;border-radius:6px;border:2px solid var(--khaki);background:rgba(212,196,132,.16);color:var(--khaki-light);font-family:'Cinzel',serif;font-size:13px;font-weight:600;letter-spacing:3px;cursor:pointer}
#addOfficerBtn:hover{background:rgba(212,196,132,.28)}
.d-edit select{width:100%;background:#0e110a;border:1px solid var(--border);border-radius:5px;padding:9px 10px;color:var(--text-bright);font-family:'Crimson Pro',serif;font-size:16px;outline:none}
.d-remove{margin-top:14px;width:100%;padding:10px;border-radius:6px;border:1px solid rgba(155,32,32,.6);background:transparent;color:var(--lod-text);font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;cursor:pointer}
.d-setup ol{margin:8px 0 8px 20px;font-size:16px;line-height:1.55;color:var(--text-bright)}
.d-setup a{color:var(--khaki-light)}
.d-setup b{color:var(--khaki)}
.d-gal{margin-top:14px;background:rgba(14,17,10,.6);border:1px solid var(--khaki-dim);border-radius:8px;padding:14px 16px}
.d-gal h4{font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;color:var(--khaki);margin-bottom:10px;font-weight:600}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gal-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--khaki-dim);cursor:zoom-in;background:#0e110a}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:400;display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#lightbox.open{display:flex}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.gal-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:4px}
.gal-edit .t{position:relative}
.gal-edit .t img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;border:1px solid var(--khaki-dim)}
.gal-edit .t button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(0,0,0,.75);color:#fff;font-size:14px;line-height:24px;cursor:pointer;padding:0}
.gal-add{display:block;margin-top:8px;text-align:center;padding:10px;border-radius:6px;border:1px solid var(--khaki);background:rgba(212,196,132,.12);color:var(--khaki-light);font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;cursor:pointer}
footer{text-align:center;padding:8px;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:2px;color:var(--text);border-top:1px solid var(--border);flex-shrink:0}
</style>
</head>
<body>
<header>
  <div class="star-row"><div class="sl"></div><img class="star-icon" id="hdrBadge" alt="SCSO Badge"><div class="sr"></div></div>
  <div class="supertitle">Shelby County Sheriff's Office</div>
  <h1>END OF WATCH</h1>
  <div class="subtitle">IN HONOR OF THOSE WHO SERVED</div>
  <div class="stats-row">
    <div class="stat-chip"><b id="visCount">0</b>&nbsp;OFFICERS</div>
    <div class="stat-chip"><b id="yodCount">0</b>&nbsp;WITH DATE</div>
    <div class="stat-chip"><b id="lodCount">0</b>&nbsp;LINE OF DUTY</div>
  </div>
</header>

<div id="sheetBar">
  <div id="sheetDot"></div>
  <span id="sheetMsg">DATA SOURCE: EMBEDDED</span>
</div>

<div id="lightbox" onclick="this.classList.remove('open')"><img id="lightboxImg" alt=""></div>
<div id="saveBar">
  <span id="saveMsg"></span>
  <button onclick="publishToSite()">⬆ PUBLISH TO WEBSITE</button>
  <button class="ghost" onclick="downloadUpdatedPage()">⬇ BACKUP COPY</button>
  <button class="ghost" onclick="discardEdits()">DISCARD</button>
</div>

<div class="controls">
  <div class="search-wrap">
    <span class="s-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search by name, notes or S-number..." oninput="render()">
  </div>
  <div class="pills" id="pills"></div>
  <button id="addOfficerBtn" onclick="showAddForm()">＋ ADD OFFICER</button>
</div>

<div class="list-wrap" id="listWrap"></div>
<footer>SCSO · <span id="footCount"></span> · <a href="#" id="adminLink" onclick="adminToggle();return false">ADMIN</a> · LAST UPDATED 10/23/2026</footer>

<div class="overlay" id="overlay" onclick="closeDetail(event)">
  <div class="panel" id="panel">
    <div class="handle"></div>
    <div id="panelContent"></div>
    <button class="btn-close" onclick="document.getElementById('overlay').classList.remove('open')">✕ &nbsp;&nbsp;CLOSE</button>
  </div>
</div>

<script>

// ── RANK ORDER ────────────────────────────────────────────────
const RANK_ORDER=["Sheriff","Chief Deputy","CAO","Chief Inspector","Asst Chief","Inspector","Captain","Lieutenant","Sergeant","Patrolman","Reserve"];
let DATA=[];
let activeRank="all";

// ── GOOGLE SHEET LOADER ───────────────────────────────────────
async function loadSheet(){
  if(!SHEET_ID){
    DATA=EMBEDDED;
    setSheetStatus(false,'EMBEDDED DATA · '+DATA.length+' OFFICERS');
    return;
  }
  try{
    const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
    const res=await fetch(url);
    const text=await res.text();
    const json=JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    const rows=json.table.rows;
    DATA=rows.map(row=>{
      const c=row.c;
      const o={
        n:(c[0]&&c[0].v)||'',
        r:(c[1]&&c[1].v)||'Patrolman',
        u:parseFloat((c[2]&&c[2].v)||9),
        y:(c[3]&&c[3].v)?parseInt(c[3].v):null,
        lod:String((c[4]&&c[4].v)||'').toUpperCase()==='TRUE',
        notes:(c[5]&&c[5].v)||'',
        e:fmtEmp((c[6]&&c[6].v)||''),
        ob:(c[7]&&c[7].v)||'',
        fb:(c[8]&&c[8].v)||'',
        dod:fmtDate((c[9]&&(c[9].f||c[9].v))||'')
      };
      if(o.dod&&!o.y)o.y=yearOf(o.dod);
      return o;
    }).filter(o=>o.n);
    setSheetStatus(true,'LIVE · GOOGLE SHEETS · '+DATA.length+' OFFICERS');
  }catch(e){
    DATA=EMBEDDED;
    setSheetStatus(false,'SHEET ERROR · USING EMBEDDED DATA');
  }
}

// Normalize employee numbers to S-9999 (accepts "s1234", "S 1234", "1234")
function fmtEmp(v){
  v=String(v||'').trim().toUpperCase();
  if(!v)return '';
  const m=v.match(/^S?[\s-]*(\d{1,5})$/);
  return m?'S-'+m[1].padStart(4,'0'):v;
}
// Accepts 3/14/1990, 03-14-1990, 1990-03-14 -> "03/14/1990"; anything else is returned as typed
function fmtDate(v){
  v=String(v||'').trim();
  if(!v)return '';
  let m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(m)return m[1].padStart(2,'0')+'/'+m[2].padStart(2,'0')+'/'+m[3];
  m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return m[2].padStart(2,'0')+'/'+m[3].padStart(2,'0')+'/'+m[1];
  return v;
}
function validDate(s){
  const m=String(s).match(/^(\d\d)\/(\d\d)\/(\d{4})$/);if(!m)return false;
  const d=new Date(+m[3],+m[1]-1,+m[2]);
  return d.getFullYear()==+m[3]&&d.getMonth()==+m[1]-1&&d.getDate()==+m[2]&&d<=new Date();
}
function yearOf(s){const m=String(s||'').match(/(\d{4})/);return m?parseInt(m[1]):null;}
function longDate(s){
  const m=String(s||'').match(/^(\d\d)\/(\d\d)\/(\d{4})$/);if(!m)return s||'';
  return ['January','February','March','April','May','June','July','August','September','October','November','December'][+m[1]-1]+' '+(+m[2])+', '+m[3];
}
// Photos sent by the public go to this address; an administrator reviews them
// and adds the good ones to the officer's gallery. The address is assembled
// in pieces so spam robots can't easily read it from the page.
const PHOTO_EMAIL=['johnharvey.usa','gmail.com'].join('@');
function sendPhotoLink(o){
  const subj='End of Watch photo: '+o.n+' ('+o.r+')';
  const body='Please attach your photo(s) of '+o.n+' to this email.\n\nYour name:\nHow you knew him or her:\nWhen and where the photo was taken (if known):\n\nThank you. An administrator will review the photo and add it to the End of Watch memorial.';
  return 'mailto:'+PHOTO_EMAIL+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
}
function openLightbox(src){document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').classList.add('open');}
function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return u;}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:'';}
function photosLink(o){return safeUrl(o.fb)||FB_GROUP+'/search/?q='+encodeURIComponent(o.n);}
function obitLink(o){return safeUrl(o.ob)||'https://www.google.com/search?q='+encodeURIComponent('"'+o.n+'" obituary Memphis');}

function setSheetStatus(live,msg){
  document.getElementById('sheetDot').className=live?'live':'';
  document.getElementById('sheetMsg').textContent=msg;
}

// ── PILLS ─────────────────────────────────────────────────────
function buildPills(){
  let html=`<button class="pill active" onclick="setRank('all',this)">ALL <span class="n">${DATA.length}</span></button>`;
  RANK_ORDER.forEach(rk=>{
    const cnt=DATA.filter(o=>o.r===rk).length;
    if(cnt) html+=`<button class="pill" onclick="setRank('${rk}',this)">${rk.toUpperCase()} <span class="n">${cnt}</span></button>`;
  });
  document.getElementById('pills').innerHTML=html;
  document.getElementById('yodCount').textContent=DATA.filter(o=>o.y).length;
  document.getElementById('lodCount').textContent=DATA.filter(o=>o.lod).length;
}

function setRank(k,el){
  activeRank=k;
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  render();
}

// ── RENDER ────────────────────────────────────────────────────
function render(){
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  const filtered=DATA.filter(o=>{
    if(activeRank!=='all'&&o.r!==activeRank)return false;
    if(q&&!o.n.toLowerCase().includes(q)&&!o.notes.toLowerCase().includes(q)&&!(o.e||'').toLowerCase().includes(q))return false;
    return true;
  });
  document.getElementById('visCount').textContent=filtered.length;
  document.getElementById('footCount').textContent=filtered.length+' OF '+DATA.length+' OFFICERS';
  const wrap=document.getElementById('listWrap');
  if(!filtered.length){wrap.innerHTML='<div class="empty"><div style="font-size:32px">🕯</div><p>NO OFFICERS FOUND</p></div>';return;}
  const groups={};
  filtered.forEach(o=>{if(!groups[o.r])groups[o.r]=[];groups[o.r].push(o);});
  let html='';
  RANK_ORDER.forEach(rk=>{
    if(!groups[rk])return;
    const officers=groups[rk];

// Edits are kept on this device until "Save updated page" downloads
// a new copy of this file with the changes built in. Publish that copy

const EDIT_KEY='scso_eow_edits_v1';
function loadEdits(){try{return JSON.parse(localStorage.getItem(EDIT_KEY)||'{}');}catch(e){return {};}}
function storeEdits(m){try{localStorage.setItem(EDIT_KEY,JSON.stringify(m));}catch(e){alert('This browser is out of room for unsaved edits. Click SAVE UPDATED PAGE now so nothing is lost.');}}
let EDITS={};
function rankUnit(r){return {'Sheriff':1,'Chief Deputy':2,'CAO':2.5,'Asst Chief':4,'Chief Inspector':4.5,'Inspector':5,'Captain':6,'Lieutenant':7,'Sergeant':8,'Patrolman':9,'Reserve':10}[r]||9;}
function insertOfficer(rec){
  const last=o=>o.n.replace(/["']/g,'').trim().split(/\s+/).pop().toLowerCase();
  let after=-1;
  for(let i=0;i<DATA.length;i++){
    if(DATA[i].r!==rec.r)continue;
    if(last(DATA[i])>last(rec)){DATA.splice(i,0,rec);return i;}
    after=i;
  }
  if(after>=0){DATA.splice(after+1,0,rec);return after+1;}
  DATA.push(rec);return DATA.length-1;
}
function applyEdits(){
  EDITS=loadEdits();
  Object.entries(EDITS).forEach(([n,x])=>{if(!x||!x.add)return;const ex=DATA.find(o=>o.n===n);if(ex)Object.assign(ex,x.add);else insertOfficer(Object.assign({e:'',ob:'',fb:'',dod:'',obt:'',ph:'',y:null,lod:false,notes:''},x.add));});
  Object.entries(EDITS).forEach(([n,x])=>{if(x&&x.del){const i=DATA.findIndex(o=>o.n===n);if(i>=0)DATA.splice(i,1);}});
  DATA.forEach(o=>{const x=EDITS[o.n];if(x&&!x.del&&'e' in x){o.e=x.e;o.ob=x.ob;o.fb=x.fb;o.obt=x.obt||o.obt||'';if('ph' in x)o.ph=x.ph;if('gal' in x)o.gal=x.gal;if('y' in x){o.dod=x.dod||'';o.y=x.y;}}});
  updateSaveBar();
}

async function addGalleryPhotos(files){
  const err=document.getElementById('edErr');
  for(const f of [...files]){
    try{GAL_PENDING.push(await shrinkPhoto(f,1000));}catch(e){err.textContent='One of the files was not a picture we can use.';}

let PH_PENDING;  // undefined = unchanged, '' = removed, data URL = new photo
function shrinkPhoto(file,max=480){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type)){rej(new Error('Not a picture'));return;}
    const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{
      const s=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.8));};im.onerror=()=>rej(new Error('Could not read picture'));im.src=r.result;};
    r.onerror=()=>rej(new Error('Could not read file'));r.readAsDataURL(file);
  });
}

  const err=document.getElementById('edErr');
  try{PH_PENDING=await shrinkPhoto(file);document.getElementById('phPrev').innerHTML=`<img src="${PH_PENDING}" alt="">`;err.textContent='';}

function saveEdit(idx){
  const o=DATA[idx];
  const e=fmtEmp(document.getElementById('edE').value);
  const ob=document.getElementById('edOb').value.trim();
  const fb=document.getElementById('edFb').value.trim();
  const obt=cleanObit(document.getElementById('edObt').value);
  const nn=document.getElementById('edN').value.replace(/\s+/g,' ').trim();
  const nr=document.getElementById('edR').value;
  const nno=document.getElementById('edNo').value.trim();
  const nlod=document.getElementById('edL').checked;
  const dRaw=document.getElementById('edD').value.trim();
  const err=document.getElementById('edErr');
  let dod='',y=null;
  if(dRaw){
    if(/^\d{4}$/.test(dRaw)){
      y=parseInt(dRaw);
      if(y<1819||y>new Date().getFullYear()){err.textContent='Year of death looks wrong.';return;}
    }else{
      dod=fmtDate(dRaw);

      y=yearOf(dod);
    }
  }
  if(e&&!/^S-\d{4,5}$/.test(e)){err.textContent='Employee No. should look like S-1234.';return;}
  if(ob&&!safeUrl(ob)){err.textContent='Obituary link must start with https:// or http://';return;}

  if(obt.length>30000){err.textContent='Obituary text is very long. Please trim menus, ads and comments.';return;}

  if(nn.toLowerCase()!==o.n.toLowerCase()&&DATA.some(x=>x.n.toLowerCase()===nn.toLowerCase())){err.textContent='Another officer already has that name.';return;}
  const ph=PH_PENDING===undefined?(o.ph||''):PH_PENDING;
  const gal=GAL_PENDING.slice();
  const idChanged=nn!==o.n||nr!==o.r||nno!==(o.notes||'')||nlod!==!!o.lod;
  o.e=e;o.ob=ob;o.fb=fb;o.dod=dod;o.y=y;o.obt=obt;o.ph=ph;o.gal=gal;
  if(idChanged){
    // name/rank/note change: record as remove-old + add-new so it publishes cleanly
    const wasAdded=EDITS[o.n]&&EDITS[o.n].add;
    if(wasAdded)delete EDITS[o.n];else EDITS[o.n]={del:true};

  }storeEdits(EDITS);updateSaveBar();
  buildPills();render();showDetail(idx);
}

  let src=PAGE_SRC.replace(/const EMBEDDED = \[[\s\S]*?\n\];/,()=>'const EMBEDDED = [\n'+lines.join(',\n')+'\n];');
  const d=new Date(),mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');

function showKeySetup(){
  document.getElementById('panelContent').innerHTML=`<div class="d-edit d-setup" style="margin-top:0">
    <h3>ONE-TIME SETUP: CONNECT TO THE WEBSITE</h3>
    <p style="font-size:16px;color:var(--text-bright)">So this page can publish changes for you, it needs a GitHub key. You only do this once on this computer.</p>
    <ol>
      <li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub's new-key page</a> (sign in if asked).</li>
      <li><b>Token name:</b> type <i>End of Watch</i>. <b>Expiration:</b> pick the longest choice.</li>
      <li><b>Repository access:</b> choose <i>Only select repositories</i> and pick <b>deceased_scso</b>.</li>
      <li><b>Permissions → Repository permissions → Contents:</b> set to <b>Read and write</b>.</li>
      <li>Click <b>Generate token</b>, then copy the key it shows (it starts with <i>github_pat_</i>).</li>
    </ol>
    <label>PASTE THE KEY HERE</label>
    <input id="ghTok" placeholder="github_pat_..." autocomplete="off">
    <div class="err" id="ghErr"></div>
    <div class="d-edit-row"><button onclick="document.getElementById('overlay').classList.remove('open')">CANCEL</button><button class="save" onclick="saveKeyAndPublish()">SAVE &amp; PUBLISH</button></div>
  </div>`;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').scrollTop=0;
}
function saveKeyAndPublish(){
  const t=document.getElementById('ghTok').value.trim();
  if(!/^(github_pat_|ghp_)/.test(t)){document.getElementById('ghErr').textContent='That doesn\'t look like a GitHub key. It should start with github_pat_';return;}
  try{localStorage.setItem(GH_KEY,t);}catch(e){}
  document.getElementById('overlay').classList.remove('open');
  publishToSite();
}
let PUBLISHING=false;
async function publishToSite(){
  if(!IS_ADMIN||PUBLISHING)return;
  const tok=ghToken();
  if(!tok){showKeySetup();return;}
  PUBLISHING=true;
  const msg=document.getElementById('saveMsg');msg.textContent='Publishing…';
  const api='https://api.github.com/repos/'+GH_REPO+'/contents/'+GH_FILE;
  const hdr={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  try{
    const cur=await fetch(api+'?ref=main',{headers:hdr,cache:'no-store'});
    if(cur.status===401||cur.status===403||cur.status===404){
      try{localStorage.removeItem(GH_KEY);}catch(e){}
      PUBLISHING=false;updateSaveBar();
      alert('GitHub did not accept the key (it may have expired or lack permission). Please set it up again.');
      showKeySetup();return;
    }
    if(!cur.ok)throw new Error('GitHub answered '+cur.status);
    const sha=(await cur.json()).sha;
    // new gallery photos go up as their own files so the page stays small
    const base='https://api.github.com/repos/'+GH_REPO+'/contents/';
    let up=0;
    for(const o of DATA){
      if(!o.gal)continue;
      for(let i=0;i<o.gal.length;i++){
        const g=o.gal[i];
        if(!/^data:image\//.test(g))continue;
        const slug=o.n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
        const path='photos/'+slug+'-'+Date.now().toString(36)+'-'+i+'.jpg';
        msg.textContent='Publishing… uploading photo '+(++up);
        const r=await fetch(base+path,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hdr),
          body:JSON.stringify({message:'Photo for '+o.n,content:g.split(',')[1],branch:'main'})});
        if(!r.ok)throw new Error('photo upload failed ('+r.status+')');
        o.gal[i]=path;
      }
    }
    Object.keys(EDITS).forEach(k=>{const x=EDITS[k];const o=DATA.find(d=>d.n===k);if(x&&x.gal&&o)x.gal=o.gal.slice();});storeEdits(EDITS);
    const n=Object.keys(EDITS).length;
    const put=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hdr),
      body:JSON.stringify({message:'Memorial update: '+n+' change'+(n!==1?'s':''),content:toB64(buildPageSource()),sha,branch:'main'})});
    if(put.status===409||put.status===422){PUBLISHING=false;updateSaveBar();alert('Someone else published a change at the same moment. Click Publish again.');return;}
    if(!put.ok)throw new Error('GitHub answered '+put.status);
    EDITS={};try{localStorage.removeItem(EDIT_KEY);}catch(e){}
    PUBLISHING=false;updateSaveBar();
    alert('Published! The website will show your changes in about 1 to 2 minutes.');
  }catch(e){
    PUBLISHING=false;updateSaveBar();
    alert('Could not publish right now ('+e.message+'). Your changes are still saved on this computer. Check your internet connection and click Publish again.');
  }
}
function downloadUpdatedPage(){
  const src=buildPageSource();
  const blob=new Blob([src],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SCSO_EndOfWatch.html';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  alert('A backup copy was downloaded as SCSO_EndOfWatch.html. Your changes are still waiting to be published.');
}

// ── MEMORIAL BANNER (PNG download) ────────────────────────────
async function downloadBanner(idx){
  const o=DATA[idx];
  try{await document.fonts.ready;}catch(e){}
  const W=1200,H=630,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1e2a12');g.addColorStop(1,'#0e110a');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='#4a7a28';x.lineWidth=4;x.strokeRect(18,18,W-36,H-36);
  x.strokeStyle='rgba(212,196,132,.45)';x.lineWidth=1;x.strokeRect(30,30,W-60,H-60);
  const img=new Image();img.src=BADGE_SRC;
  await new Promise(r=>{img.onload=r;img.onerror=r;});
  x.save();x.shadowColor='rgba(0,0,0,.7)';x.shadowBlur=24;x.drawImage(img,70,135,360,360);x.restore();
  const cx=800;x.textAlign='center';
  x.fillStyle='#8a7e52';x.font='600 20px Cinzel, Georgia, serif';
  x.fillText(spaced("SHELBY COUNTY SHERIFF'S OFFICE"),cx,120);
  x.fillStyle='#d4c484';x.font='700 54px Cinzel, Georgia, serif';
  x.fillText(spaced('END OF WATCH'),cx,190);
  x.fillStyle='#4a7a28';x.fillRect(cx-170,215,340,2);
  x.fillStyle='#6db33f';x.font='600 26px Cinzel, Georgia, serif';
  x.fillText(spaced((o.lod?o.r+' · LINE OF DUTY':o.r).toUpperCase()),cx,272);
  let size=58;x.font=`700 ${size}px Cinzel, Georgia, serif`;
  while(x.measureText(o.n).width>660&&size>30){size-=2;x.font=`700 ${size}px Cinzel, Georgia, serif`;}
  x.fillStyle='#ede6b8';x.fillText(o.n,cx,350);
  x.fillStyle='#d4c484';x.font='600 30px Cinzel, Georgia, serif';
  x.fillText(o.e?o.e:'',cx,410);
  x.fillStyle='#cec99a';x.font='italic 30px "Crimson Pro", Georgia, serif';
  x.fillText(o.dod?'End of Watch · '+longDate(o.dod):(o.y?'End of Watch '+o.y:'In Honor of Those Who Served'),cx,o.e?470:440);
  x.fillStyle='#7a7552';x.font='600 16px Cinzel, Georgia, serif';
  x.fillText(spaced('GONE BUT NEVER FORGOTTEN'),cx,560);
  c.toBlob(b=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download=(o.e?o.e+'_':'')+o.n.replace(/[^A-Za-z0-9]+/g,'_')+'_EOW_Banner.png';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  },'image/png');
}
function spaced(s){return s.split('').join(String.fromCharCode(8202));}
