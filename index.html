{n:"John Henry Epps",r:"Lieutenant",u:7,y:1994,lod:false,notes:"Serving lieutenant, Internal Affairs",e:"",ob:"",fb:"",dod:"02/09/1994",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Friday, February 11, 1994, page 15.\n\nLt. John Henry Epps, 43, of Memphis, a deputy sheriff with the Internal Affairs division of the Shelby County Sheriff’s Department, died of pneumonia Wednesday, February 9, 1994, at Methodist Hospital. He was a member of Mt. Moriah East Baptist Church.\n\nServices were held at Mt. Moriah East Baptist Church, with burial in New Hope Baptist Church Cemetery in Gloster, Miss.; N.J. Ford & Sons Funeral Home had charge. He was survived by a daughter, Lekietha Shontell Theresa Epps, and a son, L’John Sylvel Timothy Epps, both of Washington; his mother, Edna E. Thompson of Centreville, Miss.; his father, John A. Epps of Syracuse, N.Y.; a sister, Ann Marie Williams of Houston; and two brothers, Rev. G. A. Epps of Houston and Rev. C. L. Ross of New Orleans.",clip:["clippings/john-epps-ca-1994-02-11.jpg"]},
{n:"James David \"Jim\" Wilkinson Jr.",r:"Lieutenant",u:7,y:2012,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Began as a Reserve Deputy in 1970; retired as Lieutenant in 1990; named Officer of the Decade by the Memphis and Shelby County Bar Association; Korean War Air Force veteran",e:"",ob:"",fb:"",dod:"10/24/2012",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Friday, October 26, 2012, page 5B.\n\nJames David “Jim” Wilkinson Jr. was born January 28, 1934, in Memphis to Cora Teague and James D. Wilkinson Sr. He attended Bartlett High School before entering the U.S. Air Force during the Korean War. He died Wednesday, October 24, 2012, at Methodist Hospice Residence after a courageous bout with pancreatic cancer.\n\nHe began his career as a Reserve Deputy Sheriff in 1970 and retired from the Shelby County Sheriff’s Department as a lieutenant in 1990. He met his wife, Paula Holt Moseley, while working with Parents Against Illegal Narcotics, started by Sheriff Bill Morris; they married January 19, 1972. After retirement he worked security at Memphis University School and First Tennessee Bank in Olive Branch.\n\nHe was named Officer of the Decade by the Memphis and Shelby County Bar Association and was honored as one of President George H.W. Bush’s Thousand Points of Light. A charter member of the Poplar East Optimist Club for 30 years, he served as Optimist Governor of the Tennessee District in 1982–83 and was named Most Outstanding Civic Club President by the Gavel Club; he later helped build the Curve Optimist Club. He served as a Neighborhood Watch chief in Olive Branch and was a member of Piperton United Methodist Church and Unity Lodge.\n\nFuneral services were held at Memphis Funeral Home and Memorial Gardens, Poplar Avenue, with burial with honors in Memorial Park Cemetery. He was preceded in death by his parents, two sisters and a son, Randy Wilkinson, and was survived by his wife, Paula; his son, H. Kenneth Moseley (Jane); grandchildren, step-grandchildren and five great-grandchildren.",clip:["clippings/jim-wilkinson-ca-2012-10-26.jpg"]},

{n:"B. L. \"Benny\" Hicks Jr.",r:"Sergeant",u:8,y:2021,lod:false,notes:"27 years of service. Fugitive and sting work with his partner John Harvey; together they made 25 fugitive arrests in a single 8-hour shift, a record no one else has come close to. Deacon at Bellevue Baptist Church",e:"",ob:"",fb:"",dod:"09/01/2021",obt:"Obituary provided by his wife, Barbara Hicks.\n\nB. L. “Benny” Hicks Jr. went to be with his Lord and Savior on September 1, 2021. He joins his mom and dad, Fanny and B. L. Hicks Sr. Benny leaves his wife, Barbara, of 55 years; a son, Brandon (wife Angie); a daughter, Dawn Johnson; his sister, Dale; and five grandchildren, Justin and Becca Hicks and Nathan, Aaron and Josiah Johnson.\n\nBenny served as a Shelby County deputy sheriff for 27 years. He later worked as an insurance adjuster. He was a Biblical guidance counselor and a deacon at Bellevue Baptist Church. Benny was a Godly leader until his lengthy illness and death."},

{n:"Cecil A. Hurst",r:"Sergeant",u:8,y:1992,lod:false,notes:"26 years of service; retired Army chief warrant officer (41 years, Army and Army Reserve)",e:"",ob:"",fb:"",dod:"01/11/1992",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Sunday, January 12, 1992, page 20.\n\nCecil A. Hurst, 59, of Memphis, retired as a Shelby County deputy sheriff after 26 years. He also retired as a chief warrant officer after 41 years in the Army and Army Reserve. He died Saturday, January 11, 1992, at his home.\n\nServices were held at Memphis Funeral Home Poplar Chapel, with burial in Memorial Park. He was survived by a daughter, Carol Hurst, and his mother, Mary D. Hurst, both of Memphis. The family asked that memorials be sent to the Fraternal Order of Police.",clip:["clippings/cecil-hurst-ca-1992-01-12.jpg"]},

{n:"Joseph John \"Jo Jo\" Martin",r:"Sergeant",u:8,y:1996,lod:false,notes:"Navy retiree; volunteer fund-raiser for St. Jude Children's Research Hospital",e:"",ob:"",fb:"",dod:"03/22/1996",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Sunday, March 24, 1996, page 24.\n\nJoseph John Martin, 71, of Memphis, retired from the Navy and as a Shelby County Sheriff’s deputy, died of heart failure Friday, March 22, 1996, at his home. He was a communicant of St. Louis Catholic Church and a volunteer fund-raiser for St. Jude Children’s Research Hospital.\n\nA funeral Mass was said at St. Louis Catholic Church, with burial in West Tennessee Veterans Cemetery; Memphis Funeral Home had charge. The family asked that memorials be sent to St. Jude Children’s Research Hospital.",clip:["clippings/joseph-martin-ca-1996-03-24.jpg"]},

{n:"Charles Edward \"Charlie\" May",r:"Sergeant",u:8,y:2010,lod:false,notes:"25 years of service; Korean War veteran; six years in the Marine Corps Reserve",e:"",ob:"https://www.legacy.com/us/obituaries/commercialappeal/name/charles-may-obituary?id=14381645",fb:"",dod:"07/17/2010",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Monday, July 19, 2010, page DSA3.\n\nCharles Edward May, 76, of Harrisburg, Ark., died July 17, 2010, at St. Bernard’s Hospital in Jonesboro, Ark. He was born in Meridian, Miss., to William and Suzie May and graduated from Humes High School. He retired as a deputy from the Shelby County Sheriff’s Office after 25 years of faithful and dedicated service. He was a Korean War veteran and served six years in the Marine Corps Reserve. He attended Shiloh Baptist Church in Harrisburg and enjoyed working on and restoring antique cars.\n\nFuneral services were held at Memorial Park Funeral Home. He was preceded in death by his parents and by a wife, Patricia Black Dumas May, and was survived by Alene Davis May, his wife of seven years; two daughters, Terry May Landrum and Jill Clark; a son, Randy May; two brothers, William H. May of Weir, Miss., and George May of Brandon, Miss.; and a sister, Frances Harris of Denison, Texas.",clip:["clippings/charles-may-ca-2010-07-19.jpg"]},

{n:"Raymond Nippers",r:"Sergeant",u:8,y:2003,lod:false,notes:"32nd degree Mason",e:"",ob:"https://www.findagrave.com/memorial/65263659/raymond-nippers",fb:"",dod:"11/26/2003",obt:"From the death notice in The Commercial Appeal, Memphis, November 27, 2003, as recorded on Find a Grave.\n\nRaymond Nippers, 86, a retired Shelby County sheriff’s deputy, died Wednesday, November 26, 2003, at his home in Memphis. He was born July 7, 1917, in Alamo, Tenn. He was a 32nd degree Mason and a member of White Station O.K. Houck Lodge and Al Chymia Shrine.\n\nGraveside services were held at Memorial Park, with Memorial Park Funeral Home in charge. He was survived by a son, Robert Burress of Ponte Vedra Beach, Fla., and two grandchildren."},

{n:"Ronald A. \"Ronnie\" Ragghianti",r:"Sergeant",u:8,y:2008,lod:false,notes:"Retired detective, 22 years; Army veteran; brother of Kenneth Robert Ragghianti",e:"",ob:"https://www.peeblesfuneralhome.com/obituaries/ronald-ragghianti",fb:"",dod:"05/27/2008",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Thursday, May 29, 2008, page 17.\n\nRonald A. Ragghianti, 65, of Bartlett, retired as a detective with the Shelby County Sheriff’s Department after 22 years. A U.S. Army veteran, he died May 27, 2008, at his home. He was a Christian who enjoyed watersports.\n\nGraveside services with military honors were held at Somerville City Cemetery, with Peebles Fayette County Funeral Home-West Chapel in charge. He was survived by his wife, Shirley Glover Thomas Ragghianti; two stepdaughters, Cindy Thomas of Rock Springs, Wyo., and Leanne Thomas of Denver; two sisters, Joyce Armstrong of Fort Lauderdale, Fla., and Debra Lamar of Millington; a granddaughter; and two great-grandsons.",clip:["clippings/ronald-ragghianti-ca-2008-05-29.jpg"]},

{n:"Mark M. Rochevot",r:"Sergeant",u:8,y:2004,lod:false,notes:"Vietnam War veteran",e:"",ob:"",fb:"",dod:"11/06/2004",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Monday, November 8, 2004, page 16.\n\nMark M. Rochevot, 61, of Bartlett, retired from the Shelby County Sheriff’s Department, died Saturday, November 6, 2004, at Saint Francis Hospital. He was a Vietnam War veteran.\n\nServices were held at Memphis Funeral Home Germantown Parkway Chapel, with burial in Memory Hill Gardens. He was survived by his wife, Billie J. Rochevot; three daughters, Jennifer Rochevot of San Diego, and Cristy Rochevot Henry and Ashley Rochevot, both of Bartlett; a son, David Rochevot of Bartlett; his mother, Juanita Hendren of Southaven; a brother, Gary Rochevot of Tampa; five grandchildren; and a great-grandchild.",clip:["clippings/mark-rochevot-ca-2004-11-08.jpg"]},

{n:"Betty Jean Sanders",r:"Sergeant",u:8,y:2023,lod:false,notes:"",e:"",ob:"https://www.hillcrestcemetery.com/obituaries/Betty-Jean-Sanders?obId=49668091",fb:"",dod:"06/07/2023",obt:"Betty Jean Sanders of Myrtle Beach, South Carolina passed away on June 7, 2023 at age 86. A beloved mother, Grandma, and Memaw, Betty joined her heavenly family and friends after a vigorously-fought battle with a brief illness. Betty was born to Retta Bell Keath and Russell Keath on June 8, 1936 in Helena, Arkansas. Betty married her husband, T. Sargeant Windell Lenwood Sanders (USAF), on November 19, 1955 in Center, Texas. They made homes in Louisiana, South Carolina, North Carolina, and Turkey, throughout Windell's service in the Air Force, before his passing in 1970. After his passing, Betty returned to Memphis, Tennessee. She was employed as a Deputy with the Shelby County Sheriff's Department and went on to win multiple awards for excellent marksmanship. Betty was known for her love of all plants and her incredible green thumb! She also enjoyed birdwatching, researching family ancestry, painting, and reading. She was a loyal friend and dedicated advocate for all animals, especially her many beloved pets. Betty had a passion for travelling to visit family and friends, as well as exploring the world. She traversed North America, Australia, and Europe - often discussing future return travel plans to Australia, her favorite destination. She was a member of Forestbrook Baptist Church, Caring and Sharing Group, and Beacon Sunday School Class, where she made many special friendships. Betty was also a member of the Order of the Eastern Star, Order of the Amaranth, Daughters of the Nile, and the Fraternal Order of Police. Betty is preceded in death by her husband, Windell Sanders, her parents Retta Bell Keath Littrell and Russell Keath, and her brother, Thomas Russell Keath. She is survived by two sons, Michael Sanders (Terry) of Loris, South Carolina and Stephen Sanders (Christen) of John's Island, South Carolina, three granddaughters, Jenna Hudson (Nicholas), Melissa Sanders and Mallorie Sanders, one great-granddaughter, Ansley Hudson, one brother Larry Keath (Ann) of Lake Cormorant, Mississippi, brothers-in-law: Tom Hucks, Herman Sanders, Delano Sanders, Jimmy Sanders, Paul Sanders (Nora), Larry Sanders, sisters-in-law Rhonda Butler, Catherine Sanders, and many beloved nieces and nephews. She is also survived by her beloved dog, Penny. The family wishes to express their sincere gratitude to the and caring staff of Arbor Landing Independent Living, Forestbrook Baptist Church family; ministry team, and the many nurses and doctors who provided compassionate care for Betty throughout the last months. Services will be held at 2:00 PM on Friday, June 16, 2023 at Forestbrook Baptist Church with Dr. Randall Helms officiating. Inurnment will follow at Hillcrest Cemetery. The family will receive friends from 1:00 PM to 2:00 PM at Forestbrook Baptist Church, before the service. \"See, I am sending an angel ahead of you to guard you along the way and to bring you to the place I have prepared.\" Exodus 23:20. Please sign the online guestbook at www.goldfinchfuneralhome.com Goldfinch Funeral Home, Conway Chapel is in charge of arrangements.\nCemetery\nHillcrest Cemetery\n1000 Hwy 544\nConway SC 29526\nUS\n843-347-4909",ph:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcA {n:"Donald Ray \"Don\" Scott",r:"Sergeant",u:8,y:2022,lod:false,notes:"Retired Sergeant; later security at The Peabody Memphis",e:"",ob:"https://www.commercialappeal.com/obituaries/mca065941",fb:"",dod:"11/24/2022",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Tuesday, December 6, 2022, page 9A.\n\nDonald Ray Scott, 75, of Memphis, died peacefully on November 24, 2022, surrounded by family. A lifelong Memphian, he was a retired sergeant with the Shelby County Sheriff’s Department and later a security guard at The Peabody Memphis hotel, where he got to meet and talk with celebrities and people from all over the world. He loved to travel, fish, camp, play cards and visit with friends and family, and he loved to have fun and make people laugh.\n\nHe was married to Robin Scott for 40 years. He was “Daddy” to his daughters, Kim Ewerling of Memphis, Crystal Theobald of Fort Collins, Colo., and Rebecca Scott of Memphis, and “Rough Grandpa” to his grandchildren, Dr. Michael Hankins, Destiny Hankins, Emily Bridges, Madison Wood and Elliot Theobald; he also had four great-grandchildren. He was preceded in death by his parents, Robert and Doris Scott; his sister, Bobbie Jean Soto; his brother, Steve Scott; and his granddaughter, Sarah Theobald. His family held a Celebration of Life at his beloved Peabody Memphis Hotel.",ph:"photos/donald-scott.jpg",clip:["clippings/donald-scott-ca-2022-12-06.jpg"]},

{n:"Ora B. Ferguson",r:"Sergeant",u:8,y:2013,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired Sergeant",e:"",ob:"",fb:"",dod:"09/11/2013",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Wednesday, September 18, 2013, page 4B.\n\nOra B. Ferguson, 83, a retired sergeant of the Shelby County Sheriff’s Department and widow of Percy James Ferguson Sr., died Wednesday, September 11, 2013.\n\nThe funeral was held at Greater Adelaide Baptist Church, with burial in New Park Cemetery. Her life and legacy will be cherished by her children, Irene (Milton) Murray, Betty (James) Chapman, Debra Ferguson, Calvin Ferguson and Lisa (Lee Andre) Taber; nine grandchildren; five great-grandchildren; and many other relatives and friends. She was preceded in death by two children, Dorothy Ferguson and Percy James Ferguson Jr., and by her siblings.",clip:["clippings/ora-ferguson-ca-2013-09-18.jpg"]},

{n:"Robert G. \"Bob\" Austin",r:"Patrolman",u:9,y:1997,lod:false,notes:"Serving deputy, 23 years",e:"",ob:"https://www.findagrave.com/memorial/102540873/robert_g-austin",fb:"",dod:"05/23/1997",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Sunday, May 25, 1997, page 19. (The copy we have shows the first part of the notice.)\n\nRobert G. Austin, 48, of Nesbit, Miss., a deputy with the Shelby County Sheriff’s Department for 23 years, died of heart failure Friday, May 23, 1997, at Methodist Hospital. Services were held at Twin Oaks Funeral Home in Southaven, with burial in Twin Oaks Memorial Gardens.",clip:["clippings/robert-austin-ca-1997-05-25.jpg"]},

{n:"Stephen Burt \"Steve\" Bramlett",r:"Patrolman",u:9,y:2011,lod:false,notes:"Serving deputy, 24 years; youth baseball and basketball coach for 21 years",e:"",ob:"https://www.legacy.com/us/obituaries/commercialappeal/name/stephen-bramlett-obituary?id=21788932",fb:"",dod:"12/03/2011",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Wednesday, December 7, 2011, page DSA6.\n\nStephen Burt “Steve” Bramlett, 52, of Bartlett, died suddenly Saturday, December 3, 2011, in Paris, Tenn. He was born August 22, 1959, to Betty (Bradley) Bramlett and the late Burt Bramlett, and graduated from Frayser High School, where he played baseball and basketball. He served the Shelby County community for 24 years as a deputy sheriff with the Shelby County Sheriff’s Department.\n\nHis love of sports and of young people led him to coach baseball and basketball for 21 years, including both of his sons, and to run youth organizations such as the Memphis Travelers and Bartlett Panthers SYS, where he helped build young men out of boys by instilling morals and words of inspiration. He loved golf, hunting and fishing with his boys and his friends, and was a member of the Church of Christ. His family wrote that his smile could light up any room and that he was quite simply the very best.\n\nHe was survived by Penne, his wife of 28 years; two sons, Kurtis and Konner of Bartlett; his mother, Betty Bramlett; and his sister, Pam Godsey of Cordova.",clip:["clippings/steve-bramlett-ca-2011-12-07.jpg"]},

{n:"Tommy M. Davis",r:"Patrolman",u:9,y:2008,lod:false,notes:"",e:"",ob:"https://obits.postandcourier.com/us/obituaries/commercialappeal/name/tommy-davis-obituary?id=7581396",fb:"",dod:"11/09/2008",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Tuesday, November 11, 2008, page 14.\n\nTommy M. Davis, 60, of Memphis, a retired deputy sheriff, died November 9, 2008, at St. Francis Hospital-Bartlett. His family wrote that his belief system truly was to protect and serve his family, friends and community.\n\nA gathering of family and friends was held at Memphis Funeral Home Poplar Chapel. He was survived by his wife, Cynthia M. Davis of Memphis; two daughters, Valerie Byrd and Anna DeFelice; a son, Blake Davis; and four grandchildren, Julia Byrd, Andrew Byrd, Alissa DeFelice and Phillip DeFelice.",clip:["clippings/tommy-davis-ca-2008-11-11.jpg"]},

{n:"James Earwood",r:"Patrolman",u:9,y:1998,lod:false,notes:"Air Force senior master sergeant (retired)",e:"",ob:"https://www.findagrave.com/memorial/147077465/james_harold_earwood",fb:"",dod:"09/11/1998",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Sunday, September 13, 1998, page 20.\n\nJames Harold Earwood, 69, of Memphis, retired from the Shelby County Sheriff’s Department, died of heart failure Friday, September 11, 1998, at his home. He was a retired senior master sergeant in the Air Force and a Baptist.\n\nServices were held at Roller Family Funeral Home in Memphis, with burial in Memorial Park. He was survived by his wife, Melba Earwood; three sons, James H. Earwood Jr. and James A. Earwood, both of Memphis, and John G. Earwood of Moscow, Tenn.; a sister, Ruth Hargett of Southaven; and three grandchildren.",clip:["clippings/james-earwood-ca-1998-09-13.jpg"]},

{n:"Clyde Eugene \"Gene\" Garrett Jr.",r:"Patrolman",u:9,y:1990,lod:false,notes:"Serving deputy",e:"",ob:"",fb:"",dod:"02/11/1990",obt:"From the death notice in The Commercial Appeal, Memphis, Thursday, February 15, 1990, page 18.\n\nClyde Eugene Garrett Jr., 44, a Shelby County Sheriff’s deputy, died Sunday, February 11, 1990. Services were held at Newsom Funeral Home in Charleston, Miss., with burial in Magnolia Gardens Cemetery near Charleston. He was survived by two sisters, Joyce Hamilton of Mason, Tenn., and Kathy Poff of St. Louis, and his parents, Dorothy Garrett and Clyde Eugene Garrett, both of Charleston."},

{n:"Ray Lawrence Long",r:"Patrolman",u:9,y:2016,lod:false,notes:"Deputy, more than 25 years of service",e:"",ob:"https://www.legacy.com/us/obituaries/commercialappeal/name/ray-long-obituary?id=9106261",fb:"",dod:"01/24/2016",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Wednesday, January 27, 2016, page 5B.\n\nRay Lawrence Long, 77, of Bartlett, was born January 3, 1939, in Guntown, Miss., and died January 24, 2016. A graduate of Bartlett High School and a member of Bartlett Hills Baptist Church, he served as a deputy with the Shelby County Sheriff’s Office for more than 25 years. He loved fishing, tinkering with his antique cars, traveling to swap meets across the country, and spending time with his friends and family.\n\nFuneral services were held at Forest Hill Funeral Home & Memorial Park East, with interment at Joel Cemetery near Dennis, Miss. He was preceded in death by his parents, Bolivar L. and Elsie Morris Long; his siblings, Juanita Long, Bobby Roy Long, Bonnie Long Bishop, Charles Long and Joyce Long Wadley; and a niece, Debbie Long. He was survived by his sister, Patricia Ann Long Kerley (James); many nieces and nephews; and his beloved dogs, Molly, Tia and Little Britches. The family asked that donations be made to Mid-South Spay & Neuter Services or the Street Dog Foundation.",clip:["clippings/ray-long-ca-2016-01-27.jpg"]},

{n:"J. Michael Davis",r:"Patrolman",u:9,y:2006,lod:false,notes:"Legal name Preston R. Moore. Memphis radio disc jockey (midnight shift); Vietnam veteran, PFC, U.S. Army",e:"",ob:"https://www.legacy.com/us/obituaries/legacyremembers/preston-davis-obituary?id=16041637",fb:"",dod:"07/01/2006",obt:"J. Michael Davis — legal name Preston R. “Jaye Michael Davis” Moore — was born October 21, 1943, and died July 1, 2006, in Tunica County, Miss., at age 62. He served with the Shelby County Sheriff’s Office and was also known to many Memphians as a local radio disc jockey who worked the midnight shift.\n\nHe served in Vietnam as a private first class in the U.S. Army and is buried at West Tennessee State Veterans Cemetery in Memphis, Section MM, Site 23746 (Find a Grave memorial 19144823: https://www.findagrave.com/memorial/19144823/preston_r-moore)."},

{n:"James Howard \"Jim\" Orman",r:"Patrolman",u:9,y:2019,lod:false,notes:"25 years of service; member of the F.O.P.",e:"",ob:"https://www.munfordfuneralhome.com/obituaries/James-Howard-Orman?obId=40996995",fb:"",dod:"12/05/2019",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Saturday, December 7, 2019, page 9A.\n\nJames Howard Orman, 83, of Atoka, died December 5, 2019, at Baptist Tipton in Covington. He retired after 25 years of service as a sheriff’s deputy with the Shelby County Sheriff’s Department. He was a member of Gateway Baptist Church and the Fraternal Order of Police.\n\nServices were held at Munford Funeral Home, Munford Chapel, with burial at Salem ARP Cemetery in Atoka. He was survived by Shirley Jean Orman, his wife of 66 years; daughters Cheryl (Frank) Huggins, Sherry Lewis and Diane (Chip) Grimes; sisters Janice Orman, Janell (Carl) Gault and Lanita Bernhardt; eight grandchildren; and eighteen great-grandchildren.",clip:["clippings/james-orman-ca-2019-12-07.jpg"]},

{n:"Gerald R. Rogers",r:"Patrolman",u:9,y:2004,lod:false,notes:"25 years of service; Vietnam Marine veteran, Purple Heart",e:"",ob:"",fb:"",dod:"02/28/2004",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Monday, March 1, 2004, page 14.\n\nGerald R. Rogers, 56, of Memphis, retired as a Shelby County sheriff’s deputy after 25 years of service and died Saturday, February 28, 2004, at his home. He was a Vietnam War Marine Corps veteran and Purple Heart recipient, attended Frayser High School, and was a member of the Gold Wing Motorcycle Club.\n\nServices were held at Memphis Funeral Home Poplar Chapel, with burial in West Tennessee Veterans Cemetery. He was survived by his wife, Jane M. Rogers; three daughters, Amie L. Claburn of Indiana, Rachael A. Flowers of Memphis and Shelley Bendall of Florida; his parents, Homer D. and Marjorie B. Long; a sister, Jana C. Peay; a brother, Daniel B. Long; and two grandchildren.",clip:["clippings/gerald-rogers-ca-2004-03-01.jpg"]},

{n:"Torrance T. Suggs",r:"Patrolman",u:9,y:2013,lod:false,notes:"Serving deputy",e:"",ob:"https://www.legacy.com/us/obituaries/commercialappeal/name/torrance-suggs-obituary?id=12993776",fb:"",dod:"10/22/2013",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Saturday, October 26, 2013, page 4B.\n\nOfficer Torrance T. Suggs, 39, a deputy sheriff with the Shelby County Sheriff’s Department, died Tuesday, October 22, 2013.\n\nServices were held at Old St. Paul Missionary Baptist Church in West Memphis, Ark., with burial in Marion Memorial Cemetery; Anthony Funeral Home South, West Memphis, had charge. He was survived by his wife, Cliffery L. Suggs of Memphis; a daughter, Jasmine T. Suggs, and a son, Jaiden L. Suggs, both of Memphis; his mother, Dorothy L. Suggs of West Memphis; a brother, Travares D. Suggs of West Memphis; his father- and mother-in-law, Ralph and Victoria Penn of Hazen, Ark.; and his sisters- and brothers-in-law.",clip:["clippings/torrance-suggs-ca-2013-10-26.jpg"]},

{n:"James Louis \"J.L.\" Taylor",r:"Lieutenant",u:7,y:1996,lod:false,notes:"Retired Lieutenant, Deputy Jailer",e:"",ob:"",fb:"",dod:"09/17/1996",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Wednesday, September 18, 1996, page 16.\n\nJames Louis Taylor, 55, of Memphis, a retired lieutenant with the Shelby County Sheriff’s Department, died of cancer Tuesday, September 17, 1996, at Methodist Hospital. N.J. Ford & Sons Funeral Home had charge.\n\nHe was survived by his wife, Catherine Taylor; two daughters, Valerie Brady and Renee Taylor; two sons, Orlando Taylor and Marvelas Williams, all of Memphis; three sisters, Helen Jean Hunter of Memphis, Christine Shane of Dallas and Linda Stegstacke of Philadelphia; his great-grandparents, Stein Harris and Rev. C.H. Harris, both of Memphis; and nine grandchildren.",clip:["clippings/james-taylor-ca-1996-09-18.jpg"]},
{n:"Charlie Frank James",r:"Lieutenant",u:7,y:2003,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Account analyst lieutenant; Navy retiree",e:"",ob:"",fb:"",dod:"02/27/2003",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Sunday, March 2, 2003, page 26. (The copy we have shows the first part of the notice.)\n\nCharlie Frank James, 51, of Memphis, retired from the Navy and was an account analyst lieutenant for the Shelby County Sheriff’s Department. He died Thursday, February 27, 2003, at the Memphis Veterans Medical Center. Services were held at Bartlett Funeral Home Stage Road Chapel, with burial in West Tennessee Veterans Cemetery. He was survived by a daughter, Sarah Rebecca James of Drummonds; a son, Jesse Keith James of Memphis; two sisters, Mary Elise Osborn of Judsonia, Ark., and Evelyn Marie Stafford of Memphis; and two brothers.",clip:["clippings/charlie-james-ca-2003-03-02.jpg"]},
{n:"Bobby Larry \"Bob\" Marbry",r:"Lieutenant",u:7,y:null,lod:false,notes:"Retired Lieutenant; husband of Reserve member Barbara Ann Cloud Marbry. Date of death not yet found.",e:"",ob:"",fb:"",dod:"",obt:"No obituary for Lt. Marbry has been found yet. He is named in the obituary of his wife, Barbara Ann Cloud Marbry, in The Commercial Appeal, Memphis, Monday, July 20, 2009, page 11, which describes him as her spouse of 35 years and a retired Shelby County Sheriff’s officer. Barbara, who volunteered with the Sheriff’s Department auxiliary, died in July 2009. Their family included Lurae Holmes, Robin David, Patrick Brooks, David Brooks, Lauretta Merideth and Larry Brooks, along with 12 grandchildren and four great-grandchildren.\n\nIf you know when Lt. Marbry passed, or have his obituary or a photo, please use “Send a Photo or Article.”",clip:["clippings/barbara-marbry-ca-2009-07-20.jpg"]},

{n:"Norma Jean Whitebird",r:"Patrolman",u:9,y:1999,lod:false,notes:"",e:"",ob:"",fb:"",dod:"05/15/1999",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Monday, May 17, 1999, page 13.\n\nNorma Jean Whitebird, 67, of Memphis, retired from the Shelby County Sheriff’s Department, died of heart failure Saturday, May 15, 1999, at Methodist Hospital North. She was a member of Our Lady of Sorrows. Graveside services were held in Memphis Memory Gardens, with Memphis Funeral Home Germantown Parkway Chapel in charge.",clip:["clippings/norma-whitebird-ca-1999-05-17.jpg"]},

{n:"Enrique Escobedo Pina",r:"Patrolman",u:9,y:2000,lod:false,notes:"Detective; former Memphis LULAC chapter president. (Listed on the roster as “Enrica Pena.”)",e:"",ob:"",fb:"",dod:"07/17/2000",obt:"Summary of the “25 years ago — 2000” item in The Commercial Appeal, Memphis, July 19, 2025, page 2A, recalling the paper’s report from July 2000.\n\nEnrique Escobedo Pina, 64, a retired Shelby County Sheriff’s Department detective and former Memphis chapter president of the League of United Latin American Citizens, died Monday, July 17, 2000, of heart failure at Methodist Healthcare-North. Friends and family said he would give the shirt off his back to help fellow Hispanic residents in the Memphis community.",clip:["clippings/enrique-pina-ca-2025-07-19.jpg"]},
{n:"John G. Woodson",r:"Patrolman",u:9,y:2003,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. 22 years of service; Air Force retiree",e:"",ob:"",fb:"",dod:"05/13/2003",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Wednesday, May 14, 2003, page 13.\n\nJohn G. Woodson, 71, of Memphis, formerly of Bruceton, Tenn., retired from the Shelby County Sheriff’s Department after 22 years and also retired from the Air Force. He died Tuesday, May 13, 2003, at Methodist Healthcare-North. He was a member of Baptist Muldoon Church.\n\nServices were held at Dilday Funeral Home in Huntingdon, Tenn., with burial in Bethlehem Cemetery. He was survived by Helen Turner Woodson, his wife of 49 years; two sons, John Michael Woodson of Gerald, Mo., and Mark Edward Woodson of Memphis; two sisters, Nella Woodson Powell of Eddyville, Ky., and Frances Woodson Holley of Lexington, Ky.; a granddaughter; and a stepgranddaughter.",clip:["clippings/john-woodson-ca-2003-05-14.jpg"]},
{n:"Arthur J. Miller",r:"Patrolman",u:9,y:2000,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy",e:"",ob:"",fb:"",dod:"01/25/2000",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Thursday, January 27, 2000, page 18.\n\nArthur J. Miller, 69, of Eads, a retired deputy with the Shelby County Sheriff’s Department, died of heart failure Tuesday, January 25, 2000, at Methodist Hospital of Fayette in Somerville. He sang in the choir at St. James Catholic Church for 35 years.\n\nServices were held at Forest Hill Funeral Home East, with burial in Forest Hill Cemetery East. He was survived by his wife, Wilma Miller; two daughters, Janice Bragg of Atlanta and Dianne Jenkins of Lexington, Ky.; two sons, David Miller of Little Rock and Arthur Miller Jr. of Oakland, Tenn.; two sisters; three brothers; 11 grandchildren; and three great-grandchildren.",clip:["clippings/arthur-miller-ca-2000-01-27.jpg"]},
{n:"Cecil R. Tompkins",r:"Patrolman",u:9,y:1992,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired sheriff's officer",e:"",ob:"",fb:"",dod:"08/05/1992",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Friday, August 7, 1992, page 19.\n\nCecil R. Tompkins, 70, of Arlington, a retired Shelby County sheriff’s officer, died Wednesday, August 5, 1992, at his home. He was a Methodist and a member of Rosemark Masonic Lodge and Al Chymia Shrine.\n\nServices were held in Oneida, Tenn., with Memorial Park Funeral Home in charge. He was survived by his wife, Jo A. Tompkins; two daughters, Sandra Lynn Harris of Clarksville, Tenn., and Sherry Ann Cook of Coleman, Texas; a son, Cecil R. Tompkins Jr. of Memphis; five grandchildren; and three great-grandchildren.",clip:["clippings/cecil-tompkins-ca-1992-08-07.jpg"]},
{n:"Edward V. Gerstel",r:"Patrolman",u:9,y:1993,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy sheriff",e:"",ob:"",fb:"",dod:"11/02/1993",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Thursday, November 4, 1993, page 19.\n\nEdward V. Gerstel, 83, of Memphis, a retired Shelby County deputy sheriff, died Tuesday, November 2, 1993, at Baptist Memorial Hospital East. Graveside services were held at Temple Israel Cemetery, with Memphis Funeral Home Poplar Chapel in charge. He was survived by a nephew who cared for him, Harry Skipper Gerstel of Memphis.",clip:["clippings/edward-gerstel-ca-1993-11-04.jpg"]},
{n:"Jerome J. Henry",r:"Patrolman",u:9,y:1993,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy sheriff, 22 years of service; Odd Fellows grandmaster of Tennessee",e:"",ob:"",fb:"",dod:"02/14/1993",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Tuesday, February 16, 1993, page 13.\n\nJerome J. Henry, 61, of Memphis, a retired deputy sheriff who served 22 years with the Shelby County Sheriff’s Department, died Sunday, February 14, 1993, at Baptist Memorial Hospital. He was a member of the Odd Fellows for more than 18 years and served as the Odd Fellows grandmaster of Tennessee.\n\nServices were held at Calvary Episcopal Church, where he was a communicant, with burial in Elmwood Cemetery; Canale Funeral Directors had charge. He was survived by his wife, Betty B. Henry; three daughters, Mary H. Fontaine of Herndon, Va., Vicki Dunn of Memphis and Susan Jenkins of Conyers, Ga.; and two grandchildren. The family asked that memorials be sent to Calvary Episcopal Church or the charity of the donor’s choice.",clip:["clippings/jerome-henry-ca-1993-02-16.jpg"]},
{n:"R. Powell Millwood",r:"Patrolman",u:9,y:1979,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy; Mason and Shriner",e:"",ob:"",fb:"",dod:"12/29/1979",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Sunday, December 30, 1979, page 22.\n\nR. Powell Millwood, 71, of Memphis, a retired deputy with the Shelby County Sheriff’s Department, died Saturday, December 29, 1979, at Hendersonville (Tenn.) Community Hospital. He was a Mason, a Shriner, a member of the Scottish Rite and a member of Raleigh Christian Church.\n\nServices were held at Memphis Funeral Home Poplar Chapel, with burial in Memorial Park. He was survived by his wife, Elizabeth G. Millwood; a daughter, Nell Lamberth of Hendersonville; and five grandchildren.",clip:["clippings/powell-millwood-ca-1979-12-30.jpg"]},
{n:"Sherri D. Evers",r:"Patrolman",u:9,y:1997,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Lt as deputy jailer; 14 years of service",e:"",ob:"",fb:"",dod:"12/09/1997",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Thursday, December 11, 1997, page 14.\n\nSherri D. Evers, 40, of Memphis, a deputy jailer for 14 years with the Shelby County Sheriff’s Department with the rank of lieutenant, died of heart failure Tuesday, December 9, 1997, at Baptist Memorial Hospital. She was a 1975 graduate of Central High School and a graduate of Crichton College and Shelby State.\n\nServices were held at Greater Pleasant Hill Baptist Church, where she was a member, with burial in Forest Hill Cemetery Midtown; N. H. Owens & Son Funeral Home had charge. She was survived by two sons, Erik Evers and Jason Evers; her parents, O. Z. and Dorothy Evers, all of Memphis; three sisters, Portia A. Evers Tyler of Orlando, Fla., and Gwendolyn D. Evers and Kimberly M. Evers, both of Memphis; and two brothers, Ovell Evers and Kenneth J. Evers, both of Memphis.",clip:["clippings/sherri-evers-ca-1997-12-11.jpg"]},
{n:"William T. McGuire",r:"Patrolman",u:9,y:1985,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy; also retired from MLGW; World War II veteran",e:"",ob:"",fb:"",dod:"06/19/1985",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Thursday, June 20, 1985, page 20.\n\nWilliam T. McGuire, 62, of Collierville, a retired deputy with the Shelby County Sheriff’s Department and a retired employee of Memphis Light, Gas & Water Division, died Wednesday, June 19, 1985, at Memphis Veterans Medical Center. A World War II veteran, he was a member of Hickory Hills Baptist Church, Collierville Masonic Lodge No. 152 and the Scottish Rite.\n\nCollierville Funeral Home had charge. He was survived by his wife, Virginia McGuire; a daughter, Shelia Voss of New Orleans; two sons, Dr. William McGuire of Knoxville and Thomas J. McGuire of Memphis; his mother, Ruth Moskop of Memphis; and three grandchildren.",clip:["clippings/william-mcguire-ca-1985-06-20.jpg"]},
{n:"Robert D. Butler",r:"Patrolman",u:9,y:1979,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper news item; please confirm. Retired deputy sheriff. Apparent suicide after a period of poor health.",e:"",ob:"",fb:"",dod:"02/16/1979",obt:"Summary of a news item in The Commercial Appeal, Memphis, Saturday, February 17, 1979, page 14.\n\nRobert D. Butler, 72, of Memphis, a retired deputy sheriff, died at his home on Friday, February 16, 1979. According to the report, his death was an apparent suicide; he had been in declining health and had recently been released from the hospital. The Shelby County medical examiner was asked to rule on the death. He was a member of Lamar Heights Baptist Church.\n\nMemphis Funeral Home had charge. He was survived by his wife, Lota Patton Butler; three daughters, Frances Vaughn of Houston, Texas, Betty Flanagan of Tulsa, Okla., and Sue Baker of Memphis; a sister, Sue Rice of Millington; a brother, Gerald Butler of Memphis; nine grandchildren and eight great-grandchildren."},
{n:"William Lake Hays Jr.",r:"Lieutenant",u:7,y:1978,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Serving lieutenant; World War II veteran; Mason and Shriner",e:"",ob:"",fb:"",dod:"04/10/1978",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Tuesday, April 11, 1978, page 24.\n\nWilliam Lake Hays Jr., 49, of Memphis, a lieutenant with the Shelby County Sheriff’s Department, died Monday, April 10, 1978, at Methodist Hospital. He was a veteran of World War II, a Mason, a Shriner and a member of the Scottish Rite.\n\nServices were held at Memphis Funeral Home on Union, with burial in Forest Hill Cemetery Midtown. He was survived by his wife, Busy Hays, and two daughters, Pam Hays and Lisa Hays.",clip:["clippings/william-hays-ca-1978-04-11.jpg"]},
{n:"Argentry DeWitt Lewis",r:"Lieutenant",u:7,y:1999,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired lieutenant; Army veteran",e:"",ob:"",fb:"",dod:"03/08/1999",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Wednesday, March 10, 1999, page 20.\n\nArgentry DeWitt Lewis, 63, of Memphis, a retired lieutenant with the Shelby County Sheriff’s Office, died of a heart attack Monday, March 8, 1999, in Memphis. He was an Army veteran.\n\nServices were held at Melrose Baptist Church, with burial at West Tennessee Veterans Cemetery; N.J. Ford & Sons Funeral Home had charge. He was survived by his wife, Katherine Lewis; five daughters, Connie Booker, Bernita Gibbs and Denise Gibbs, all of Memphis, Mary Louise Logan of Las Vegas and Ivy Jones of Detroit; six sons, Erie, Kelvin, Dominic, Ricky, Derek and Gregory Lewis, all of Memphis; four sisters, Florida White of Boston, and Jean Lewis, Marjorie Lewis Lenton and Mary Jo Denny, all of Memphis; four brothers, William, Jessie and Avery Lewis, all of Memphis, and Joe Lewis of Queens, N.Y.; 24 grandchildren and three great-grandchildren.",clip:["clippings/argentry-lewis-ca-1999-03-10.jpg"]},
{n:"William Earl \"Bill\" Rutland",r:"Patrolman",u:9,y:2003,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Former deputy; former Tennessee Highway Patrol officer and bodyguard to President Harry S. Truman; owner of Bill Rutland Chevrolet; World War II veteran",e:"",ob:"",fb:"",dod:"12/22/2003",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Wednesday, December 24, 2003, page 11.\n\nWilliam Earl Rutland, 79, of Senatobia, Miss., died Monday, December 22, 2003, at North Oak Regional Hospital. A former Shelby County sheriff’s deputy, he was also a former Tennessee Highway Patrol officer, a former bodyguard of President Harry S. Truman, and the retired owner and operator of Bill Rutland Chevrolet. He was a World War II veteran, a member of First Baptist Church of Horn Lake and Al Chymia Shrine, and a 32nd degree Mason.\n\nServices were held at Forest Hill Funeral Home South, with entombment in Forest Hill Mausoleum South. He was survived by his wife, Kathryn Ella Rutland; two sons, William Earl Rutland Jr. of Memphis and Jack Lester Rutland of New York City; two friends who cared for him, Teresa and Eddie Oglesby of Senatobia; a grandchild and two great-grandchildren. The family asked that memorials be sent to First Baptist Church of Horn Lake.",clip:["clippings/william-rutland-ca-2003-12-24.jpg"]},
{n:"James Gus \"Big Jim\" Galloway",r:"Patrolman",u:9,y:1950,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper article; please confirm. Serving court deputy, Criminal Court Division Two; about 25 years of service; known as the \"sheriff of Cordova\"",e:"",ob:"",fb:"",dod:"06/18/1950",obt:"Summary of the news article “James G. Galloway, Shelby Deputy, Dies — Had Worked 25 Years For The Sheriff’s Office” in The Commercial Appeal, Memphis, Monday, June 19, 1950, page 22.\n\nJames Gus “Big Jim” Galloway, 71, a longtime Shelby County sheriff’s deputy, died early Sunday morning, June 18, 1950, at his home on Macon Road after about three years of failing health. A court deputy assigned to Criminal Court Division Two at the time of his death, he had been with the Sheriff’s Office about 25 years and was scheduled to retire that summer.\n\nBorn at Cordova, he was a lifelong resident of the community, and his neighbors often called him the “sheriff of Cordova.” Before entering public service he had been a farmer, a lumberman and a private contractor, working on Shelby County roads and Arkansas levees. He was a Methodist.\n\nServices were held at National Funeral Home, with the Rev. W. L. Wheeler officiating and burial in Presbyterian Cemetery at Cordova; uniformed members of the sheriff’s staff served as active pallbearers. He was survived by his wife, Margaret Galloway; a son, James W. Galloway of Fort Lauderdale, Fla.; and two grandchildren.",clip:["clippings/james-galloway-ca-1950-06-19.jpg"]},
{n:"Thomas Lee Pate Sr.",r:"Patrolman",u:9,y:2008,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Former deputy; also a former Fayette County deputy sheriff",e:"",ob:"",fb:"",dod:"12/14/2008",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Monday, December 15, 2008, page 14.\n\nThomas Lee “Tom” Pate Sr., 65, died Sunday, December 14, 2008. He was a former Shelby County Sheriff’s deputy and a former deputy sheriff for Fayette County, retired from Burlington Northern Railroad, and was a member of New Hope Baptist Church.\n\nServices were held at Forest Hill Funeral Home Midtown. He was survived by a daughter, Pam Pate-McFarlin (Ricky); a son, Thomas L. Pate Jr. (Lynette); a brother, Ernest Pate; and seven grandchildren. He was preceded in death by a brother, Johnny Pate.",clip:["clippings/thomas-pate-ca-2008-12-15.jpg"]},
{n:"Lawrence Edward Geeslin",r:"Patrolman",u:9,y:1990,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy sheriff; Air Force veteran",e:"",ob:"",fb:"",dod:"12/06/1990",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Saturday, December 8, 1990, page 16.\n\nLawrence Edward Geeslin, 58, of Memphis, a retired Shelby County deputy sheriff, died Thursday, December 6, 1990, at Methodist Hospital. He was an Air Force veteran and a member of Al Chymia Shrine and Oakville Masonic Lodge.\n\nGraveside services were held at Forest Hill Cemetery Midtown, with Memphis Funeral Home Poplar Chapel in charge. He was survived by his wife, Jo Ann Geeslin; two daughters, Debbie Gentry and Peggy Weatherby, both of Smyrna, Tenn.; three stepdaughters, Debbie Giles, Donna Eddins and Sandra Mathy; a son, Lawrence Edward Geeslin II, all of Memphis; his mother, Cecilia Geeslin of Sardis, Miss.; and seven grandchildren.",clip:["clippings/lawrence-geeslin-ca-1990-12-08.jpg"]},
{n:"Robert Curtis Cox",r:"Patrolman",u:9,y:1990,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Former deputy sheriff",e:"",ob:"",fb:"",dod:"11/05/1990",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Wednesday, November 7, 1990, page 25.\n\nRobert Curtis Cox, 80, of Collierville, a former Shelby County deputy sheriff, died Monday night, November 5, 1990, at Baptist Memorial Hospital East. He operated a quail and game preserve, retired from the county Health Department, and was a member of Collierville United Methodist Church.\n\nServices were held at Collierville Funeral Home, with burial in Magnolia Cemetery in Collierville. He was survived by his wife, Carolyn Cox; three daughters, Donna Groff, Melissa Knop and Laura Bryant; a sister, Mary Lee Cox, all of Collierville; and six grandchildren. The family asked that memorials be sent to Collierville United Methodist Church.",clip:["clippings/robert-cox-ca.jpg"]},
{n:"Felix Ernest Miller",r:"Patrolman",u:9,y:2002,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy sheriff",e:"",ob:"",fb:"",dod:"04/13/2002",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Monday, April 15, 2002, page 14.\n\nFelix Ernest Miller, 90, of Memphis, a retired deputy sheriff with the Shelby County Sheriff’s Department, died Saturday, April 13, 2002, at his home. He was a member of Highland Street Christian Church, the Tennessee and Mississippi Sheriffs and Peace Officers Association, and the Fraternal Order of Police.\n\nGraveside services were held in Forest Hill Cemetery Midtown. He was preceded in death by his wife, Anne Preddy Miller, and was survived by two daughters, Rosemary Lubiani of Cordova and Margaret Misko of Memphis; a son, F. Gill Miller of Bartlett; five grandchildren; and four great-grandchildren.",clip:["clippings/felix-miller-ca-2002-04-15.jpg"]},
{n:"Floyd T. Ralls",r:"Patrolman",u:9,y:1994,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy sheriff",e:"",ob:"",fb:"",dod:"11/09/1994",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Thursday, November 10, 1994, page 16.\n\nFloyd T. Ralls, 84, of Memphis, a retired deputy sheriff with the Shelby County Sheriff’s Department, died of heart failure Wednesday, November 9, 1994, at AMI St. Francis Hospital. He was a member of Balmoral Baptist Church, the Odd Fellows, Al Chymia Shrine Temple and Scottish Rite, and was a Mason.\n\nServices were held at Balmoral Baptist Church, with burial in Memorial Park; Memphis Funeral Home Poplar Chapel had charge. He was survived by his wife, Geraldine Ralls; a son, David Harvard Ralls; and two brothers, James Ralls and Tom Ralls, all of Memphis.",clip:["clippings/floyd-ralls-ca-1994-11-10.jpg"]},
{n:"Cleveland H. \"Bill\" Neal",r:"Patrolman",u:9,y:2003,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy; World War II veteran",e:"",ob:"",fb:"",dod:"05/13/2003",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Wednesday, May 14, 2003, page 13.\n\nCleveland H. “Bill” Neal, 90, of Memphis, formerly of Newbern, Tenn., a retired deputy with the Shelby County Sheriff’s Department, died Tuesday, May 13, 2003, at Baptist Memorial Hospital-DeSoto in Southaven. He was a World War II veteran, a member of Trinity United Methodist Church, the Tennessee/Mississippi Sheriffs & Peace Officers Association and the Tennessee Law Enforcement Association, and a master mason of Oakville Lodge.\n\nMemphis Funeral Home Poplar Chapel had charge. He was preceded in death by his wife, Jean C. Neal, and was survived by a son, Billy C. Neal of Trenton, Tenn.; two grandchildren; two great-grandchildren; and two great-great-grandchildren.",clip:["clippings/cleveland-neal-ca-2003-05-14.jpg"]},
{n:"Charles Austin \"Sonny\" Jones Jr.",r:"Patrolman",u:9,y:2011,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy",e:"",ob:"",fb:"",dod:"09/01/2011",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Sunday, September 4, 2011, page B6.\n\nCharles Austin “Sonny” Jones Jr., 66, of Lakeland, Tenn., died Thursday, September 1, 2011, at his home. He retired from the Shelby County Sheriff’s Department and was a member of West Frayser Baptist Church. He was an avid horse lover and a loving husband, father and grandfather who cherished his family.\n\nA memorial service was held at Memphis Funeral Home and Memorial Gardens. He was preceded in death by his father, Charlie Jones, and was survived by Betty Ann Jones, his wife of 46 years; daughters Brook Ann (Mark) Laine of Olive Branch, Miss., and Stephanie Lynn (Jay) Westmoreland of Arlington, Tenn.; his sister, Charlotte Miller of Cordova; his mother, Evelyn Jones of Frayser; grandchildren Charley Warf, Eryn Laine and Austin Westmoreland; and a great-granddaughter, Maysen Laine.",clip:["clippings/charles-jones-ca-2011-09-04.jpg"]},
{n:"Harold Wortham",r:"Patrolman",u:9,y:1997,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy sheriff; World War II Marine veteran",e:"",ob:"",fb:"",dod:"09/15/1997",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Tuesday, September 16, 1997, page 14.\n\nHarold Wortham, 71, of Memphis, a retired Shelby County deputy sheriff, died Monday, September 15, 1997, at his home. He was a World War II Marine veteran.\n\nServices were held at Memphis Funeral Home Stage Road Chapel, with burial in Woodhaven Cemetery. He was survived by his wife, Erma Wortham; two daughters, Beverly Matthews of Bartlett and Pam Wortham of Millington; two sons, Larry Wortham of Memphis and Mark Wortham of Dallas; three sisters; two brothers; and eight grandchildren. The family asked that memorials be sent to Schoolfield United Methodist Church.",clip:["clippings/harold-wortham-ca-1997-09-16.jpg"]},
{n:"William J. Parish",r:"Patrolman",u:9,y:1995,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Former deputy",e:"",ob:"",fb:"",dod:"11/15/1995",obt:"From The Commercial Appeal, Memphis, Thursday, November 16, 1995, page 12.\n\nWilliam J. Parish, 76, a former deputy with the Shelby County Sheriff’s Department, died Wednesday, November 15, 1995, at his home in Memphis."},
{n:"William A. Guidry",r:"Patrolman",u:9,y:2000,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy; Army veteran",e:"",ob:"",fb:"",dod:"01/01/2000",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Wednesday, January 12, 2000, page 18.\n\nWilliam A. Guidry, 76, of Ocean Springs, Miss., formerly of Memphis, a retired deputy for the Shelby County Sheriff’s Department, died of heart failure January 1, 2000, in Ocean Springs. He was an Army veteran, a Mason, and a member of Lindenwood Christian Church and Al Chymia Shrine Temple. Bradford-O’Keefe Funeral Home in Biloxi, Miss., had charge. He was the husband of Marjorie Lee Guidry. The family asked that memorials be sent to St. Jude Children’s Research Hospital.",clip:["clippings/william-guidry-ca-2000-01-12.jpg"]},
{n:"Margaret A. Ivy",r:"Patrolman",u:9,y:1990,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired matron (Jail East); matron positions were later converted to patrol officer",e:"",ob:"",fb:"",dod:"03/24/1990",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Monday, March 26, 1990, page 27.\n\nMrs. Margaret A. Ivy, 55, of Memphis, died Saturday, March 24, 1990, at Methodist Hospital after a short illness. She was a retired matron of the Shelby County Sheriff’s Department and a communicant of Our Lady of Sorrows Catholic Church.\n\nServices were held at Memphis Funeral Home Poplar Chapel, with burial in Memorial Park. She was preceded in death by her husband, Joe W. Ivy, and was survived by two daughters, Barbara S. James of Memphis and Bobbie Ann Swims; her stepfather, J.H. Browning of Memphis; and four grandchildren. The family asked that memorials be sent to the American Diabetes Association or the American Heart Association.",clip:["clippings/margaret-ivy-ca-1990-03-26.jpg"]},
{n:"Vernon E. \"Chick\" O'Guin",r:"Patrolman",u:9,y:2010,lod:false,notes:"NOT YET VERIFIED by the Retirees group — obituary says \"retired Deputy Sheriff with the Shelby County Health Department,\" so please confirm SCSO service. WWII Navy veteran; three-time Mid-South Golden Gloves champion",e:"",ob:"",fb:"",dod:"02/02/2010",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Monday, February 8, 2010, page B3.\n\nVernon E. “Chick” O’Guin, 92, died February 2, 2010, at Quince Nursing and Rehabilitation. The obituary describes him as a retired deputy sheriff with the Shelby County Health Department. He was a World War II Navy veteran, a three-time Mid-South Golden Gloves champion, Pacific Fleet champion in World War II, and a member of the Memphis Park Commission Sports Hall of Fame.\n\nServices were held at Memphis Funeral Home Germantown Parkway Chapel, with burial in Memory Hill Gardens. He was preceded in death by his wife, Ruth O’Guin, and a son, Pat O’Guin, and was survived by three sons, Tim O’Guin (Susan) of Hickory Withe, Tenn., Kevin O’Guin of Lakeland and Mike O’Guin of Bristol, R.I.; grandchildren Brandon O’Guin and Jennifer O’Guin; and great-grandchildren Cris and Amber Wright. The family asked that memorials be made to the Shriners Burn Center or the Salvation Army.",clip:["clippings/vernon-oguin-ca-2010-02-08.jpg"]},
{n:"Hulcy Lynn Delorme Jr.",r:"Patrolman",u:9,y:2010,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Former deputy; also Germantown police officer and Broward County (Fla.) sheriff's deputy; later a pilot for Pinnacle Airlines",e:"",ob:"",fb:"",dod:"06/03/2010",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Friday, June 4, 2010, page B4.\n\nHulcy Lynn Delorme Jr., of Olive Branch, Miss., died Thursday, June 3, 2010, at Baptist Memorial Hospital-Memphis. He was a pilot for Pinnacle Airlines, and was a former Shelby County Sheriff’s deputy, Germantown police officer and Broward County sheriff’s deputy.\n\nServices were held at the Church of the Incarnation in Collierville, with burial in Forest Hill South Cemetery. He was survived by his wife, Krista Leigh; four children, Kristopher Lynn and Gracie Elizabeth Delorme, Jordan Marie Zim and Connor Michael Delorme; his parents, Hulcy Lynn Sr. and Nellie Weeden Delorme; a sister, Gabrielle Joy Griffith; and his grandmother, Polly Poindexter. The family asked that donations be made to Christian Brothers High School or the Night Stalker Association.",clip:["clippings/hulcy-delorme-ca-2010-06-04.jpg"]},
{n:"Charles Thomas Riley",r:"Patrolman",u:9,y:2004,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy sheriff; 32nd degree Mason",e:"",ob:"",fb:"",dod:"07/12/2004",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Thursday, July 15, 2004, page 17.\n\nCharles Thomas Riley, 72, of Memphis, a retired deputy sheriff for Shelby County, died Monday, July 12, 2004, at High Pointe Health and Rehabilitation Center. He was a 32nd degree Mason.\n\nServices were held at Pearly Gate Baptist Church, with burial in West Tennessee Veterans Cemetery; S.W. Qualls Funeral Home had charge. He was survived by three daughters, LaVetta Johnson of Palatine, Ill., Michelle Armstrong of Memphis and Glenda K. Walker of Indiana; a son, Charles Thomas Riley Jr. of Saginaw, Mich.; his stepmother, Bessie Riley of Toledo, Ohio; four sisters; three grandchildren; and a great-grandchild.",clip:["clippings/charles-riley-ca-2004-07-15.jpg"]},
{n:"M. C. Ivy",r:"Patrolman",u:9,y:1982,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy sheriff",e:"",ob:"",fb:"",dod:"01/21/1982",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Friday, January 22, 1982, page 12.\n\nM. C. Ivy, 73, of Memphis, a retired Shelby County deputy sheriff, died January 21, 1982, at his home. Services were held at Memorial Park Funeral Home, with burial in Memorial Park. He was survived by his wife, Louise Faltzs Ivy; three daughters, Betty Evans Bargiacchi and Patti Ivy Baggett, both of Memphis, and Connie Ivy Gray of Columbia, S.C.; nine grandchildren; and a great-grandchild.",clip:["clippings/mc-ivy-ca-1982-01-22.jpg"]},
{n:"Kenneth Robert Ragghianti",r:"Patrolman",u:9,y:2006,lod:false,notes:"NOT YET VERIFIED by the Retirees group — found in a newspaper notice; please confirm. Retired deputy; Vietnam veteran, SP4, U.S. Army; brother of Sgt. Ronald \"Ronnie\" Ragghianti",e:"",ob:"https://www.findagrave.com/memorial/18923959/kenneth_robert-ragghianti",fb:"",dod:"01/19/2006",obt:"From the death notice in The Commercial Appeal, Memphis, January 22, 2006, as recorded on Find a Grave.\n\nKenneth Robert Ragghianti, 59, of Southaven, Miss., died January 19, 2006, at his residence. He was born October 11, 1946. He was a retired deputy for the Shelby County Sheriff’s Department and an Army veteran of the Vietnam War, serving as a specialist 4th class.\n\nGraveside services were held at West Tennessee Veterans Cemetery, with Twin Oaks Funeral Home in charge. He was survived by his wife of nine years, Sherry; sons Billy and Kevin Ragghianti; a stepdaughter, Mary Shepard; two sisters, Joyce Armstrong and Debra Lamar; a brother, Ronald Ragghianti (also a Shelby County deputy, who died in 2008); and three grandchildren. The family asked that memorials be sent to St. Jude Children’s Research Hospital."},
{n:"Ramona Carrol Davis",r:"Chief Inspector",u:4.5,y:2026,lod:false,notes:"Department's first female patrolwoman and later its first female detective; 25-year career; FBI National Academy graduate",e:"",ob:"",fb:"",dod:"11/13/2026",obt:"Ramona Carrol Davis, 81, of Springville, Tennessee, died Friday, November 13, 2026. She was born in Memphis on August 2, 1945, to the late Robert Welch and the late Mildred Wright Briggs. She served the Shelby County Sheriff's Department for 25 years, breaking barriers as the department's first female patrolwoman and later its first female detective. She attended Dignitary Protection training, where she met former President Ronald Reagan, and the FBI National Academy in Quantico, Virginia. After retiring she made her home in Springville, where she was an active and devoted member of Antioch United Methodist Church. She is survived by her son, Darrin E. Murphy, and by Debbie Thompson, whom she loved as her own daughter. Ridgeway Funeral Home in Paris, Tennessee, is handling arrangements; she is to be cremated, with a memorial service at a later date.",ph:"photos/ramona-davis.jpg"},
