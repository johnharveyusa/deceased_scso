{n:"Robert S. \"Steve\" Tuttle Jr.",r:"Reserve",u:10,y:1990,lod:false,notes:"SCSO Reserves and MPD Reserves; Vietnam veteran",e:"",ob:"",fb:"",dod:"02/14/1990",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Thursday, February 15, 1990.\n\nRobert S. “Steve” Tuttle Jr., 44, of Memphis, a regional sales manager for Kubota Tractor Corp., died Wednesday, February 14, 1990, at Germantown Community Hospital after a short illness. He served in the Shelby County Sheriff’s Department Reserves and the Memphis Police Department Reserves, was a Vietnam veteran, and was a member of Kirby Woods Baptist Church.\n\nServices were held at Memorial Park Funeral Home, with burial in Memorial Park Cemetery. He was survived by his wife, Dianne Tuttle; a son, Steven Tuttle of Germantown; his mother, Dorothy Tuttle; and a sister, Julie Sturman, both of Kansas City, Mo.",clip:["clippings/steve-tuttle-ca-1990-02-15.jpg"]},
{n:"Bob Hawks",r:"Reserve",u:10,y:2004,lod:false,notes:"Reserve, retired as \"Lieutenant\" in the Reserve Division; former Tennessee State Representative; WWII Navy veteran",e:"",ob:"",fb:"",dod:"01/31/2004",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Tuesday, February 3, 2004, page 11.\n\nBob Hawks, 77, died Saturday, January 31, 2004, at St. Francis Hospital in Memphis. He was born in Memphis on August 1, 1926, to A.G. and Myrtie Hawks. He served in the Shelby County Sheriff’s Reserve Division, retiring with the reserve title of “Lieutenant,” a retired real estate agent, and served six years as a Tennessee State Representative. He was a U.S. Navy veteran of World War II, a Mason, a member of the Al Chymia Shrine clown unit and the Gold Wings Club, and a member of Leaclair Baptist Church.\n\nServices were held at Forest Hill Funeral Home-East, with burial at Memphis Memory Gardens. He was survived by two daughters, Doris Burress of Memphis and Janet Bartlett of Millington; a son, Bobby Hawks of Germantown; a sister, Nan Boren of Memphis; and seven grandchildren.",ph:"photos/bob-hawks.jpg",clip:["clippings/bob-hawks-ca-2004-02-03.jpg"]},
{n:"Francis \"Frank\" G. Prescott",r:"Reserve",u:10,y:2004,lod:false,notes:"Reserve deputy; Korean War Army veteran, Bronze Star",e:"",ob:"",fb:"",dod:"01/17/2004",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Sunday, January 18, 2004, page 21.\n\nFrancis “Frank” G. Prescott, 73, of Memphis, a reserve deputy for the Shelby County Sheriff’s Office, died Saturday, January 17, 2004, at Baptist Memorial Hospital-Memphis. He was a Korean War Army veteran and Bronze Star recipient, and retired from Nationwide Insurance Co.\n\nServices were held at Memphis Funeral Home Poplar Chapel, with burial in Woodlawn Cemetery in Nashville. He was preceded in death by his wife, Carlene Prescott, and was survived by a son, Craig Prescott of Boise, Idaho; a brother, Arthur Prescott of Fern Park, Fla.; and six grandchildren.",clip:["clippings/frank-prescott-ca-2004-01-18.jpg"]},
{n:"Ralph Arthur Reese",r:"Reserve",u:10,y:2013,lod:false,notes:"Reserve deputy; retired Captain, Memphis Airport Authority Police; FBI National Academy, 198th session; 47-year law enforcement career; Army veteran",e:"",ob:"",fb:"",dod:"06/15/2013",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Monday, June 17, 2013, page 3B.\n\nRalph Arthur Reese, 66, of Olive Branch, died June 15, 2013. Born and raised in Topeka, Kansas, he began a 47-year law enforcement career with the Shawnee County Sheriff’s Department in Topeka. After moving to the Memphis area he served as a reserve deputy with the Shelby County Sheriff’s Department, and he retired as a captain with the Memphis Airport Authority Police Department after 26 years. He was a graduate of the FBI Academy’s 198th session. He then served as a police officer at Northwest Mississippi Community College until his death. He was a proud U.S. Army veteran and an active member of Temple Baptist Church.\n\nFuneral services were held at Temple Baptist Church in Olive Branch, with burial at Memorial Gardens Cemetery in Bartlett. He was survived by Gwen Reese, his wife of 43 years; two sons, Jason T. Reese of Olive Branch and Chris H. Reese (Channing) of Brighton, Colo.; two grandchildren, Sara McCall-Reese and Jacob Reese; and three siblings, Robert, Vivian and JoAnne.",clip:["clippings/ralph-reese-ca-2013-06-17.jpg"]},
{n:"Louis A. Cooper",r:"Reserve",u:10,y:2009,lod:false,notes:"Founding member of the Reserve Division; deputy 1964–1984; MPD Reserves 1984–2009",e:"",ob:"",fb:"",dod:"10/30/2009",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Saturday, October 31, 2009, page 14.\n\nLouis A. Cooper, 78, of Memphis, died Friday, October 30, 2009, at the Regional VA Hospital. He served as a Shelby County Sheriff’s deputy from 1964 to 1984 and was a founding member of the Sheriff’s Department Reserve Division. He then served with the Memphis Police Department Reserves from 1984 to 2009. He owned Cooper’s Restaurant and was the first two-term consecutive president of the Memphis Restaurant Association.\n\nA memorial service was held at Memorial Park Funeral Home. He was survived by Ellen Cooper, his high school sweetheart and wife of 58 years; two sons, Mike Cooper (Mickie) of Franklin, Tenn., and Brett Cooper (Judy) of Bartlett; two daughters, Roxanne Goodman (Dennis) of Freeport, Ill., and Sheri Power (Marcus) of Hampton, Va.; two brothers, Stanley and Joe Cooper; 13 grandchildren; nine great-grandchildren; and two special nephews, Trent and Todd Cooper.",clip:["clippings/louis-cooper-ca-2009-10-31.jpg"]},
{n:"Barbara Ann Cloud Marbry",r:"Reserve",u:10,y:2009,lod:false,notes:"Volunteered with the Sheriff's Department auxiliary; wife of retired deputy Bobby Larry Marbry. Exact date of death not given in the notice (July 2009).",e:"",ob:"",fb:"",dod:"2009",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Monday, July 20, 2009, page 11.\n\nBarbara Ann Cloud Marbry, 70, formerly of Memphis, died in July 2009, surrounded by friends and family. During her years in Memphis she volunteered with the auxiliary of the Shelby County Sheriff’s Department and was an active member of Highland Heights Baptist Church, Broadmoor Baptist Church and Whitten Memorial Baptist Church.\n\nServices were held Wednesday, July 22, 2009, at Family Funeral Care. She was survived by her husband of 35 years, retired Shelby County deputy Bobby Larry Marbry; her children, Lurae Holmes of Byhalia, Miss., Robin David of Roswell, Ga., Patrick Brooks of Millington, David Brooks of Alpharetta, Ga., Lauretta Merideth of West Memphis, Ark., and Larry Brooks of Panama City, Fla.; her mother, Lauretta Cloud of Berlin, Md.; four siblings; 12 grandchildren; and four great-grandchildren.",clip:["clippings/barbara-marbry-ca-2009-07-20.jpg"]},
{n:"Paul A. Dunn",r:"Reserve",u:10,y:2006,lod:false,notes:"Former reserve deputy; Korean War Army veteran; former Millington alderman",e:"",ob:"",fb:"",dod:"03/06/2006",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Thursday, March 9, 2006, page 14.\n\nPaul A. Dunn, 72, of Millington, died Monday, March 6, 2006. He was a former reserve deputy for the Shelby County Sheriff’s Department, a U.S. Army veteran of the Korean War, a retired supervisor for DuPont, a former alderman for the City of Millington, a member of First United Methodist Church, and a member of Dunham Masonic Lodge No. 150 in Covington.\n\nFuneral services were held at Munford Funeral Home Millington Chapel, with burial at Indian Creek Cemetery in Brighton, Tenn. He was preceded in death by his wife, Martha Mills Dunn, and was survived by a daughter, Paula L. Dunn Davenport of Munford; a son, Rodney K. Dunn of Germantown; his mother, Marie Dunn; four brothers; two sisters; and two grandchildren, Nikki and Cristy Davenport.",clip:["clippings/paul-dunn-ca-2006-03-09.jpg"]},
{n:"Leonard \"Lenny\" Weiner",r:"Reserve",u:10,y:2013,lod:false,notes:"Reserve, 1966–1996; reserve titles \"Inspector\" and \"Captain\" of the DUI Squad; Navy veteran",e:"",ob:"",fb:"",dod:"04/10/2013",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Thursday, April 11, 2013, page 5B.\n\nLeonard “Lenny” Weiner, 81, of Memphis, was born January 16, 1932, in Brooklyn, N.Y., and died Wednesday, April 10, 2013. He came to Memphis in 1952 while stationed at Millington Aviation Electronics, where he met and married the love of his life, Janis “Footsie” Weiner. He served in Antisubmarine Squadron 32 in Norfolk, Va., and at Patuxent River, Md., before the couple returned to Memphis in 1953, where he opened Andy’s Electronics and TV Repair.\n\nHe joined the Shelby County Sheriff’s Department in 1966 as a reserve patrol officer and retired in 1996 after 30 years of dedicated service, holding the reserve titles “Inspector” and “Captain” of the DUI Squad. He also worked for Shelby County’s administrative security division and as a private investigator with Leonard Weiner and Associates, and in 1980 he opened Omega Communications with his family, later expanding to Houston and Dallas.\n\nAn avid racquetball player, he was a regular at the JCC and one of the elite in the Senior’s Division of the International Racquetball Association. He and Footsie were active in the B’nai B’rith Youth Organization, where they were fondly known as Aunt Footsie and Uncle Lenny and were adopted by a host of “nieces and nephews” who stayed in touch with them throughout their lives. He was a member of Anshei Sphard-Beth El Emeth Congregation.\n\nHe was preceded in death by his parents, Alex and Rose Weiner, and by Footsie, his wife of 56 years. He was survived by three daughters, Dr. Sheri Weiner (Sonny Farmer), Lisa Perlen (Arthur) and Marcy Seligstein (Sidney); four granddaughters, Alison Shindledecker (Chuck), Andrea Kirshner, Whitney Perlen and Rachel Seligstein; and his two closest friends, Hal Kaufman and Pete Singer. Funeral services were held at the Katzman Memorial Chapel in the Anshei Sphard-Beth El Emeth Congregation Cemetery, with Canale Funeral Directors in charge.",clip:["clippings/lenny-weiner-ca-2013-04-11.jpg"]},
{n:"Tony Muscarella",r:"Reserve",u:10,y:1995,lod:false,notes:"Reserve deputy in the 1960s; WWII Marine Corps veteran of Iwo Jima — two Purple Hearts and a Bronze Star",e:"",ob:"",fb:"",dod:"01/21/1995",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Tuesday, January 24, 1995, page 13.\n\nTony Muscarella, 67, of Southaven, died Saturday, January 21, 1995, at Methodist Hospital. He was a reserve deputy for the Shelby County Sheriff’s Department in the 1960s and was made an honorary deputy of the Yalobusha County, Miss., Sheriff’s Department in 1989.\n\nA World War II Marine Corps veteran, he received two Purple Hearts and a Bronze Star, wrote the book Iwo Jima Young Heroes, and was presented the Key to the City of Southaven in 1991 for his outstanding service at Iwo Jima. He was a diesel mechanic for Kroger, secretary-treasurer of Freight Pac Corp. of Tennessee, a Shriner, a member of the Fourth Marine Division Association and O.K. Houck Masonic Lodge 0707, and a member of Trinity Baptist Church of Southaven.\n\nServices were held at Hernando Funeral Home, with burial in West Tennessee Veterans Cemetery. He was survived by his wife, Dovie Mae Muscarella; a daughter, Patsy Armour of Southaven; and a son, Rev. Bob Duncan of Memphis.",clip:["clippings/tony-muscarella-ca-1995-01-24.jpg"]},
{n:"Turner Gilmore Jr.",r:"Reserve",u:10,y:2010,lod:false,notes:"Volunteer deputy; named Volunteer Shelby County Sheriff Deputy of the Year, 1990, for visiting the elderly and shut-ins",e:"",ob:"",fb:"",dod:"07/20/2010",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Sunday, July 25, 2010, page B4. (The copy we have shows the first part of the obituary.)\n\nTurner Gilmore Jr., 78, died peacefully at his home on July 20, 2010, after a long illness. He always looked at life as the glass half full. He attended Booker T. Washington High School and Shelby State College.\n\nIn his early years he worked tirelessly to unionize postal workers in Memphis and the southern region and to break the barriers of segregation in the post office. He became the first president of Local 52 and ultimately regional vice president of the Mail Handlers’ Union. He later became an assistant director of the Equal Employment Opportunity Commission, retiring in 1987 after 31 years of government service.\n\nHe then turned his energies to volunteering with the Shelby County Sheriff’s Department, where he received the award as Volunteer Shelby County Sheriff Deputy for 1990 for visiting the elderly and shut-ins in Shelby County. He also created G&G Enterprises, a skills-based training program for waiters, waitresses and bartenders.",clip:["clippings/turner-gilmore-ca-2010-07-25.jpg"]},
{n:"J. Donald Smith Jr.",r:"Reserve",u:10,y:1998,lod:false,notes:"Special Deputy Sheriff, Shelby County Senior Citizens Crime Watch; Marine Corps veteran",e:"",ob:"",fb:"",dod:"04/08/1998",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Friday, April 10, 1998, page 20.\n\nJ. Donald Smith Jr., 68, of Memphis, a retired manager for Prudential Insurance Co., died of cancer Wednesday, April 8, 1998, at Methodist Hospital. He was a Special Deputy Sheriff with the Shelby County Senior Citizens Crime Watch.\n\nA Marine Corps veteran and member of Veterans of Foreign Wars Post 684, he was a past commander of the Legion of Honor; a member of Al Chymia Shrine Temple, Raleigh Lodge 770 and the Scottish Rite; and an honorary member of the Al Chymia Provost Guard. He received the Boy Scouts of America Silver Beaver award and was council commissioner of the Katooga Area Council.\n\nServices were held at Memphis Funeral Home Stage Road Chapel, with burial in West Tennessee Veterans Cemetery. He was survived by his wife, Janice N. Smith; a daughter, Janice Smith Thornhill; two sons, Donald Edwin Smith and Jeffrey Craig Smith, all of Memphis; and his mother.",clip:["clippings/donald-smith-ca-1998-04-10.jpg"]},
{n:"Robert B. \"Bob\" Howerton III",r:"Reserve",u:10,y:2012,lod:false,notes:"Reserve deputy; also served with the Bexar County (Texas) Sheriff's Department; Past Master, Bartlett Lodge No. 211",e:"",ob:"",fb:"",dod:"11/12/2012",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Tuesday, November 20, 2012, page 4DSA. (The copy we have shows the first part of the obituary.)\n\nRobert B. “Bob” Howerton III, of Germantown, Tenn., died unexpectedly November 12, 2012, at the age of 54. His family remembered him as a loving, kind and compassionate person who would go out of his way to help people in need.\n\nHe served as a reserve deputy with the Shelby County Sheriff’s Department and, at one time, with the Bexar County Sheriff’s Department in San Antonio, Texas. He worked for Home Depot in Collierville and earlier for casinos in Tunica, Miss., and for several Memphis-area health care facilities, including Methodist and Baptist Memorial. He graduated in 1977 from Bartlett High School in Anchorage, Alaska.\n\nHe was Past Master of Bartlett Lodge No. 211 F.&A.M., a 32nd Degree Mason, a member of the Memphis Scottish Rite and Rosemark York Rite Bodies, and was voted a distinguished Honorary Member of the DeMolay Legion of Honor in 2012. He was a member of Germantown United Methodist Church. He was preceded in death by his brother, Charles R.",clip:["clippings/robert-howerton-ca-2012-11-20.jpg"]},
{n:"Glen Russell Vansickle",r:"Reserve",u:10,y:2008,lod:false,notes:"Reserve; reserve title \"Captain\"",e:"",ob:"",fb:"",dod:"10/11/2008",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Monday, October 13, 2008, page 12.\n\nGlen Russell Vansickle, 71, of Memphis, died Saturday, October 11, 2008, at his home. He served in the Shelby County Sheriff’s Reserve, where he held the reserve title of “Captain.” He was a retired printer, worked at the Family Shelter, was a member of Grace Memorial Baptist Church, coached youth sports at Gaisman Park, and was an avid fisherman.\n\nServices were held at Forest Hill Funeral Home East, with burial in Forest Hill Cemetery East. He was preceded in death by a son, Ricky Vansickle, and was survived by Beverly Vansickle, his wife of 47 years; two daughters, Vicki “Missy” Walker and Pam Bendall; two sons, Kendall Vansickle and Rusty Vansickle; his grandchildren, including Adam Vansickle, whom he raised; and a sister, Johnnie Lynn Kelly.",clip:["clippings/glen-vansickle-ca-2008-10-13.jpg"]},
{n:"Kenneth L. Norwood",r:"Reserve",u:10,y:1999,lod:false,notes:"Reserve unit; Army veteran",e:"",ob:"",fb:"",dod:"08/13/1999",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Saturday, August 14, 1999, page 19.\n\nKenneth L. Norwood, 73, of Memphis, retired manager of security for Sears, Roebuck and Co., died Friday, August 13, 1999, at his home. He was a member of the Shelby County Sheriff’s Department reserve unit, an Army veteran, and a member of Wells Station Baptist Church.\n\nPrivate services were held, with entombment in Memorial Park Mausoleum; Memorial Park Funeral Home had charge. He was preceded in death by his wife, Inez Norwood, and was survived by two daughters, Carolyn Norwood of Memphis and Patricia Roberts of Burlison, Tenn.; a brother, Richard Norwood of California; two granddaughters; and a great-grandson. The family asked that memorials be sent to the American Cancer Society or St. Jude Children’s Research Hospital.",clip:["clippings/kenneth-norwood-ca-1999-08-14.jpg"]},
{n:"Jeffrey Burke Cranford",r:"Reserve",u:10,y:2010,lod:false,notes:"Member of the first class of the Reserve, organized by Sheriff Bill Morris in 1964; Korean War Army veteran; Civil Air Patrol command pilot",e:"",ob:"",fb:"",dod:"07/05/2010",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Wednesday, July 7, 2010, page DSA4.\n\nJeffrey Burke Cranford, 83, a retired Memphis businessman, died Monday, July 5, 2010, at Baptist Memorial Hospital-Memphis. In 1964 he was a member of the first class of the Shelby County Sheriff’s Reserve deputies when the unit was organized by Sheriff Bill Morris.\n\nA 1944 graduate of Christian Brothers High School, he attended the University of Alabama, where he was in the Kappa Sigma fraternity. An avid aviation enthusiast, he earned his pilot’s license in 1947, was multi-engine and instrument rated, chaired the March of Dimes Airlift for many years, and was a major in the Mid-South Wing of the Civil Air Patrol as a command pilot and mission commander. He served briefly during the Korean War with the 8th Infantry Division and was a communicant of Blessed Sacrament Catholic Church.\n\nHe was widowed in 1975 by his wife, Naomi Hayslip Cranford, and was survived by his companion of many years, Vallie Jo Witmer Bell; his half-brother, Edward Daniel Newton; and others. Private interment was at Memorial Park Cemetery, and the family asked that memorials go to Christian Brothers High School in his memory.",clip:["clippings/jeffrey-cranford-ca-2010-07-07.jpg"]},
{n:"Loran W. Shaw",r:"Reserve",u:10,y:2010,lod:false,notes:"Reserve deputy, 13 years; 22 years with the Williamston (Mich.) Volunteer Fire Department",e:"",ob:"",fb:"",dod:"08/04/2010",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Friday, August 13, 2010, page B4.\n\nLoran W. Shaw, of Bartlett, died peacefully at his home on August 4, 2010. He was born May 6, 1936, in Lansing, Mich., to Selby L. and Fern Converse Shaw, and graduated in 1954 from Williamston High School, where he played clarinet in the marching band. He was a self-employed businessman in the Lansing area and served 22 years with the Williamston Volunteer Fire Department.\n\nAfter moving to Memphis in 1982 he worked in the home improvement industry and served as a reserve deputy with the Shelby County Sheriff’s Department for 13 years.\n\nA memorial service was held at the Bartlett Municipal Center Chapel. He was survived by two sons and their wives, Mark and Mary Anne Shaw of Cary, N.C., and Bruce and Kelli Shaw of San Diego, and grandchildren Zack, Catherine and Jacqueline. The family asked that memorials go to the Shelby County Sheriff’s Reserve Division Flower Fund.",clip:["clippings/loran-shaw-ca-2010-08-13.jpg"]},
{n:"Larry E. Armstrong",r:"Reserve",u:10,y:2008,lod:false,notes:"Reserve officer; Mason and Shriner",e:"",ob:"",fb:"",dod:"03/29/2008",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Monday, March 31, 2008, page 14.\n\nLarry E. Armstrong, 60, a retired truck driver for Miller Transport, died March 29, 2008, at his home. He was a Shelby County Sheriff’s Reserve officer, a member of Frayser Apostolic Church and Emergency Services, and a Mason and Shriner.\n\nServices were held at Munford Funeral Home Munford Chapel, with burial in Helen Crigger Cemetery in Munford. He was preceded in death by his son, Larry Armstrong Jr., and by brothers Donnie Armstrong, Jimmy Muntz and Edward Muntz. He was survived by Mary Evelyn Armstrong, his wife of 32 years; three daughters, Regina K. Hill of New Albany, Miss., Tracie D. Sharpe of Memphis and Julie M. Pruitt of Robinsonville, Miss.; two sons, Shawn Armstrong of Senatobia, Miss., and Mark A. Dunn of Memphis; two sisters; five brothers; and eight grandchildren.",clip:["clippings/larry-armstrong-ca-2008-03-31.jpg"]},
{n:"Robin A. \"Bob\" DeRosett Jr.",r:"Reserve",u:10,y:1995,lod:false,notes:"Reserve; reserve title \"Assistant Chief\" of the Reserve Division; WWII Army veteran (Europe)",e:"",ob:"",fb:"",dod:"05/19/1995",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Sunday, May 21, 1995, page 16.\n\nRobin A. “Bob” DeRosett Jr., 70, of Germantown, retired owner of the old Pee Dee Co., died of heart disease Friday, May 19, 1995, at Baptist Memorial Hospital. He served in the Shelby County Sheriff’s Department Reserve Division, where he held the reserve title of “Assistant Chief.” He was a World War II Army veteran who served in Europe, a life member of the National Rifle Association, a member of the American Legion, and had attended Morgan Preparatory School in Petersburg, Tenn.\n\nServices were held at Memphis Funeral Home Poplar Chapel, with burial in Memorial Park. He was survived by a cousin who cared for him, Dorothy Amagliani of Memphis, and two friends who cared for him, Wallace Madewell of Memphis and Bobby Welch of Cordova.",clip:["clippings/bob-derosett-ca-1995-05-21.jpg"]},
{n:"Isaac \"Zeke\" Lee Hilton",r:"Reserve",u:10,y:2007,lod:false,notes:"NOT YET VERIFIED by the Retirees group — obituary says he served with the Sheriff's Department after Navy retirement but does not say regular or reserve; filed under Reserve until confirmed. Navy veteran of WWII, Korea and Vietnam (24 years); Purple Heart",e:"",ob:"",fb:"",dod:"06/14/2007",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Sunday, June 17, 2007, page 16.\n\nIsaac “Zeke” Lee Hilton, of Millington, died Thursday, June 14, 2007, at Methodist North Hospital after a long illness. He was born March 7, 1927, in Hornbeak, Tenn.\n\nHe had a long and distinguished Navy career, serving in World War II, Korea and Vietnam and retiring after 24 years as an ADRC. He served aboard the USS Castor, USS Porter and USS Gregory and was stationed at NAS Alameda, Calif., and NAS Millington. His decorations included the Purple Heart, Presidential Unit Citation, Navy Unit Commendation, five Good Conduct Medals, the American Campaign Medal, three Asiatic-Pacific Campaign Medals, the WWII Victory Medal, National Defense Medal, Vietnam Service Medal, Naval Reserve Medal and Republic of Vietnam Campaign Medal. After his military retirement he served with the Shelby County Sheriff’s Department and the City of Millington. He and his wife, Lita, were longtime owners of West Tennessee Properties, where he was a broker and realtor.\n\nHe was a member of Raleigh Baptist Church, a 32nd Degree Mason, Scottish Rite, Shriner, and a life member of VFW Post 7175. Services were held at Munford Funeral Home, Millington Chapel, with burial in Northridge/Woodhaven in Millington with full military honors. He was survived by Lita, his wife of almost 59 years; a daughter, Sherry (Richard) Ritter of Millington; a son, Stanley (Paula) Hilton of Loudon, Tenn.; three grandsons; five great-grandchildren; and a sister, Beverly Carr of Huntsville, Ala.",clip:["clippings/zeke-hilton-ca-2007-06-17.jpg"]},
{n:"E. Lloyd Phelps Jr.",r:"Reserve",u:10,y:2016,lod:false,notes:"Reserve officer, 22 years; reserve title \"Inspector\"; 18 years in the Training Division; founded B.I.G. for Memphis",e:"",ob:"",fb:"",dod:"04/17/2016",obt:"Summary of the obituary in The Commercial Appeal, Memphis, Tuesday, April 19, 2016, page 4B.\n\nE. Lloyd Phelps Jr., 63, of Lakeland, Tenn., died peacefully at home on April 17, 2016. A lifelong Memphian and member of Leawood East Baptist Church, he was president of Phelps Security, Inc., one of the oldest security companies in Memphis. He graduated from Overton High School in 1972, attended Memphis State University, and graduated from the Shelby County Sheriff’s Department Training Academy in 1977.\n\nAfter 22 years of service as a reserve officer, he retired from the Sheriff’s Office in 1999 with the reserve title of “Inspector.” His last 18 years were spent with the training division, responsible for law-enforcement training of deputies for Shelby County and surrounding agencies. He founded B.I.G. for Memphis, a business group highlighting the positive attributes of Memphis and the Memphis Police Department, and was a board member of CrimeStoppers and the MPD Fallen Officer Memorial. His passion was to make Memphis a better place to live and work.\n\nThe funeral was held at Memphis Funeral Home on Poplar Avenue. He was preceded in death by his parents, E. Lloyd Phelps Sr. and Lillian Phelps, and a sister, Yvonne Barker, and was survived by his wife, Patti Phelps; three children, Alan Phelps (Leanne), Jennifer Mack (Geoff) and Andy Phelps (Deanna); four grandchildren; a brother, Mickey Phelps (Brenda); a sister, Cherri Phelps; and many other relatives and friends. The family suggested contributions to the MPD Fallen Officer Memorial or CrimeStoppers.",clip:["clippings/lloyd-phelps-ca-2016-04-19.jpg"]},

{n:"William J. Pitts",r:"Reserve",u:10,y:1998,lod:false,notes:"Honorary deputy sheriff",e:"",ob:"",fb:"",dod:"08/25/1998",obt:"Summary of the death notice in The Commercial Appeal, Memphis, Wednesday, August 26, 1998, page 10.\n\nWilliam J. Pitts, 97, of Bartlett, a retired employee of Tri-State Refrigeration, died of congestive heart failure Tuesday, August 25, 1998, at his home. He was an honorary Shelby County deputy sheriff, a member of Leaclair Baptist Church, and a Mason.\n\nServices were held at Forest Hill Funeral Home East, with burial in Forest Hill Cemetery East. He was survived by his wife, W. Carrie Pitts; a daughter, Jan Pitts Crawford of Memphis; a grandchild; and a great-grandchild. The family asked that memorials be sent to MIFA or the American Heart Association.",clip:["clippings/william-pitts-ca-1998-08-26.jpg"]},

const BASE_JSON=JSON.stringify(EMBEDDED);

// ── RANK ORDER ────────────────────────────────────────────────
const RANK_ORDER=["Sheriff","Chief Deputy","CAO","Chief Inspector","Asst Chief","Inspector","Captain","Lieutenant","Sergeant","Patrolman","Reserve"];
let DATA=[];
let activeRank="all";
let needOnly=false;
const needsObit=o=>!o.ob&&!o.obt;

// ── GOOGLE SHEET LOADER ───────────────────────────────────────
async function loadSheet(){
  if(!SHEET_ID){
    DATA=EMBEDDED;
    setSheetStatus(false,'EMBEDDED DATA · '+DATA.length+' OFFICERS');
    return;
  }
  try{
    const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&t=${Date.now()}`;
    const res=await fetch(url,{cache:'no-store'});
    const text=await res.text();
    const json=JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/)[1]);
    const cols=json.table.cols.map(c=>String(c.label||'').trim().toLowerCase());
    const col=name=>cols.findIndex(l=>l.startsWith(name));
    const iN=col('name'),iR=col('rank'),iD=col('date'),iO=col('obit'),iE=col('employee'),iL=col('line'),iNo=col('note'),iF=col('facebook'),iT=col('obituary text');
    const iO2=cols.findIndex(l=>l.startsWith('obituary link'));
    const cell=(c,i)=>{if(i<0||!c[i]||c[i].v==null)return '';return String(c[i].f!=null?c[i].f:c[i].v).trim();};
    const extras={};EMBEDDED.forEach(o=>{extras[o.n]=o;});
    if(iN<0)throw new Error('no Name column');
    SHEET_LAST_ROW=json.table.rows.length+1;
    DATA=json.table.rows.map((row,ri)=>{
      const c=row.c||[];
      const n=cell(c,iN);if(!n)return null;
      let r=cell(c,iR)||'Patrolman';
      const match=RANK_ORDER.find(x=>x.toLowerCase()===r.toLowerCase());r=match||r;
      const dRaw=cell(c,iD);let dod='',y=null;
      if(/^\d{4}$/.test(dRaw))y=parseInt(dRaw);else if(dRaw){dod=fmtDate(dRaw);y=yearOf(dod);}
      else if(extras[n]&&!extras[n].dod&&extras[n].y)y=extras[n].y;
      const lodTxt=cell(c,iL).toLowerCase();
      const ex=extras[n]||{};
      return {_row:ri+2,n,r,u:rankUnit(r),y,dod,
        lod:/^(y|yes|true|x|✓)/.test(lodTxt),
        notes:cell(c,iNo),e:fmtEmp(cell(c,iE)),ob:cell(c,iO2>=0?iO2:iO),fb:cell(c,iF),
        obt:cell(c,iT)||ex.obt||'',ph:ex.ph||'',gal:ex.gal||[]};
    }).filter(Boolean);
    if(!DATA.length)throw new Error('empty sheet');
    DATA.forEach(o=>{if(!RANK_ORDER.includes(o.r))RANK_ORDER.push(o.r);});
    setSheetStatus(true,'LIVE FROM THE ROSTER SHEET · '+DATA.length+' OFFICERS');
  }catch(e){
    DATA=EMBEDDED;
    setSheetStatus(false,'SHEET ERROR · USING EMBEDDED DATA');
  }
}

// Normalize employee numbers to S-9999 (accepts "s1234", "S 1234", "1234")
function fmtEmp(v){
  v=String(v||'').trim().toUpperCase();
  if(!v)return '';
  const m=v.match(/^S?[\s-]*(\d{1,5})$/);
  return m?'S-'+m[1].padStart(4,'0'):v;
}
// Accepts 3/14/1990, 03-14-1990, 1990-03-14 -> "03/14/1990"; anything else is returned as typed
function fmtDate(v){
  v=String(v||'').trim();
  if(!v)return '';
  let m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(m)return m[1].padStart(2,'0')+'/'+m[2].padStart(2,'0')+'/'+m[3];
  m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return m[2].padStart(2,'0')+'/'+m[3].padStart(2,'0')+'/'+m[1];
  return v;
}
function validDate(s){
  const m=String(s).match(/^(\d\d)\/(\d\d)\/(\d{4})$/);if(!m)return false;
  const d=new Date(+m[3],+m[1]-1,+m[2]);
  return d.getFullYear()==+m[3]&&d.getMonth()==+m[1]-1&&d.getDate()==+m[2]&&d<=new Date();
}
function yearOf(s){const m=String(s||'').match(/(\d{4})/);return m?parseInt(m[1]):null;}
function longDate(s){
  const m=String(s||'').match(/^(\d\d)\/(\d\d)\/(\d{4})$/);if(!m)return s||'';
  return ['January','February','March','April','May','June','July','August','September','October','November','December'][+m[1]-1]+' '+(+m[2])+', '+m[3];
}
// Photos sent by the public go to this address; an administrator reviews them

// in pieces so spam robots can't easily read it from the page.
const PHOTO_EMAIL=['johnharvey.usa','gmail.com'].join('@');
function sendPhotoLink(o,kind){
  kind=kind||'photo or article';
  const subj='End of Watch '+kind+': '+o.n+' ('+o.r+')';
  const body='Officer: '+o.n+' ('+o.r+')\n\nPlease attach your '+kind+' to this email (a picture, a newspaper clipping, an obituary, or a link). You can also type what you know below.\n\nYour name:\nHow you knew him or her:\nDate of death (if known):\nWhere it is from (newspaper and date, or who took the photo):\n\nThank you. An administrator will review it and add it to the End of Watch memorial.';
  return 'mailto:'+PHOTO_EMAIL+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
}
function openLightbox(src){document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').classList.add('open');}
function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return u;}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:'';}
function photosLink(o){return safeUrl(o.fb)||FB_GROUP+'/search/?q='+encodeURIComponent(o.n);}
// Common given-name ↔ nickname pairs, so a search for "William" also finds "Bill"
const NICK={william:['bill','billy','will'],robert:['bob','bobby','rob'],richard:['dick','rick','ricky'],
  james:['jim','jimmy'],john:['johnny','jack'],joseph:['joe','joey'],charles:['charlie','chuck'],
  thomas:['tom','tommy'],michael:['mike'],edward:['ed','eddie'],ronald:['ron','ronnie'],
  donald:['don','donnie'],gerald:['jerry'],jerome:['jerry'],lawrence:['larry'],kenneth:['ken','kenny'],
  stephen:['steve'],steven:['steve'],timothy:['tim'],daniel:['dan','danny'],david:['dave'],
  samuel:['sam'],henry:['hank'],harold:['hal'],frederick:['fred'],raymond:['ray'],patrick:['pat'],
  patricia:['pat','patti'],elizabeth:['betty','beth'],gregory:['greg'],douglas:['doug'],
  benjamin:['ben','benny'],anthony:['tony'],nicholas:['nick'],leonard:['leon','len'],
  clifford:['cliff'],mitchell:['mitch'],herbert:['herb'],walter:['walt'],woodrow:['woody'],
  carolyn:['carol'],judith:['judy'],pamela:['pam'],kathleen:['kathy'],katherine:['kathy'],
  rodney:['roddy'],alton:['a.c.']};
const NICK_TO={};Object.entries(NICK).forEach(([g,ns])=>ns.forEach(n=>(NICK_TO[n]=NICK_TO[n]||[]).push(g)));
function nameVariants(full){
  const words=String(full||'').replace(/["“”'‘’()]/g,' ').replace(/,/g,' ').trim().split(/\s+/)
    .filter(w=>!/^(jr|sr|ii|iii|iv)\.?$/i.test(w));
  if(words.length<2)return [words.join(' ')];
  const first=words[0],last=words[words.length-1];
  const firsts=new Set([first]);
  const lower=first.toLowerCase();
  (NICK[lower]||[]).forEach(n=>firsts.add(n));
  (NICK_TO[lower]||[]).forEach(g=>firsts.add(g));
  // a nickname written in the middle, e.g. "William Billy Wicks" or "Robert Bobby Simmons"
  words.slice(1,-1).forEach(w=>{const l=w.toLowerCase();if(NICK_TO[l]||NICK[l])firsts.add(w);});
  const cap=s=>s.length<3&&s.includes('.')?s.toUpperCase():s.charAt(0).toUpperCase()+s.slice(1);
  const seen=new Set();
  return [...firsts].map(f=>cap(f)+' '+last).filter(n=>{const k=n.toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});
}
function obitSearchLink(o){
  const v=nameVariants(o.n).slice(0,4);
  // each name both exactly and with a wildcard for a middle name or initial: "John * Carlisle"
  const names=v.flatMap(n=>{const w=n.split(' ');return ['"'+n+'"','"'+w[0]+' * '+w.slice(1).join(' ')+'"'];}).join(' OR ');
  const yr=o.y?' '+o.y:'';
  return 'https://www.google.com/search?q='+encodeURIComponent('('+names+') obituary (Memphis OR Shelby OR Tennessee OR Mississippi OR Arkansas OR Missouri) (sheriff OR deputy)'+yr);
}
function commercialAppealLink(o){
  const v=nameVariants(o.n).slice(0,4);
  const names=v.flatMap(n=>{const w=n.split(' ');return ['"'+n+'"','"'+w[0]+' * '+w.slice(1).join(' ')+'"'];}).join(' OR ');
  return 'https://www.google.com/search?q='+encodeURIComponent('('+names+') obituary "Commercial Appeal"');
}
function lastNameSearchLink(o){
  const v=nameVariants(o.n);const last=(v[0]||'').split(' ').slice(1).join(' ');
  return 'https://www.google.com/search?q='+encodeURIComponent('"'+last+'" obituary (Memphis OR Shelby OR Tennessee OR Mississippi OR Arkansas OR Missouri) (sheriff OR deputy)'+(o.y?' '+o.y:''));
}
function findAGraveLink(o){
  const words=String(o.n||'').replace(/["“”'‘’()]/g,' ').trim().split(/\s+/).filter(w=>!/^(jr|sr|ii|iii|iv)\.?$/i.test(w));
  const first=words[0]||'',last=words[words.length-1]||'';
  let u='https://www.findagrave.com/memorial/search?firstname='+encodeURIComponent(first)+'&lastname='+encodeURIComponent(last)+'&location='+encodeURIComponent('Tennessee, United States of America');
  if(o.y)u+='&deathyear='+o.y+'&deathyearfilter=exact';
  return u;
}

function buildPills(){
  let html=`<button class="pill active" onclick="setRank('all',this)">ALL <span class="n">${DATA.length}</span></button>`;
  RANK_ORDER.forEach(rk=>{
    const cnt=DATA.filter(o=>o.r===rk).length;
    if(cnt) html+=`<button class="pill" onclick="setRank('${rk}',this)">${rk.toUpperCase()} <span class="n">${cnt}</span></button>`;
  });
  document.getElementById('pills').innerHTML=html;
  drawNeedBar();
  document.getElementById('yodCount').textContent=DATA.filter(o=>o.y).length;
  document.getElementById('lodCount').textContent=DATA.filter(o=>o.lod).length;
}

function drawNeedBar(){
  const pool=DATA.filter(o=>activeRank==='all'||o.r===activeRank);
  const n=pool.filter(needsObit).length;
  const where=activeRank==='all'?'':' ('+activeRank.toUpperCase()+')';
  document.getElementById('needBar').innerHTML=needOnly
    ?`<button class="need-btn on" onclick="setNeed(false)">✓ SHOWING ONLY ${n} WITH NO OBITUARY${where} · SHOW ALL</button>`
    :`<button class="need-btn" onclick="setNeed(true)">📜 SHOW ONLY THOSE NEEDING AN OBITUARY${where} <span class="n">${n}</span></button>`;
}
function setNeed(on,rk){
  needOnly=on;
  if(rk){activeRank=rk;document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('active',p.getAttribute('onclick')==="setRank('"+rk+"',this)"));}
  render();
  if(rk)window.scrollTo({top:document.getElementById('listWrap').offsetTop-80,behavior:'smooth'});
}
function clearSearch(){
  const s=document.getElementById('searchInput');if(s)s.value='';
  activeRank='all';needOnly=false;
  document.querySelectorAll('.pill').forEach((p,i)=>p.classList.toggle('active',i===0));
  render();
}
function setRank(k,el){
  activeRank=k;
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  render();
}

// ── RENDER ────────────────────────────────────────────────────
function render(){
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  const filtered=DATA.filter(o=>{
    if(activeRank!=='all'&&o.r!==activeRank)return false;
    if(needOnly&&!needsObit(o))return false;
    if(q&&!o.n.toLowerCase().includes(q)&&!o.notes.toLowerCase().includes(q)&&!(o.e||'').toLowerCase().includes(q))return false;
    return true;
  });
  drawNeedBar();
  document.getElementById('visCount').textContent=filtered.length;
  document.getElementById('footCount').textContent=filtered.length+' OF '+DATA.length+' OFFICERS';
  const wrap=document.getElementById('listWrap');
  if(!filtered.length&&needOnly&&!q){wrap.innerHTML='<div class="empty"><div style="font-size:32px">✓</div><p>EVERY OFFICER HERE HAS AN OBITUARY</p><button class="d-btn" style="width:auto;margin:14px auto 0;display:inline-flex" onclick="setNeed(false)">SHOW EVERYONE</button></div>';return;}
  if(!filtered.length){wrap.innerHTML='<div class="empty"><div style="font-size:32px">🕯</div><p>NO OFFICERS FOUND</p>'+(q?'<p style="font-size:15px;letter-spacing:1px;text-transform:none;font-family:\'Crimson Pro\',serif;color:var(--text-bright)">Nobody matches “'+esc(q)+'”.</p><button class="d-btn" style="width:auto;margin:14px auto 0;display:inline-flex" onclick="clearSearch()">✕ CLEAR SEARCH &amp; SHOW EVERYONE</button>':'')+'</div>';return;}
  const groups={};
  filtered.forEach(o=>{if(!groups[o.r])groups[o.r]=[];groups[o.r].push(o);});
  let html='';
  RANK_ORDER.forEach(rk=>{
    if(!groups[rk])return;
    const officers=groups[rk];
    html+=`<div class="rank-group"><div class="rank-hdr"><span class="rank-lbl">${rk.toUpperCase()}</span><span class="rank-cnt">${officers.length} OFFICER${officers.length!==1?'S':''}</span>${(()=>{const m=DATA.filter(x=>x.r===rk&&needsObit(x)).length;if(!m)return '<span class="rank-cnt" style="margin-left:auto">✓ ALL HAVE OBITUARIES</span>';return (needOnly&&activeRank===rk)?`<button class="rank-need on" onclick="setNeed(false,'all')">SHOW EVERYONE</button>`:`<button class="rank-need" onclick="setNeed(true,'${rk}')">${m} NEED OBITUARY</button>`;})()}</div>`;
    officers.forEach(o=>{
      const idx=DATA.indexOf(o);
      html+=`<div class="row${o.lod?' lod':''}" onclick="showDetail(${idx})">
        <div class="row-star">${o.lod?'🎖':'★'}</div>
        <div class="row-info">
          <div class="row-name">${o.n}${o.lod?'<span class="lod-tag">LOD</span>':''}</div>
          <div class="row-sub">${o.e?'<span class="row-emp">'+esc(o.e)+'</span> · ':''}${o.r.toUpperCase()}${o.notes?' · '+o.notes.substring(0,40).toUpperCase():''}${(!o.ob&&!o.obt)?' <span class="noobit-tag">NO OBITUARY ON FILE</span>':''}</div>
        </div>
        <div class="row-yr">${o.y||''}</div>
      </div>`;
    });
    html+='</div>';
  });
  wrap.innerHTML=html;
}

const ADMIN_HASH = 111271057249131;

function cyrb53(s,seed=7){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
function setAdmin(on){

// Edits are kept on this device until "Save updated page" downloads

const EDIT_KEY='scso_eow_edits_v1';
function loadEdits(){try{return JSON.parse(localStorage.getItem(EDIT_KEY)||'{}');}catch(e){return {};}}
function storeEdits(m){try{localStorage.setItem(EDIT_KEY,JSON.stringify(m));}catch(e){alert('This browser is out of room for unsaved edits. Click SAVE UPDATED PAGE now so nothing is lost.');}}
let EDITS={};
function rankUnit(r){return {'Sheriff':1,'Chief Deputy':2,'CAO':2.5,'Asst Chief':4,'Chief Inspector':4.5,'Inspector':5,'Captain':6,'Lieutenant':7,'Sergeant':8,'Patrolman':9,'Reserve':10}[r]||9;}
function insertOfficer(rec){
  const last=o=>o.n.replace(/["']/g,'').trim().split(/\s+/).pop().toLowerCase();
  let after=-1;
  for(let i=0;i<DATA.length;i++){
    if(DATA[i].r!==rec.r)continue;
    if(last(DATA[i])>last(rec)){DATA.splice(i,0,rec);return i;}
    after=i;
  }
  if(after>=0){DATA.splice(after+1,0,rec);return after+1;}
  DATA.push(rec);return DATA.length-1;
}
const RECENT_KEY='scso_eow_recent_v1';
function loadRecent(){try{const r=JSON.parse(localStorage.getItem(RECENT_KEY)||'null');return r&&Date.now()-r.t<15*60*1000?r.edits:{};}catch(e){return {};}}
function rememberRecent(ed){try{const old=loadRecent();localStorage.setItem(RECENT_KEY,JSON.stringify({t:Date.now(),edits:Object.assign(old,ed)}));}catch(e){}}
function applyEdits(){
  mergeEdits(loadRecent());
  EDITS=loadEdits();
  mergeEdits(EDITS);
  updateSaveBar();
}
function mergeEdits(ED){
  Object.entries(ED).forEach(([n,x])=>{if(!x||!x.add)return;const ex=DATA.find(o=>o.n===n);if(ex)Object.assign(ex,x.add);else insertOfficer(Object.assign({e:'',ob:'',fb:'',dod:'',obt:'',ph:'',y:null,lod:false,notes:''},x.add));});
  Object.entries(ED).forEach(([n,x])=>{if(x&&x.del){const i=DATA.findIndex(o=>o.n===n);if(i>=0)DATA.splice(i,1);}});
  DATA.forEach(o=>{const x=ED[o.n];if(x&&!x.del&&'e' in x){o.e=x.e;o.ob=x.ob;o.fb=x.fb;o.obt=x.obt||o.obt||'';if('ph' in x)o.ph=x.ph;if('gal' in x)o.gal=x.gal;if('y' in x){o.dod=x.dod||'';o.y=x.y;}}});
}

function shrinkPhoto(file,max=480){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type)){rej(new Error('Not a picture'));return;}
    const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{
      const s=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.8));};im.onerror=()=>rej(new Error('Could not read picture'));im.src=r.result;};
    r.onerror=()=>rej(new Error('Could not read file'));r.readAsDataURL(file);
  });
}

// ENC_KEY holds John's GitHub key, locked with the administrator passcode.
// Only someone who signs in with the passcode can unlock it, in their own browser.
const ENC_KEY = '';
let PENDING_ENC = '';
function b64u8(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function u8b64(u){let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
async function passKey(pass,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(pass).trim().toUpperCase()),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function lockKey(tok,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await passKey(pass,salt),new TextEncoder().encode(tok)));
  const all=new Uint8Array(28+ct.length);all.set(salt,0);all.set(iv,16);all.set(ct,28);
  return u8b64(all);
}
async function unlockKey(blob,pass){
  const all=b64u8(blob);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(16,28)},await passKey(pass,all.slice(0,16)),all.slice(28));
  return new TextDecoder().decode(pt);
}
async function getSaveKey(){
  const local=ghToken();if(local)return local;
  if(!ENC_KEY)return '';
  let pass='';try{pass=sessionStorage.getItem('scso_eow_pass')||'';}catch(e){}

}
function withEncKey(src){
  if(!PENDING_ENC)return src;

function buildPageSource(base){
  const lines=DATA.map(o=>`{n:${q(o.n)},r:${q(o.r)},u:${o.u},y:${o.y==null?'null':o.y},lod:${!!o.lod},notes:${q(o.notes)},e:${q(o.e)},ob:${q(o.ob)},fb:${q(o.fb)},dod:${q(o.dod)}${o.obt?',obt:'+q(o.obt):''}${o.ph?',ph:'+q(o.ph):''}${(o.gal&&o.gal.length)?',gal:['+o.gal.map(q).join(',')+']':''}${(o.clip&&o.clip.length)?',clip:['+o.clip.map(q).join(',')+']':''}}`);
  let src=(base||PAGE_SRC).replace(/const EMBEDDED = \[[\s\S]*?\n\];/,()=>'const EMBEDDED = [\n'+lines.join(',\n')+'\n];');
  const d=new Date(),mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  return src.replace(/LAST UPDATED \d\d\/\d\d\/\d{4}/,'LAST UPDATED '+mm+'/'+dd+'/'+d.getFullYear());
}
function fromB64(b64){const s=atob(b64.replace(/\s/g,''));const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return new TextDecoder().decode(b);}
function toB64(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}

async function publishWithKey(){
  if(!IS_ADMIN||PUBLISHING||!Object.keys(EDITS).length)return;

  if(!tok){
    if(ENC_KEY){alert('Please sign out and sign in again with the passcode, then click Save. Your change is kept on this computer.');}
    else showKeySetup();
    return;
  }
  PUBLISHING=true;updateSaveBar();
  const msg=document.getElementById('saveMsg');
  const api='https://api.github.com/repos/'+GH_REPO+'/contents/'+GH_FILE;
  const base='https://api.github.com/repos/'+GH_REPO+'/contents/';
  const hdr={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  const LOCAL=DATA;
  try{
    for(let attempt=1;attempt<=3;attempt++){
      const cur=await fetch(api+'?ref=main&t='+Date.now(),{headers:hdr,cache:'no-store'});
      if(cur.status===401||cur.status===403||cur.status===404){
        try{localStorage.removeItem(GH_KEY);}catch(e){}

      try{
        src=fromB64(info.content);

      }catch(e){src=PAGE_SRC;list=null;}

      let up=0;
      for(const o of DATA){

        for(let i=0;i<o.gal.length;i++){
          const g=o.gal[i];
          if(!/^data:image\//.test(g))continue;
          const slug=o.n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
          const path='photos/'+slug+'-'+Date.now().toString(36)+'-'+i+'.jpg';

          const r=await fetch(base+path,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hdr),

          if(!r.ok)throw new Error('photo upload failed ('+r.status+')');

      }

      const names=Object.keys(EDITS);

      if((put.status===409||put.status===422)&&attempt<3){DATA=LOCAL;await new Promise(r=>setTimeout(r,1200));continue;}
      if(!put.ok)throw new Error('GitHub answered '+put.status);
      rememberRecent(EDITS);
      EDITS={};try{localStorage.removeItem(EDIT_KEY);}catch(e){}
      PUBLISHING=false;updateSaveBar();
      buildPills();render();
      // refresh an open officer card so its buttons point at the right person
      if(document.getElementById('overlay').classList.contains('open')&&CUR_NAME&&document.getElementById('editToggle')&&!document.getElementById('editBox').innerHTML){
        const i=DATA.findIndex(o=>o.n===CUR_NAME);if(i>=0)showDetail(i);
      }
      toast('✓ Saved to the website. Everyone will see it within 1 to 2 minutes.');
      return;
    }
  }catch(e){
    DATA=LOCAL;PUBLISHING=false;updateSaveBar();buildPills();render();
    alert('Could not save to the website right now ('+e.message+'). Your change is kept on this computer. Check your internet connection, then click TRY SAVING AGAIN on the gold bar.');
  }
}

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SCSO_EndOfWatch.html';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  alert('A backup copy was downloaded as SCSO_EndOfWatch.html. Your changes are still waiting to be published.');
}

// ── MEMORIAL BANNER (PNG download) ────────────────────────────
async function downloadBanner(idx){
  const o=DATA[idx];
  try{await document.fonts.ready;}catch(e){}
  const W=1200,H=630,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1e2a12');g.addColorStop(1,'#0e110a');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='#4a7a28';x.lineWidth=4;x.strokeRect(18,18,W-36,H-36);
  x.strokeStyle='rgba(212,196,132,.45)';x.lineWidth=1;x.strokeRect(30,30,W-60,H-60);
  const img=new Image();img.src=BADGE_SRC;
  await new Promise(r=>{img.onload=r;img.onerror=r;});
  x.save();x.shadowColor='rgba(0,0,0,.7)';x.shadowBlur=24;x.drawImage(img,70,135,360,360);x.restore();
  const cx=800;x.textAlign='center';
  x.fillStyle='#8a7e52';x.font='600 20px Cinzel, Georgia, serif';
  x.fillText(spaced("SHELBY COUNTY SHERIFF'S OFFICE"),cx,120);
  x.fillStyle='#d4c484';x.font='700 54px Cinzel, Georgia, serif';
  x.fillText(spaced('END OF WATCH'),cx,190);
  x.fillStyle='#4a7a28';x.fillRect(cx-170,215,340,2);
  x.fillStyle='#6db33f';x.font='600 26px Cinzel, Georgia, serif';
  x.fillText(spaced((o.lod?o.r+' · LINE OF DUTY':o.r).toUpperCase()),cx,272);
  let size=58;x.font=`700 ${size}px Cinzel, Georgia, serif`;
  while(x.measureText(o.n).width>660&&size>30){size-=2;x.font=`700 ${size}px Cinzel, Georgia, serif`;}
  x.fillStyle='#ede6b8';x.fillText(o.n,cx,350);
  x.fillStyle='#d4c484';x.font='600 30px Cinzel, Georgia, serif';
  x.fillText(o.e?o.e:'',cx,410);
  x.fillStyle='#cec99a';x.font='italic 30px "Crimson Pro", Georgia, serif';
  x.fillText(o.dod?'End of Watch · '+longDate(o.dod):(o.y?'End of Watch '+o.y:'In Honor of Those Who Served'),cx,o.e?470:440);
  x.fillStyle='#7a7552';x.font='600 16px Cinzel, Georgia, serif';
  x.fillText(spaced('GONE BUT NEVER FORGOTTEN'),cx,560);
  c.toBlob(b=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download=(o.e?o.e+'_':'')+o.n.replace(/[^A-Za-z0-9]+/g,'_')+'_EOW_Banner.png';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  },'image/png');
}
function spaced(s){return s.split('').join(String.fromCharCode(8202));}

function openFromHash(){
  const hsh=decodeURIComponent(location.hash.slice(1)).replace(/\+/g,' ');
  if(hsh==='share')return showShare();
  if(hsh.startsWith('officer=')){const n=hsh.slice(8).trim().toLowerCase();const i=DATA.findIndex(o=>o.n.toLowerCase()===n);if(i>=0)showDetail(i);}
}
window.addEventListener('hashchange',openFromHash);
